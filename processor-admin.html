/* =========================================================================
   ルーティング・描画
   ========================================================================= */
const VIEWS = {
  approvals: viewApprovals, board: viewBoard, proxy: viewProxy,
  capacity: viewCapacity, pickupcap: viewPickupCap,
  reception: viewReception, actuals: viewActuals, closing: viewClosing,
  audit: viewAudit
};
Object.keys(MASTERS).forEach(k => VIEWS[k] = () => viewMaster(k));

const MODALS = {
  approve: MODALS_APPROVE, reject: MODALS_REJECT, resv: MODALS_RESV,
  changeSlot: MODALS_CHANGESLOT, changeVisit: MODALS_CHANGEVISIT, cancel: MODALS_CANCEL,
  daycap: MODALS_DAYCAP, pickupday: MODALS_PICKUPDAY,
  weigh: MODALS_WEIGH, spot: MODALS_SPOT, reject2: MODALS_REJECT2,
  actual: MODALS_ACTUAL, close: MODALS_CLOSE, master: MODALS_MASTER
};

const nowHm = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
let lastRoute = null;

function focusKey(el) {
  if (!el || !el.dataset) return null;
  const d = el.dataset;
  if (d.px)  return 'px:'  + d.px;
  if (d.mod) return 'mod:' + d.mod;
  if (d.cap) return 'cap:' + d.cap;
  if (d.key) return 'key:' + d.key;
  return null;
}
function restoreFocus(key, pos) {
  if (!key) return;
  const i = key.indexOf(':'), t = key.slice(0, i), v = key.slice(i+1);
  const el = document.querySelector(`[data-${t}="${window.CSS && CSS.escape ? CSS.escape(v) : v}"]`);
  if (!el) return;
  el.focus({preventScroll:true});
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}

function renderSidebar() {
  const html = NAV.map(sec => {
    const items = sec.items.map(it => {
      const lock = !allowed(it.route);
      const cnt = it.badge ? pendingCount() : 0;
      return `<a href="#${it.route}" class="navitem ${state.route === it.route ? 'active' : ''} ${lock ? 'locked' : ''}"
        data-act="go" data-route="${it.route}" ${lock ? 'aria-disabled="true" title="このロールでは利用できません"' : ''}>
        <span class="ico">${it.ico}</span><span>${it.label}</span>
        ${cnt ? `<span class="cnt">${cnt}</span>` : ''}${lock ? '<span class="tag">権限外</span>' : ''}</a>`;
    }).join('');
    return `<div class="navsec">${sec.sec}</div>${items}`;
  }).join('');
  document.getElementById('elSidebar').innerHTML = html;
}

function renderChrome() {
  const ss = document.getElementById('elSiteSel');
  if (!ss.options.length) {
    ss.innerHTML = BASES.map(b => `<option value="${b.id}" ${b.disabled ? 'disabled' : ''}>${b.name}</option>`).join('');
    document.getElementById('elRoleSel').innerHTML = ROLES.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  }
  ss.value = state.base;
  document.getElementById('elRoleSel').value = state.role;
  const n = pendingCount();
  document.getElementById('elNotifCnt').innerHTML = n
    ? ` <span class="badge b-rejected b-sq" style="padding:1px 6px">${n}</span>` : '';
}

function render() {
  const y = window.scrollY;
  const af = document.activeElement, fk = focusKey(af);
  const pos = af && af.setSelectionRange ? (af.selectionStart || 0) : 0;
  renderChrome();
  renderSidebar();
  const el = document.getElementById('elView');
  if (!allowed(state.route)) {
    el.innerHTML = `<div class="empty"><b>${esc(ROLES.find(r => r.id === state.role).name)}</b> のロールでは、この画面を利用できません。<br>
      <span style="font-size:13px">画面ごとの権限は、右上のロール切替で確認できます。</span></div>`;
  } else {
    el.innerHTML = VIEWS[state.route]();
  }
  if (state.route !== lastRoute) { window.scrollTo(0,0); lastRoute = state.route; }
  else window.scrollTo(0, y);
  restoreFocus(fk, pos);
  if (location.hash.slice(1) !== state.route) history.replaceState(null, '', '#' + state.route);
}

function go(route) {
  state.route = route;
  document.getElementById('elSidebar').classList.remove('open');
  render();
}

/* =========================================================================
   イベント
   ========================================================================= */
/* --- 入力（テキスト・数値） --- */
document.addEventListener('input', e => {
  const d = e.target.dataset;
  const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (d.px) { setPath(state.proxy, d.px, val); if (d.px === 'date' || d.px === 'emitterId') render(); return; }
  if (d.mod) { modBind(d.mod, val, e.target); if (d.rerender) renderModal(); return; }
  if (d.act === 'apFilter') { state.approval[d.key] = val; render(); return; }
  if (d.act === 'recQ') { state.reception.q = val; render(); return; }
  if (d.act === 'acFilter') { state.actuals[d.key] = val; render(); return; }
});
/* --- 変更（セレクト・チェック・日付） ---
   テキスト入力の change はフォーカスが外れた瞬間に発火する。ここで再描画すると、
   クリックしようとしたボタンが mousedown と mouseup の間で作り直されてクリックが
   失われるため、再描画はセレクト・チェックボックス・日付だけに限定する。
   テキスト入力の値は input イベント側で保持済み。 */
document.addEventListener('change', e => {
  const d = e.target.dataset;
  const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  const structural = e.target.tagName === 'SELECT' || ['checkbox','radio','date'].includes(e.target.type);
  if (d.px) {
    setPath(state.proxy, d.px, val);
    if (d.px === 'applicantId') { state.proxy.emitterId = ''; state.proxy.siteId = ''; }
    if (d.px === 'emitterId') state.proxy.siteId = '';
    if (d.px === 'date') state.proxy.slotId = '';
    if (structural) render();
    return;
  }
  if (d.mod) { modBind(d.mod, val, e.target); if (structural) renderModal(); return; }
  if (d.act === 'boardDate') { state.board.date = val; render(); return; }
  if (d.act === 'acFilter') { state.actuals[d.key] = val; if (structural) render(); return; }
  if (d.act === 'apFilter') { state.approval[d.key] = val; if (structural) render(); return; }
  if (d.act === 'switchRole') { state.role = val; if (!allowed(state.route)) state.route = 'approvals'; render(); return; }
  if (d.act === 'switchSite') { state.base = val; render(); return; }
});

function modBind(key, val, el) {
  const m = state.modal; if (!m) return;
  if (key.startsWith('row.'))  { setPath(m.row, key.slice(4), val); return; }
  if (key.startsWith('multi.')) {
    const [, f, v] = key.split('.');
    m.row[f] = m.row[f] || [];
    if (val) { if (!m.row[f].includes(v)) m.row[f].push(v); }
    else m.row[f] = m.row[f].filter(x => x !== v);
    return;
  }
  if (key.startsWith('extra.')) {
    const id = key.split('.')[1];
    m.extras = m.extras || [];
    if (val) { if (!m.extras.find(x => x.id === id)) m.extras.push({id, qty:1}); }
    else m.extras = m.extras.filter(x => x.id !== id);
    return;
  }
  setPath(m, key, val);
}

/* --- クリック --- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (el.tagName === 'A') e.preventDefault();
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const m = state.modal;

  switch (a) {
    /* ---- 共通 ---- */
    case 'go': if (allowed(d.route)) go(d.route); else toast('このロールでは利用できない画面です', 'warn'); break;
    case 'toggleNav': document.getElementById('elSidebar').classList.toggle('open'); break;
    case 'toggleNote': state.noteOpen = state.noteOpen === d.route ? null : d.route; render(); break;
    case 'closeModal': closeModal(); render(); break;
    case 'openNotif':
      toast(`承認待ち ${pendingCount()} 件（G-01：本番の通知チャネルはLINE／LINE WORKS等を想定・要確定）`);
      go('approvals'); break;

    /* ---- 承認キュー ---- */
    case 'selApproval': state.approval.sel = d.no; render(); break;
    case 'openResvDetail': openModal('resv', {no:d.no}); break;
    case 'openApprove': {
      const r = resv(d.no);
      openModal('approve', {no:d.no, date:r.date, slotId:r.slotId,
        visitDate:r.date, visitFrom:r.startAt, visitTo:r.endAt, dispatchNote:r.dispatchNote || '', comment:''});
      break;
    }
    case 'openReject': openModal('reject', {no:d.no, reason:''}); break;
    case 'pickAlt':
      m.reason = (m.reason ? m.reason.replace(/\s*$/,'') + '\n' : '') + `代替候補：${d.label}（${d.rest}）`;
      renderModal(); break;
    case 'doApprove': {
      const r = resv(m.no);
      if (r.method === 'drop') {
        r.date = m.date || r.date; r.slotId = m.slotId || r.slotId;
      } else {
        if (!m.visitDate || !m.visitFrom || !m.visitTo) { m.err = '訪問日時を入力してください。'; renderModal(); return; }
        if (m.visitTo <= m.visitFrom) { m.err = '終了時刻は開始時刻より後にしてください。'; renderModal(); return; }
        Object.assign(r, {visitDate:m.visitDate, visitFrom:m.visitFrom, visitTo:m.visitTo, dispatchNote:m.dispatchNote || ''});
      }
      r.status = 'approved'; r.approvedAt = `${D(0)} ${nowHm()}`; r.approvedBy = me().user;
      if (m.comment) r.approveComment = m.comment;
      audit('承認', r.no, r.method === 'drop'
        ? `持込／${fmtMd(r.date)} ${slotDef(r.slotId).label}`
        : `引取／訪問 ${fmtMd(r.visitDate)} ${r.visitFrom}〜${r.visitTo}`);
      closeModal();
      state.approval.sel = null;
      toast(`${r.no} を承認しました。取引先へ通知を送信しました（G-02${r.method === 'pickup' ? '／G-03 訪問日時' : ''}）。`);
      render(); break;
    }
    case 'doReject': {
      if (!m.reason || !m.reason.trim()) { m.err = '理由を入力してください。'; renderModal(); return; }
      const r = resv(m.no);
      r.status = 'rejected'; r.rejectReason = m.reason.trim();
      r.rejectedAt = `${D(0)} ${nowHm()}`; r.rejectedBy = me().user;
      audit('変更依頼', r.no, m.reason.trim().split('\n')[0]);
      closeModal(); state.approval.sel = null;
      toast(`${r.no} に変更依頼を送りました。取引先が修正して再申請します。`, 'warn');
      render(); break;
    }

    /* ---- 予約一覧ボード ---- */
    case 'boardShift': state.board.date = dstr(addDays(parseD(state.board.date), Number(d.n))); render(); break;
    case 'boardToday': state.board.date = D(0); render(); break;
    case 'boardTab': state.board.tab = d.tab; render(); break;
    case 'openChangeSlot': { const r = resv(d.no); openModal('changeSlot', {no:d.no, date:r.date, slotId:r.slotId, reason:''}); break; }
    case 'doChangeSlot': {
      if (!m.reason || !m.reason.trim()) { m.err = '変更理由を入力してください。'; renderModal(); return; }
      const r = resv(m.no), before = `${fmtMd(r.date)} ${slotDef(r.slotId).label}`;
      r.date = m.date; r.slotId = m.slotId;
      audit('受入順序の調整', r.no, `${before} → ${fmtMd(r.date)} ${slotDef(r.slotId).label}（${m.reason}）`);
      closeModal(); toast(`${r.no} の時間帯を変更し、取引先へ通知しました。`); render(); break;
    }
    case 'openChangeVisit': { const r = resv(d.no);
      openModal('changeVisit', {no:d.no, visitDate:r.visitDate || r.date, visitFrom:r.visitFrom || r.startAt,
        visitTo:r.visitTo || r.endAt, dispatchNote:r.dispatchNote || '', reason:''}); break; }
    case 'doChangeVisit': {
      if (!m.reason || !m.reason.trim()) { m.err = '変更理由を入力してください。'; renderModal(); return; }
      if (m.visitTo <= m.visitFrom) { m.err = '終了時刻は開始時刻より後にしてください。'; renderModal(); return; }
      const r = resv(m.no);
      Object.assign(r, {visitDate:m.visitDate, visitFrom:m.visitFrom, visitTo:m.visitTo, dispatchNote:m.dispatchNote});
      audit('訪問日時の変更', r.no, `${fmtMd(r.visitDate)} ${r.visitFrom}〜${r.visitTo}（${m.reason}）`);
      closeModal(); toast(`${r.no} の訪問日時を変更し、取引先へ通知しました（G-03）。`); render(); break;
    }
    case 'openCancel': openModal('cancel', {no:d.no, reason:''}, 'modal-md'); break;
    case 'doCancel': {
      if (!m.reason || !m.reason.trim()) { m.err = '取消理由を入力してください。'; renderModal(); return; }
      const r = resv(m.no);
      r.status = 'canceled'; r.cancelReason = m.reason.trim();
      audit('取消', r.no, m.reason.trim());
      closeModal(); toast(`${r.no} を取消しました。枠を解放しました。`, 'warn'); render(); break;
    }
    case 'exportBoard': {
      const ds = state.board.date;
      const rows = [['日付','受付番号','区分','ステータス','時間','排出事業者','申請者','品目・申告数量','車格','台数','車番','ドライバー','現場']];
      RESV.filter(r => (r.method === 'drop' ? r.date : (r.visitDate || r.date)) === ds && !['pending','rejected'].includes(r.status))
        .forEach(r => rows.push([ds, r.no, methodLabel(r.method), STATUS[r.status].t, resvTime(r),
          partner(r.emitterId).name, partner(r.applicantId).name, linesText(r),
          vehicle(r.vehicleId).name || '', r.vCount || '', r.plate || '', r.driver || '', site(r.siteId).name || '']));
      downloadCsv(`予約一覧_${ds}.csv`, rows);
      toast('CSVを出力しました。'); break;
    }

    /* ---- 代行入力 ---- */
    case 'pxMethod':
      state.proxy.method = d.v; state.proxy.slotId = ''; state.proxy.errors = []; render(); break;
    case 'pxAddLine': state.proxy.lines.push(blankLine()); render(); break;
    case 'pxRemoveLine':
      state.proxy.lines.splice(Number(d.idx), 1);
      if (!state.proxy.lines.length) state.proxy.lines.push(blankLine());
      render(); break;
    case 'pxReset': state.proxy = blankProxy(); render(); break;
    case 'pxSubmit': pxSubmit(); break;

    /* ---- 受入枠設定 ---- */
    case 'capTab': state.capacity.tab = d.tab; render(); break;
    case 'capMonth': state.capacity.month = shiftMonth(state.capacity.month, Number(d.n)); render(); break;
    case 'openDayCap': openModal('daycap', {date:d.date}); break;
    case 'doSaveDayCap': {
      if (!m.reason || !String(m.reason).trim()) { m.err = '変更理由を入力してください。'; renderModal(); return; }
      const ds = d.date;
      if (m.closed) capacity.days[ds] = {closed:true, reason:String(m.reason).trim()};
      else {
        const slots = {};
        SLOTS.filter(s => s.active).forEach(s => {
          const t = getPath(m, `slot.${s.id}.trucks`), w = getPath(m, `slot.${s.id}.weight`);
          const cur = capacityOf(ds).slots.find(x => x.id === s.id);
          slots[s.id] = {trucks: Number(t != null && t !== '' ? t : (cur ? cur.trucks : 0)),
                         weight: Number(w != null && w !== '' ? w : (cur ? cur.weight : 0))};
        });
        capacity.days[ds] = {slots, reason:String(m.reason).trim()};
      }
      audit('枠設定変更', `受入枠 ${ds}`, `${m.closed ? '臨時休業' : '枠を上書き'}（${String(m.reason).trim()}）`);
      closeModal(); toast(`${fmtMd(ds)} の受入枠を変更しました。`); render(); break;
    }
    case 'doClearDayCap':
      delete capacity.days[d.date];
      audit('枠設定変更', `受入枠 ${d.date}`, '個別上書きを解除（曜日パターンに戻す）');
      closeModal(); toast(`${fmtMd(d.date)} の上書きを解除しました。`); render(); break;
    case 'capSaveWeekly': {
      [0,1,2,3,4,5,6].forEach(w => {
        const cb = document.querySelector(`[data-cap="closed.${w}"]`);
        if (cb && cb.checked) { capacity.weekly[w] = null; return; }
        const o = {};
        SLOTS.filter(s => s.active).forEach(s => {
          const t = document.querySelector(`[data-cap="w.${w}.${s.id}.trucks"]`);
          const g = document.querySelector(`[data-cap="w.${w}.${s.id}.weight"]`);
          const tv = t && t.value !== '' ? Number(t.value) : null;
          const gv = g && g.value !== '' ? Number(g.value) : null;
          if (tv != null || gv != null) o[s.id] = {trucks: tv || 0, weight: gv || 0};
        });
        capacity.weekly[w] = Object.keys(o).length ? o : null;
      });
      audit('枠設定変更', '曜日パターン', '受入枠の曜日パターンを更新');
      toast('曜日パターンを保存しました。'); render(); break;
    }
    case 'capBulk': {
      const from = document.getElementById('elBulkFrom').value, to = document.getElementById('elBulkTo').value;
      if (!from || !to || to < from) { toast('期間の指定を確認してください。', 'err'); return; }
      let n = 0;
      for (let dt = parseD(from); dstr(dt) <= to; dt = addDays(dt, 1)) {
        const ds = dstr(dt), ov = capacity.days[ds];
        if (ov && ov.closed) continue;         /* 臨時休業は残す */
        delete capacity.days[ds]; n++;
      }
      audit('枠設定変更', `一括適用 ${from}〜${to}`, `${n} 日に曜日パターンを適用（個別上書きを解除）`);
      toast(`${from} 〜 ${to} の ${n} 日へ曜日パターンを適用しました。`); render(); break;
    }
    case 'capSaveItems': {
      ITEMS.forEach(it => {
        const el2 = document.querySelector(`[data-cap="item.${it.id}"]`);
        if (!el2) return;
        if (el2.value === '') delete capacity.itemCaps[it.id];
        else capacity.itemCaps[it.id] = Number(el2.value);
      });
      audit('枠設定変更', '品目別上限', '日次の品目別上限を更新');
      toast('品目別上限を保存しました。'); render(); break;
    }
    case 'capSaveSlots': {
      SLOTS.forEach(s => {
        const el2 = document.querySelector(`[data-cap="slot.${s.id}"]`);
        if (el2) s.active = el2.checked;
      });
      audit('枠設定変更', '時間帯マスタ', '時間帯の有効／無効を更新');
      toast('時間帯マスタを保存しました。'); render(); break;
    }

    /* ---- 引取枠設定 ---- */
    case 'pkMonth': state.pickupcap.month = shiftMonth(state.pickupcap.month, Number(d.n)); render(); break;
    case 'pkApplyCalc': {
      const v = document.querySelector('[data-cap="pk.vehicles"]').value;
      const p = document.querySelector('[data-cap="pk.perVehicle"]').value;
      pickupCapacity.vehicles = Number(v) || 0; pickupCapacity.perVehicle = Number(p) || 0;
      const base = pickupCapacity.vehicles * pickupCapacity.perVehicle;
      [1,2,3,4,5].forEach(w => pickupCapacity.weekly[w] = base);
      audit('枠設定変更', '引取枠', `既定値を平日へ反映（${pickupCapacity.vehicles}台 × ${pickupCapacity.perVehicle}件 = ${base}件／日）`);
      toast(`平日の引取枠を ${base} 件／日に設定しました。`); render(); break;
    }
    case 'pkSaveWeekly': {
      [0,1,2,3,4,5,6].forEach(w => {
        const el2 = document.querySelector(`[data-cap="pkw.${w}"]`);
        if (el2) pickupCapacity.weekly[w] = Number(el2.value) || 0;
      });
      audit('枠設定変更', '引取枠', '曜日別の上限を更新');
      toast('引取枠の曜日別上限を保存しました。'); render(); break;
    }
    case 'openPickupDay': openModal('pickupday', {date:d.date}, 'modal-md'); break;
    case 'doSavePickupDay': {
      if (!m.reason || !String(m.reason).trim()) { m.err = '理由を入力してください。'; renderModal(); return; }
      pickupCapacity.days[d.date] = {limit: Number(m.limit) || 0, reason: String(m.reason).trim()};
      audit('枠設定変更', `引取枠 ${d.date}`, `上限 ${Number(m.limit) || 0} 件（${String(m.reason).trim()}）`);
      closeModal(); toast(`${fmtMd(d.date)} の引取枠を変更しました。`); render(); break;
    }
    case 'doClearPickupDay':
      delete pickupCapacity.days[d.date];
      audit('枠設定変更', `引取枠 ${d.date}`, '個別上書きを解除');
      closeModal(); toast(`${fmtMd(d.date)} の上書きを解除しました。`); render(); break;

    /* ---- 入場受付・計量 ---- */
    case 'doArrive': {
      const r = resv(d.no);
      r.status = 'arrived'; r.arrivedAt = nowHm();
      audit('入場受付', r.no, `入場時刻 ${r.arrivedAt}`);
      toast(`${r.no} を入場受付しました（${r.arrivedAt}）。`); render(); break;
    }
    case 'openWeigh': openModal('weigh', weighInit(d.no), 'modal-xl'); break;
    case 'weighAddLine': m.lines.push({itemId:'', declared:0, qty:''}); renderModal(); break;
    case 'weighRemoveLine': m.lines.splice(Number(d.idx), 1); renderModal(); break;
    case 'weighAddAlloc': m.alloc.push({siteId:'', qty:''}); renderModal(); break;
    case 'weighRemoveAlloc': m.alloc.splice(Number(d.idx), 1); renderModal(); break;
    case 'doWeigh': {
      const r = resv(m.no);
      const g = Number(m.gross), t = Number(m.tare);
      if (!m.gross || !m.tare || isNaN(g) || isNaN(t)) { m.err = '総重量・空車重量を数字で入力してください。'; renderModal(); return; }
      if (g <= t) { m.err = '総重量は空車重量より大きい値を入力してください。'; renderModal(); return; }
      if (m.lines.some(l => !l.itemId || l.qty === '' || isNaN(Number(l.qty)) || Number(l.qty) <= 0)) {
        m.err = '実数量は品目ごとに正の数で入力してください。'; renderModal(); return;
      }
      const hasDiff = m.lines.some(l => Math.abs(Number(l.qty) - l.declared) / Math.max(l.declared, 0.01) > 0.1);
      if (hasDiff && !m.diffReason) { m.err2 = '差異理由を選択してください。'; renderModal(); return; }
      if (m.multi) {
        const sumA = m.alloc.reduce((s,x) => s + (Number(x.qty) || 0), 0);
        const sumW = m.lines.reduce((s,l) => s + (item(l.itemId).unit === 't' ? Number(l.qty) : 0), 0);
        if (m.alloc.filter(x => x.siteId).length < 2) { m.err = '按分する現場を2件以上指定してください。'; renderModal(); return; }
        if (Math.abs(sumA - sumW) > 0.01) { m.err = '按分の合計が実数量の合計と一致していません。'; renderModal(); return; }
      }
      let total = 0, first = null;
      m.lines.forEach((l, i) => {
        const it = item(l.itemId);
        const a = {
          id: nextActualId(), date: D(0), resvNo: r.no, method: r.method,
          partnerId: r.emitterId,
          siteId: r.method === 'pickup' ? r.siteId : ((SITES.find(s => s.partnerId === r.emitterId) || {}).id || ''),
          itemId: l.itemId, unit: it.unit, declared: l.declared,
          gross: i === 0 ? g : null, tare: i === 0 ? t : null, net: Number(l.qty),
          vehicleId: r.vehicleId || null, plate: r.plate || '',
          diffReason: m.diffReason || '', spot: false, status: 'fixed',
          allocations: (m.multi && i === 0) ? m.alloc.filter(x => x.siteId && x.qty).map(x => ({siteId:x.siteId, qty:Number(x.qty)})) : null,
          extras: i === 0 ? (m.extras || []) : []
        };
        ACTUALS.push(a);
        const sl = buildSalesFor(a, nextSalesNo());
        SALES.push(...sl);
        total += sl.reduce((s,x) => s + x.amount, 0);
        if (i === 0) first = a.id;
      });
      r.status = 'done'; r.actualId = first;
      audit('計量実績の登録', r.no, `正味 ${dec((g - t) / 1000)} t／売上明細 ${yen(total)}`);
      closeModal();
      toast(`${r.no} の実績を確定しました。売上明細を生成しました（${yen(total)}）。`);
      render(); break;
    }
    case 'openSpot': openModal('spot', {partnerId:'', siteId:'', itemId:'', vehicleId:'', plate:'', gross:'', tare:'', vol:''}); break;
    case 'doSpot': {
      if (!m.partnerId || !m.itemId) { m.err = '取引先と品目を選択してください。'; renderModal(); return; }
      const g = Number(m.gross), t = Number(m.tare);
      if (!m.gross || !m.tare || isNaN(g) || isNaN(t) || g <= t) { m.err = '総重量・空車重量を確認してください。'; renderModal(); return; }
      const it = item(m.itemId);
      const netW = (g - t) / 1000;
      if (it.unit === 'm3' && (!m.vol || isNaN(Number(m.vol)))) { m.err = '体積を入力してください。'; renderModal(); return; }
      const a = {
        id: nextActualId(), date: D(0), resvNo: null, method: 'drop',
        partnerId: m.partnerId, siteId: m.siteId || '', itemId: m.itemId, unit: it.unit,
        declared: 0, gross: g, tare: t, net: it.unit === 'm3' ? Number(m.vol) : Math.round(netW*100)/100,
        vehicleId: m.vehicleId || null, plate: m.plate || '', diffReason: '飛び込み搬入（予約なし）',
        spot: true, status: 'fixed', allocations: null, extras: []
      };
      ACTUALS.push(a);
      const sl = buildSalesFor(a, nextSalesNo());
      SALES.push(...sl);
      audit('飛び込み搬入の登録', a.id, `${partner(a.partnerId).name}／${item(a.itemId).name} ${dec(a.net)}${a.unit}`);
      closeModal();
      toast(`飛び込み搬入 ${a.id} を実績登録しました（${yen(sl.reduce((s,x) => s + x.amount, 0))}）。`);
      render(); break;
    }
    case 'openReject2': openModal('reject2', {no:d.no, reason:''}, 'modal-md'); break;
    case 'doReject2': {
      if (!m.reason) { m.err = '理由を選択してください。'; renderModal(); return; }
      const r = resv(m.no);
      r.status = 'canceled'; r.cancelReason = m.reason;
      audit(r.method === 'drop' ? '受入拒否の記録' : '集荷不可の記録', r.no, m.reason);
      closeModal(); toast(`${r.no} を「${m.reason}」として記録しました。`, 'warn'); render(); break;
    }

    /* ---- 実績・締め ---- */
    case 'openActual': openModal('actual', {id:d.id}); break;
    case 'acFilterDiff': state.actuals.diffOnly = !state.actuals.diffOnly; render(); break;
    case 'doRed': {
      const id = d.id;
      const red = salesOf(id).filter(s => !s.red).map(s => Object.assign({}, s, {
        no: s.no + '-R', amount: -s.amount, red: true, closed: false, date: D(0)
      }));
      SALES.push(...red);
      audit('赤伝の起票', id, `${red.length} 明細をマイナス計上（${yen(red.reduce((t,s) => t + s.amount, 0))}）`);
      toast(`${id} の赤伝を起票しました。当月の売上に反映されます。`, 'warn');
      renderModal(); render(); break;
    }
    case 'exportActuals': {
      const rows = [['実績番号','日付','受付番号','区分','取引先','排出現場','品目','申告数量','実数量','単位','総重量kg','空車重量kg','差異理由','金額','状態']];
      filteredActuals().forEach(a => rows.push([a.id, a.date, a.resvNo || '', methodLabel(a.method),
        partner(a.partnerId).name, site(a.siteId).name || '', item(a.itemId).name,
        a.declared, a.net, a.unit, a.gross || '', a.tare || '', a.diffReason || '',
        amountOf(a.id), a.status === 'closed' ? '締め済' : '確定']));
      downloadCsv(`実績一覧_${state.actuals.from}_${state.actuals.to}.csv`, rows);
      toast(`実績 ${filteredActuals().length} 件をCSV出力しました。`); break;
    }
    case 'clMonth': state.closing.ym = shiftMonth(state.closing.ym, Number(d.n)); state.closing.expand = null; render(); break;
    case 'expandPartner': state.closing.expand = state.closing.expand === d.pid ? null : d.pid; render(); break;
    case 'openClose': openModal('close', {ym:state.closing.ym}); break;
    case 'doClose': {
      const ym = d.ym;
      CLOSINGS.push({ym, closedAt:`${D(0)} ${nowHm()}`, by:me().user});
      SALES.forEach(s => { if (ymOf(s.date) === ym) s.closed = true; });
      ACTUALS.forEach(x => { if (ymOf(x.date) === ym) x.status = 'closed'; });
      audit('締め処理', `月次締め ${ym}`, '対象期間の実績を確定（以降の修正は赤伝）');
      closeModal(); toast(`${monthLabel(ym)} を締めました。以降の修正は赤伝で行ってください。`); render(); break;
    }
    case 'exportSales': {
      const ym = state.closing.ym;
      const tpl = (document.getElementById('elCsvTpl') || {}).value || 'generic';
      const lines = SALES.filter(s => ymOf(s.date) === ym);
      let rows;
      if (tpl === 'acctA') {
        rows = [['伝票日付','借方科目','貸方科目','金額','摘要','取引先コード','税区分']];
        lines.forEach(s => rows.push([s.date.replace(/-/g,'/'),
          s.kind === 'purchase' ? '仕入高' : '売掛金',
          s.kind === 'purchase' ? '買掛金' : '売上高',
          Math.round(Math.abs(s.amount)) * (s.amount < 0 ? -1 : 1),
          `${s.category}${s.itemId ? '／' + item(s.itemId).name : ''}`,
          s.partnerId, '課税売上10%']));
      } else if (tpl === 'acctB') {
        rows = [['得意先名','登録番号','売上日','品名','数量','単位','単価','金額']];
        lines.forEach(s => rows.push([partner(s.partnerId).name, partner(s.partnerId).invoice || '',
          s.date, `${s.category}${s.itemId ? '／' + item(s.itemId).name : ''}`,
          s.qty, s.unit, s.unitPrice == null ? '' : s.unitPrice, Math.round(s.amount)]));
      } else {
        rows = [['明細番号','日付','実績番号','取引先','排出現場','売上区分','内容','品目','数量','単位','単価','単価型','最低料金適用','金額','契約ID','締め']];
        lines.forEach(s => rows.push([s.no, s.date, s.actualId, partner(s.partnerId).name, site(s.siteId).name || '',
          s.kind === 'purchase' ? '仕入' : '売上', s.category, s.itemId ? item(s.itemId).name : '',
          s.qty, s.unit, s.unitPrice == null ? '' : s.unitPrice, s.priceType || '',
          s.minApplied ? '○' : '', Math.round(s.amount), s.contractId || '', s.closed ? '締め済' : '']));
      }
      downloadCsv(`売上明細_${ym}_${tpl}.csv`, rows);
      audit('CSV出力', `売上明細 ${ym}`, `テンプレート：${CSV_TEMPLATES.find(t => t.id === tpl).name}／${lines.length} 明細`);
      toast(`${lines.length} 明細をCSV出力しました。`); break;
    }

    /* ---- マスタ ---- */
    case 'mAdd': {
      const mm = MASTERS[d.m], row = {};
      mm.cols.forEach(c => setPath(row, c.k, c.type === 'bool' ? false : (c.type === 'multi' ? [] : '')));
      openModal('master', {m:d.m, idx:null, row}); break;
    }
    case 'mEdit': openModal('master', {m:d.m, idx:Number(d.i), row: JSON.parse(JSON.stringify(MASTERS[d.m].data()[Number(d.i)]))}); break;
    case 'mDel': {
      const arr = MASTERS[d.m].data(), i = Number(d.i);
      if (!confirm(`${MASTERS[d.m].title}の「${arr[i].name || arr[i].id}」を削除します。よろしいですか？`)) return;
      const removed = arr.splice(i, 1)[0];
      audit('マスタ削除', MASTERS[d.m].title, `${removed.name || removed.id} を削除`);
      toast('削除しました。', 'warn'); render(); break;
    }
    case 'mSave': {
      const mm = MASTERS[m.m], arr = mm.data();
      const miss = mm.cols.filter(c => c.req && !getPath(m.row, c.k));
      if (miss.length) { m.err = `必須項目が未入力です：${miss.map(c => c.label).join('、')}`; renderModal(); return; }
      mm.cols.forEach(c => {
        if (c.type === 'number') {
          const v = getPath(m.row, c.k);
          setPath(m.row, c.k, v === '' || v == null ? null : Number(v));
        }
      });
      if (m.idx == null) {
        const pref = (arr[0] && arr[0].id ? String(arr[0].id).replace(/\d+$/,'') : 'x');
        let n = arr.length + 1;
        while (arr.find(x => x.id === pref + n)) n++;
        m.row.id = pref + n;
        arr.push(m.row);
        audit('マスタ登録', mm.title, `${m.row.name || m.row.id} を登録`);
      } else {
        Object.assign(arr[m.idx], m.row);
        audit('マスタ更新', mm.title, `${arr[m.idx].name || arr[m.idx].id} を更新`);
      }
      closeModal(); toast('保存しました。'); render(); break;
    }
    case 'mCsv': {
      const mm = MASTERS[d.m], cols = mm.cols;
      const rows = [cols.map(c => c.label)];
      mm.data().forEach(r => rows.push(cols.map(c => {
        const v = getPath(r, c.k);
        return Array.isArray(v) ? v.map(x => item(x).name || x).join('／') : (v == null ? '' : v);
      })));
      downloadCsv(`${mm.title}.csv`, rows);
      toast('CSVを出力しました。'); break;
    }
    case 'exportAudit': {
      const rows = [['日時','操作者','ロール','操作','対象','内容']];
      AUDIT.forEach(x => rows.push([x.at, x.user, x.role, x.act, x.target, x.detail]));
      downloadCsv('監査ログ.csv', rows);
      toast('CSVを出力しました。'); break;
    }
  }
});

/* =========================================================================
   初期化
   ========================================================================= */
if (location.hash && VIEWS[location.hash.slice(1)]) state.route = location.hash.slice(1);
window.addEventListener('hashchange', () => {
  const r = location.hash.slice(1);
  if (VIEWS[r] && r !== state.route) { state.route = r; render(); }
});
render();
</script>
