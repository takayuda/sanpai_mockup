<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>産廃DX｜処理業者 管理画面 モック（第1期）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* =========================================================================
   デザイントークン（排出元ポータル ワイヤーフレームと共通）
   ========================================================================= */
:root{
  --blue-900:#000B5F; --blue-800:#0017C1; --blue-100:#E8F1FE;
  --ink:#1A1A1C; --ink-sub:#626264;
  --line:#D8D8DB; --line-strong:#767676;
  --bg:#F2F2F2; --white:#FFFFFF;
  --error:#CE0000; --error-bg:#FDEEEE;
  --success:#197A4B; --success-bg:#E6F5EC;
  --warn:#B75200; --warn-bg:#FDF3E6;
  --radius:8px;
  --sidebar-w:236px; --topbar-h:60px;

  /* Bootstrap 5 のトークンを上書きして既存モックの配色に合わせる */
  --bs-primary:#0017C1; --bs-primary-rgb:0,23,193;
  --bs-body-font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --bs-body-font-size:16px; --bs-body-line-height:1.7;
  --bs-body-color:#1A1A1C; --bs-body-color-rgb:26,26,28;
  --bs-body-bg:#F2F2F2;
  --bs-border-color:#D8D8DB;
  --bs-border-radius:8px; --bs-border-radius-sm:6px; --bs-border-radius-lg:8px;
  --bs-link-color:#0017C1; --bs-link-hover-color:#000B5F;
  --bs-link-color-rgb:0,23,193;
  --bs-emphasis-color:#1A1A1C;
  --bs-secondary-color:#626264;
}
body{-webkit-font-smoothing:antialiased;}
:focus-visible{outline:3px solid #FFD43D;outline-offset:0;box-shadow:0 0 0 5px var(--ink);border-radius:2px;}
.ic{vertical-align:-.18em;flex:none;}

/* ボタン */
.btn{font-weight:700;}
.btn-primary{--bs-btn-bg:var(--blue-800);--bs-btn-border-color:var(--blue-800);--bs-btn-hover-bg:var(--blue-900);--bs-btn-hover-border-color:var(--blue-900);--bs-btn-active-bg:var(--blue-900);--bs-btn-active-border-color:var(--blue-900);--bs-btn-disabled-bg:#9A9A9C;--bs-btn-disabled-border-color:#9A9A9C;}
.btn-outline-primary{--bs-btn-color:var(--blue-800);--bs-btn-border-color:var(--blue-800);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--blue-100);--bs-btn-hover-color:var(--blue-900);--bs-btn-hover-border-color:var(--blue-800);--bs-btn-active-bg:var(--blue-100);--bs-btn-active-color:var(--blue-900);--bs-btn-active-border-color:var(--blue-800);}
.btn-outline-danger{--bs-btn-color:var(--error);--bs-btn-border-color:var(--error);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--error-bg);--bs-btn-hover-color:var(--error);--bs-btn-hover-border-color:var(--error);--bs-btn-active-bg:var(--error-bg);--bs-btn-active-color:var(--error);--bs-btn-active-border-color:var(--error);}
.btn-outline-secondary{--bs-btn-color:var(--ink);--bs-btn-border-color:var(--line-strong);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--bg);--bs-btn-hover-color:var(--ink);--bs-btn-hover-border-color:var(--line-strong);--bs-btn-active-bg:var(--bg);--bs-btn-active-color:var(--ink);--bs-btn-active-border-color:var(--line-strong);}
.btn .ic{margin-right:5px;}
.btn-icon .ic{margin-right:0;}

/* フォーム */
.form-control,.form-select{border-color:var(--line-strong);}
.form-control:focus,.form-select:focus{border-color:var(--blue-800);box-shadow:0 0 0 .2rem rgba(0,23,193,.15);}
.form-label{font-weight:700;font-size:15px;margin-bottom:6px;}
.form-text{color:var(--ink-sub);}
.req{font-size:12px;font-weight:700;color:var(--error);border:1px solid var(--error);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}
.opt{font-size:12px;font-weight:500;color:var(--ink-sub);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}

/* レイアウト */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;z-index:1030;}
.topbar .brand{font-weight:700;font-size:16px;white-space:nowrap;line-height:1.25;}
.topbar .brand span{display:block;font-size:11px;font-weight:400;color:var(--ink-sub);}
.topbar .who{font-size:13px;color:var(--ink-sub);white-space:nowrap;}
.mockbtn{position:relative;}
.mockbtn::after{content:"MOCK";position:absolute;top:-8px;right:-10px;background:var(--warn);color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:0 4px;letter-spacing:.04em;}
.sidebar{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 40px;z-index:1020;}
.sidebar .navsec{font-size:11px;font-weight:700;color:var(--ink-sub);letter-spacing:.06em;padding:14px 18px 5px;}
.sidebar a.navitem{display:flex;align-items:center;gap:9px;padding:9px 18px 9px 15px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent;}
.sidebar a.navitem:hover{background:var(--blue-100);}
.sidebar a.navitem.active{background:var(--blue-100);border-left-color:var(--blue-800);color:var(--blue-800);font-weight:700;}
.sidebar .navitem .ico{width:18px;height:18px;display:grid;place-items:center;color:var(--ink-sub);flex:none;}
.sidebar a.navitem.active .ico{color:var(--blue-800);}
.sidebar .navitem .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--error);color:#fff;border-radius:99px;padding:1px 8px;}
.content{margin-left:var(--sidebar-w);padding:22px 26px 80px;padding-top:calc(var(--topbar-h) + 22px);}
.page-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.page-h h1{font-size:23px;font-weight:700;margin:0;}
.page-lead{color:var(--ink-sub);font-size:14px;margin:0 0 18px;}
.fnids{display:flex;gap:6px;flex-wrap:wrap;}
.fnid{font-size:11px;font-weight:700;color:var(--blue-900);background:var(--blue-100);border:1px solid var(--blue-800);border-radius:4px;padding:1px 7px;}

/* カード・パネル */
.card{border-color:var(--line);border-radius:var(--radius);overflow-x:auto;}
.card-head{background:#FAFAFA;border-bottom:1px solid var(--line);padding:10px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.card-head .sub{font-weight:400;font-size:13px;color:var(--ink-sub);}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;height:100%;}
.kpi .t{font-size:12px;color:var(--ink-sub);font-weight:500;margin-bottom:2px;}
.kpi .v{font-size:25px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-sub);}
.kpi.alert-kpi{border-color:var(--error);background:var(--error-bg);}
.kpi.alert-kpi .v{color:var(--error);}

/* テーブル */
.table{--bs-table-bg:var(--white);font-size:14px;border-color:var(--line);margin-bottom:0;}
.table thead th{background:#FAFAFA;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle;}
.table td,.table th{padding:10px 12px;vertical-align:middle;}
.table td.num,.table th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;background:var(--white);}
.table tbody tr.clickable{cursor:pointer;}
.table tbody tr.clickable:hover{background:var(--blue-100);}
.table tbody tr.sel{background:var(--blue-100);box-shadow:inset 3px 0 0 var(--blue-800);}
.table tbody tr.dim td{color:var(--ink-sub);background:#FBFBFB;}

/* バッジ */
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px;border:1px solid transparent;}
.b-pending{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
.b-approved{background:var(--success-bg);color:var(--success);border-color:var(--success);}
.b-rejected{background:var(--error-bg);color:var(--error);border-color:var(--error);}
.b-method{background:var(--blue-100);color:var(--blue-900);border-color:var(--blue-800);}
.b-neutral{background:var(--white);color:var(--ink-sub);border-color:var(--line-strong);}
.b-dark{background:var(--blue-900);color:#fff;border-color:var(--blue-900);}
.b-sq{border-radius:4px;}

/* 事前チェック */
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);}
.chk.ok{border-color:var(--success);background:var(--success-bg);}
.chk.ng{border-color:var(--error);background:var(--error-bg);}
.chk.wa{border-color:var(--warn);background:var(--warn-bg);}
.chk .m{font-weight:700;flex:none;display:flex;align-items:center;gap:4px;}
.chk.ok .m{color:var(--success);} .chk.ng .m{color:var(--error);} .chk.wa .m{color:var(--warn);}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-sub);padding:4px 0;}
.cal .day{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:6px 7px;min-height:76px;text-align:left;font:inherit;cursor:pointer;}
.cal .day:hover{background:var(--blue-100);}
.cal .day .d{font-size:13px;font-weight:700;}
.cal .day .m{font-size:11px;color:var(--ink-sub);line-height:1.45;font-variant-numeric:tabular-nums;}
.cal .day.off{background:#F4F4F5;color:#9A9A9C;}
.cal .day.off .m{color:#9A9A9C;}
.cal .day.today{border:2px solid var(--blue-800);padding:5px 6px;}
.cal .day.busy{background:var(--blue-100);border-color:var(--blue-800);}
.cal .day.blank{background:transparent;border:0;cursor:default;}
.cal .day .ov{font-size:10px;font-weight:700;color:var(--warn);}

/* 時間枠チップ */
.slotchip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);padding:8px 10px 8px 14px;font-variant-numeric:tabular-nums;}
.slotchip b{font-size:15px;}
.slotchip .del{border:0;background:none;color:var(--error);padding:2px 4px;line-height:1;cursor:pointer;}

/* 仕様メモ */
.specnote{border:1px dashed var(--line-strong);border-radius:var(--radius);background:#FBFBFC;padding:0;margin-bottom:18px;}
.specnote > button{width:100%;text-align:left;background:none;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--ink-sub);padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.specnote .in{padding:0 16px 14px;font-size:13px;}
.specnote h6{font-size:12px;font-weight:700;color:var(--ink-sub);margin:10px 0 4px;}
.specnote ul{margin:0;padding-left:18px;}
.specnote li{margin-bottom:2px;}
.specnote .q{color:var(--warn);font-weight:700;}

/* その他 */
.empty{background:var(--white);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:44px 24px;text-align:center;color:var(--ink-sub);}
.hint{font-size:13px;color:var(--ink-sub);margin:0 0 6px;}
.sticky-col{position:sticky;top:calc(var(--topbar-h) + 16px);}
.divline{border-top:1px solid var(--line);margin:16px 0;}
.mono{font-variant-numeric:tabular-nums;}
.filterbar{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.filterbar .f{min-width:150px;}
.filterbar .f label{font-size:12px;font-weight:700;color:var(--ink-sub);display:block;margin-bottom:2px;}
.toast-host{position:fixed;right:20px;bottom:20px;z-index:1090;display:flex;flex-direction:column;gap:8px;}
.toast-item{background:var(--blue-900);color:#fff;border-radius:var(--radius);padding:12px 18px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.24);max-width:420px;}
.toast-item.warn{background:var(--warn);}
.toast-item.err{background:var(--error);}
.modal-header{border-bottom-color:var(--line);}
.modal-footer{border-top-color:var(--line);}
.modal-title{font-size:18px;font-weight:700;}
.dl{display:grid;grid-template-columns:130px 1fr;gap:0;font-size:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.dl dt{background:#FAFAFA;padding:8px 12px;font-weight:500;color:var(--ink-sub);border-bottom:1px solid var(--line);margin:0;}
.dl dd{padding:8px 12px;border-bottom:1px solid var(--line);margin:0;font-weight:500;}
.dl dt:nth-last-of-type(1),.dl dd:nth-last-of-type(1){border-bottom:0;}
.urlbox{display:flex;gap:8px;align-items:center;background:#FAFAFA;border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px 12px;font-size:13px;word-break:break-all;}
.urlbox code{color:var(--blue-900);font-weight:700;}
.flowsteps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px;}
.flowsteps li{flex:1 1 150px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);padding:10px 12px;font-size:12px;color:var(--ink-sub);}
.flowsteps li b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px;}
.flowsteps li.on{border-color:var(--blue-800);background:var(--blue-100);}
.invitewrap{max-width:560px;margin:0 auto;}
.nowrap{white-space:nowrap;}
/* 取引先の本登録画面（本番では取引先側アプリの画面）はガワを切り替える */
body.invite-mode .sidebar{display:none;}
body.invite-mode .content{margin-left:0;}
body.invite-mode .topbar{background:var(--blue-900);border-bottom:0;}
body.invite-mode .topbar .brand{color:#fff;}
body.invite-mode .topbar .brand span{color:#C9D2FF;}
@media (max-width:767px){
  .topbar{gap:8px;padding:0 12px;}
  .topbar .brand{font-size:14px;}
  .topbar .who,.topbar #elPlantSel{display:none;}
}
@media (max-width:991px){
  :root{--sidebar-w:0px;}
  .sidebar{transform:translateX(-100%);transition:transform .2s;width:236px;}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.4);}
  .content{padding:calc(var(--topbar-h) + 16px) 14px 64px;}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="btn btn-outline-secondary btn-sm btn-icon d-lg-none" data-act="toggleNav" aria-label="メニュー" id="elMenuBtn"></button>
  <div class="brand">産廃予約管理システム<span>株式会社エコクリーン埼玉（処理業者）</span></div>
  <div class="ms-auto d-flex align-items-center gap-2">
    <a class="btn btn-outline-secondary btn-sm mockbtn" href="emitter-portal.html" id="elEmitterBtn">排出者側の画面</a>
    <select class="form-select form-select-sm" style="width:auto;" data-act="switchPlant" id="elPlantSel" aria-label="拠点"></select>
    <button class="btn btn-outline-secondary btn-sm btn-icon" data-act="openNotif" aria-label="通知" id="elNotifBtn"></button>
    <span class="who" id="elWho"></span>
  </div>
</header>

<nav class="sidebar" id="elSidebar" aria-label="メインメニュー"></nav>
<main class="content" id="elView"></main>

<div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable" id="elModalDialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="elModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button></div>
      <div class="modal-body" id="elModalBody"></div>
      <div class="modal-footer" id="elModalFoot"></div>
    </div>
  </div>
</div>
<div class="toast-host" id="elToast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

   アイコン（線画SVG・stroke は currentColor）

  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',

/* ---------- 日付ユーティリティ ---------- */
const DOW = ['日','月','火','水','木','金','土'];
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const D = n => dstr(addDays(TODAY,n));
const parseD = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y,m-1,dd); };
const fmtMd = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`; };
const fmtJp = s => { const d = parseD(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };
const ymOf = s => s.slice(0,7);
/* 稼働日（日曜以外）で n 日後／n 日前を返す。ダミーデータが休業日に乗らないようにするため */
function bizDay(n) {
  let d = new Date(TODAY), c = 0, step = n < 0 ? -1 : 1;
  while (c < Math.abs(n)) { d = addDays(d, step); if (d.getDay() !== 0) c++; }
  return dstr(d);
}
function B(n) { return bizDay(n); }

const num = n => Number(n ?? 0).toLocaleString('ja-JP');
const dec = (n, d=2) => Number(n ?? 0).toFixed(d).replace(/\.?0+$/,'');

/* ---------- 拠点の稼働・時間枠 ---------- */
const holidayOf = (plantId, ds) => HOLIDAYS.find(h => h.plant_id === plantId && h.date === ds);
function isClosed(plantId, ds) {
  const pl = plant(plantId);
  if (!pl.id) return false;
  if ((pl.closed_dows || []).includes(parseD(ds).getDay())) return {reason:'定休日'};
  const h = holidayOf(plantId, ds);
  return h ? {reason:h.reason} : false;
}
/* 指定日の予約件数（上限は設けない。承認判断の参考情報として表示する） */
function countOf(plantId, ds) {
  const t = PICKUPS.filter(p => p.plant_id === plantId && p.date === ds && !['canceled','rejected'].includes(p.status));
  return {
    drop: t.filter(p => p.type === 'drop').length,
    pickup: t.filter(p => p.type === 'pickup').length,
    pendingDrop: t.filter(p => p.type === 'drop' && p.status === 'pending').length,
    pendingPickup: t.filter(p => p.type === 'pickup' && p.status === 'pending').length
  };
}
const slotOf = (pl, p) => (pl.slots || []).find(s => s.from === p.begin_time && s.to === p.end_time);
const inHours = (pl, p) => p.begin_time >= pl.begin_time && p.end_time <= pl.end_time;

/* =========================================================================
   承認時の事前チェック（判断材料の提示のみ。可否は承認者が決める）
   ========================================================================= */
function checksOf(p) {
  const out = [], co = company(p.company_id), pl = plant(p.plant_id);
  /* 取引先の登録状態 */
  if (co.status === 'active') out.push({lv:'ok', m:'取引先', t:`本登録済み（${companyKind(co)}）`});
  else out.push({lv:'wa', m:'取引先', t:'招待中（本登録が完了していません）'});
  /* 契約書の登録 */
  if (co.contract_file) out.push({lv:'ok', m:'契約書', t:esc(co.contract_file)});
  else out.push({lv:'wa', m:'契約書', t:'契約書が登録されていません'});
  /* 拠点の対応可否 */
  if (p.type === 'drop' && !pl.is_delivery) out.push({lv:'ng', m:'拠点', t:`${pl.name} は持込の受入に対応していません`});
  else if (p.type === 'pickup' && !pl.is_pickup) out.push({lv:'ng', m:'拠点', t:`${pl.name} は引取に対応していません`});
  else out.push({lv:'ok', m:'拠点', t:`${pl.name}（${p.type === 'drop' ? '持込受入' : '引取'}対応）`});
  /* 稼働日 */
  const cl = isClosed(p.plant_id, p.date);
  if (cl) out.push({lv:'ng', m:'稼働日', t:`${fmtMd(p.date)} は休業（${cl.reason}）`});
  /* 時間 */
  if (p.type === 'drop') {
    const s = slotOf(pl, p);
    if (s) out.push({lv:'ok', m:'受入枠', t:`${s.name} ${s.from}〜${s.to}`});
    else out.push({lv:'wa', m:'受入枠', t:`${timeRange(p)} は設定済みの受入時間枠と一致しません`});
  } else {
    if (inHours(pl, p)) out.push({lv:'ok', m:'引取対応時間', t:`${timeRange(p)}（対応時間 ${pl.begin_time}〜${pl.end_time} 内）`});
    else out.push({lv:'wa', m:'引取対応時間', t:`${timeRange(p)} は対応時間 ${pl.begin_time}〜${pl.end_time} の外です`});
  }
  /* 参考：同日の予約状況 */
  const c = countOf(p.plant_id, p.date);
  out.push({lv:'ok', m:'同日の状況', t:`持込 ${c.drop} 件（うち申請中 ${c.pendingDrop}）／引取 ${c.pickup} 件（うち申請中 ${c.pendingPickup}）`});
  return out;
}

const chkHtml = c => `<div class="chk ${c.lv}"><span class="m">${chkIcon(c.lv)}${esc(c.m)}</span><span>${esc(c.t)}</span></div>`;

/* ---------- CSV 出力 ---------- */
function downloadCsv(filename, rows) {
  const csv = rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* 変更依頼のときに提示する代替候補（稼働日と受入時間枠から作る） */
function findAlternatives(p) {
  const out = [], pl = plant(p.plant_id);
  for (let k = 1; k <= 14 && out.length < 4; k++) {
    const ds = D(k);
    if (ds === p.date || isClosed(pl.id, ds)) continue;
    const c = countOf(pl.id, ds);
    if (p.type === 'drop') {
      (pl.slots || []).forEach(s => {
        if (out.length >= 4) return;
        out.push({date:ds, slotId:s.id, label:`${fmtMd(ds)} ${s.from}〜${s.to}`, sub:`持込 ${c.drop} 件`});
      });
    } else {
      out.push({date:ds, label:fmtMd(ds), sub:`引取 ${c.pickup} 件`});
    }
  }
  return out;
}

           <div class="form-text">枠は「受付時間・休業日」画面で拠点ごとに設定します。</div></div>
       </div>
       <div class="mb-0"><label class="form-label">取引先への連絡事項<span class="opt">任意</span></label>
         <textarea class="form-control" rows="2" data-mod="comment" placeholder="例：場内は徐行でお願いします">${esc(m.comment || '')}</textarea></div>`
    : `<p class="hint">引取依頼の承認では<b>訪問日時の確定入力が必須</b>です。第1期では車両・ドライバーへの割当編成はシステム外で行います。</p>
       <div class="row g-2 mb-3">
         <div class="col-12 col-sm-5"><label class="form-label">訪問日<span class="req">必須</span></label>
           <input type="date" class="form-control" data-mod="date" value="${m.date || p.date}"></div>
         <div class="col-6 col-sm-3"><label class="form-label">開始<span class="req">必須</span></label>
           <input type="time" class="form-control" step="1800" data-mod="begin_time" value="${m.begin_time || p.begin_time}"></div>
         <div class="col-6 col-sm-3"><label class="form-label">終了<span class="req">必須</span></label>
           <input type="time" class="form-control" step="1800" data-mod="end_time" value="${m.end_time || p.end_time}"></div>
         <div class="col-12"><div class="form-text">${esc(pl.name)} の引取対応時間：${pl.begin_time} 〜 ${pl.end_time}</div></div>
       </div>
       <div class="mb-3"><label class="form-label">集荷手配メモ<span class="opt">任意</span></label>
         <input type="text" class="form-control" data-mod="dispatch_note" value="${esc(m.dispatch_note || '')}" placeholder="例：4t車・ドライバー中村で手配済（台帳）">
         <div class="form-text">第1期は台帳・電話での手配内容を記録するだけの欄です。配車ボードは第2期。</div></div>
       <div class="mb-0"><label class="form-label">取引先への連絡事項<span class="opt">任意</span></label>
         <textarea class="form-control" rows="2" data-mod="comment">${esc(m.comment || '')}</textarea></div>`;
  const warn = checksOf(p).filter(c => c.lv !== 'ok');
  return {
    title:`${p.id} を承認`,
    body:(warn.length ? `<div class="d-flex flex-column gap-2 mb-3">${warn.map(chkHtml).join('')}
      <div class="text-secondary" style="font-size:13px">※ 事前チェックに注意がありますが、可否の判断は承認者が行います。</div></div>` : '') + body
      + (m.err ? `<div class="text-danger mt-2" style="font-size:13px">${esc(m.err)}</div>` : ''),
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>
          <button class="btn btn-primary" data-act="doApprove" data-id="${p.id}">この内容で承認する</button>`
  };
};

/* ---------- 変更依頼モーダル ---------- */
var MODALS_REJECT = m => {

  return {
    title:`${p.id} に変更依頼（差戻し）`,
    body:`<p class="hint">変更依頼は取引先へ通知され、取引先が内容を修正して再申請します。</p>
      <div class="mb-3"><label class="form-label">理由<span class="req">必須</span></label>
        <textarea class="form-control" rows="3" data-mod="reason" placeholder="例：指定日は臨時休業のため、別日への変更をお願いします。">${esc(m.reason || '')}</textarea>
        ${m.err ? `<div class="text-danger mt-1" style="font-size:13px">${esc(m.err)}</div>` : ''}</div>
      <label class="form-label">代替候補（クリックで理由欄に追記）</label>
      ${alts.length ? `<div class="d-flex flex-wrap gap-2">${alts.map(a =>
        `<button type="button" class="btn btn-outline-primary btn-sm" data-act="pickAlt" data-label="${esc(a.label)}" data-sub="${esc(a.sub)}">

    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>

/* ---------- 予約詳細モーダル ---------- */
var MODALS_PICKUP = m => {
  const p = pk(m.id), co = company(p.company_id), pl = plant(p.plant_id);
  const rows = [
    ['受付番号', `<span class="mono">${p.id}</span>`],
    ['ステータス', stBadge(p.status)],
    ['区分', typeLabel(p.type)],
    ['取引先', `${esc(co.name)}（${companyKind(co)}）`],
    ['拠点', esc(pl.name)],
    ['日付', fmtJp(p.date)],
    ['時間', timeRange(p)],
    ['申請経路', esc(p.via)],
    ['申請日時', esc(p.applied_at)]
  ];
  if (p.type === 'drop') rows.push(['車両ナンバー', esc(p.car_number)], ['ドライバー', `${esc(p.driver_name)}（${esc(p.driver_tel)}）`]);
  linesOf(p.id).forEach((l,i) => rows.push([`品目 ${i+1}`,
    `${esc(item(l.item_id).name)}　申告 ${dec(l.qty)} ${esc(unit(l.unit_id).name)}${l.actual_qty != null ? `　実数 ${dec(l.actual_qty)} ${esc(unit(l.unit_id).name)}` : ''}`]));
  if (p.note) rows.push(['連絡事項', esc(p.note)]);
  if (p.approved_at) rows.push(['承認', `${esc(p.approved_at)}／${esc(p.approved_by)}`]);
  if (p.dispatch_note) rows.push(['集荷手配メモ', esc(p.dispatch_note)]);
  if (p.reject_reason) rows.push(['変更依頼の理由', `${esc(p.reject_reason)}<div class="text-secondary" style="font-size:12px">${esc(p.rejected_at || '')} ${esc(p.rejected_by || '')}</div>`]);
  if (p.cancel_reason) rows.push(['取消理由', esc(p.cancel_reason)]);
  if (p.arrived_at) rows.push(['入場時刻', `${esc(p.arrived_at)}　伝票番号 ${p.receipt_number}`]);
  if (p.weight != null) rows.push(
    ['総重量', kg(p.total_weight)], ['空車重量', kg(p.car_weight)], ['正味重量', `<b>${kg(p.weight)}</b>`],
    ['申告との差異', `${p.diff > 0 ? '+' : ''}${num(p.diff)} kg${p.diff_reason ? '／' + esc(p.diff_reason) : ''}`]);
  return {
    title:`予約詳細 ${p.id}`,
    body: dl(rows) + `<h6 class="mt-3 mb-2" style="font-size:14px;font-weight:700">事前チェック</h6>
      <div class="d-flex flex-column gap-2">${checksOf(p).map(chkHtml).join('')}</div>`,
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">閉じる</button>`
  };
};

/* =========================================================================
   予約一覧ボード（日別）
   ========================================================================= */
function viewBoard() {
  const b = state.board, ds = b.date;
  const plants = PLANTS.filter(pl => plantScope().includes(pl.id));

  const dropRow = p => `<tr>
    <td class="mono">${p.id}</td>
    <td>${esc(company(p.company_id).name)}</td>
    <td style="font-size:13px">${esc(linesText(p.id))}</td>
    <td style="font-size:13px">${esc(p.car_number || '—')}</td>
    <td style="font-size:13px">${esc(p.driver_name || '—')}<div class="text-secondary" style="font-size:11px">${esc(p.driver_tel || '')}</div></td>
    <td>${stBadge(p.status)}${p.arrived_at ? `<div class="text-secondary" style="font-size:11px">入場 ${esc(p.arrived_at)}</div>` : ''}</td>
    <td class="text-end text-nowrap">
      <button class="btn btn-outline-secondary btn-sm" data-act="openPickupDetail" data-id="${p.id}">詳細</button>
      ${p.status === 'approved' ? `<button class="btn btn-outline-primary btn-sm ms-1" data-act="openChangeSlot" data-id="${p.id}">枠変更</button>
      <button class="btn btn-outline-danger btn-sm ms-1" data-act="openCancel" data-id="${p.id}">取消</button>` : ''}
    </td></tr>`;

  const blocks = plants.map(pl => {
    const cl = isClosed(pl.id, ds);
    const all = PICKUPS.filter(p => p.plant_id === pl.id && p.date === ds && !['pending','rejected'].includes(p.status));
    const drops = all.filter(p => p.type === 'drop');
    const picks = all.filter(p => p.type === 'pickup').sort((x,y) => x.begin_time < y.begin_time ? -1 : 1);
    const groups = (pl.slots || []).map(s => ({s, rows:drops.filter(p => p.begin_time === s.from && p.end_time === s.to)}));
    const other = drops.filter(p => !groups.some(g => g.rows.includes(p)));

    const dropHtml = b.tab === 'pickup' ? '' : (!pl.is_delivery
      ? `<div class="p-3 text-secondary" style="font-size:14px">この拠点は持込の受入に対応していません</div>`
      : groups.map(g => `<div class="card mb-3">
          <div class="card-head">${g.s.name}　${g.s.from} 〜 ${g.s.to}
            <span class="sub">${g.rows.length} 件</span></div>
          ${g.rows.length ? `<table class="table table-hover mb-0">
            <thead><tr><th>受付番号</th><th>取引先</th><th>品目・申告数量</th><th>車両ナンバー</th><th>ドライバー</th><th>ステータス</th><th></th></tr></thead>
            <tbody>${g.rows.map(dropRow).join('')}</tbody></table>`
          : `<div class="p-3 text-secondary" style="font-size:14px">この枠の予約はありません</div>`}
        </div>`).join('') +
        (other.length ? `<div class="card mb-3"><div class="card-head">枠外の時間　<span class="sub">${other.length} 件</span></div>
          <table class="table table-hover mb-0">
            <thead><tr><th>受付番号</th><th>取引先</th><th>品目・申告数量</th><th>車両ナンバー</th><th>ドライバー</th><th>ステータス</th><th></th></tr></thead>
            <tbody>${other.map(dropRow).join('')}</tbody></table></div>` : ''));

    const pickHtml = b.tab === 'drop' ? '' : `<div class="card mb-3">
      <div class="card-head">引取（集荷）　<span class="sub">${picks.length} 件／引取対応時間 ${pl.begin_time} 〜 ${pl.end_time}</span></div>
      ${!pl.is_pickup ? `<div class="p-3 text-secondary" style="font-size:14px">この拠点は引取に対応していません</div>`
      : picks.length ? `<table class="table table-hover mb-0">
        <thead><tr><th>受付番号</th><th>訪問時間</th><th>取引先</th><th>品目・想定数量</th><th>集荷手配メモ</th><th>ステータス</th><th></th></tr></thead>
        <tbody>${picks.map(p => `<tr>
          <td class="mono">${p.id}</td>
          <td class="mono">${timeRange(p)}</td>
          <td>${esc(company(p.company_id).name)}<div class="text-secondary" style="font-size:11px">${esc(company(p.company_id).address)}</div></td>
          <td style="font-size:13px">${esc(linesText(p.id))}</td>
          <td style="font-size:12px">${esc(p.dispatch_note || '—')}</td>
          <td>${stBadge(p.status)}</td>
          <td class="text-end text-nowrap">
            <button class="btn btn-outline-secondary btn-sm" data-act="openPickupDetail" data-id="${p.id}">詳細</button>
            ${p.status === 'approved' ? `<button class="btn btn-outline-primary btn-sm ms-1" data-act="openChangeVisit" data-id="${p.id}">訪問日時変更</button>
            <button class="btn btn-outline-danger btn-sm ms-1" data-act="openCancel" data-id="${p.id}">取消</button>` : ''}
          </td></tr>`).join('')}</tbody></table>`
      : `<div class="p-3 text-secondary" style="font-size:14px">この日の引取はありません</div>`}
    </div>`;

    return `<div class="mb-2">
      <div class="d-flex align-items-center gap-2 mb-2">
        <h2 style="font-size:16px;font-weight:700;margin:0">${ic('factory',16)} ${esc(pl.name)}</h2>
        ${cl ? `<span class="badge b-rejected">休業：${esc(cl.reason)}</span>` : `<span class="badge b-neutral">持込 ${drops.length} 件／引取 ${picks.length} 件</span>`}
      </div>
      ${cl && !all.length ? `<div class="empty mb-3">${fmtJp(ds)} は休業日です（${esc(cl.reason)}）</div>` : dropHtml + pickHtml}
    </div>`;
  }).join('');

  return pageHead('予約一覧ボード',
    '承認済の持込・引取を日別に表示します。受入時間枠の調整、引取の訪問日時変更、取消をここで行います。',
    null,
    `<button class="btn btn-outline-primary btn-sm" data-act="exportBoard">${ic('download')}CSV出力</button>`) +
  specNote('board') +
  `<div class="filterbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm btn-icon" data-act="boardShift" data-n="-1" aria-label="前日">${ic('left')}</button>
      <input type="date" class="form-control form-control-sm" style="width:170px" data-act="boardDate" value="${ds}">
      <button class="btn btn-outline-secondary btn-sm btn-icon" data-act="boardShift" data-n="1" aria-label="翌日">${ic('right')}</button>
      <button class="btn btn-outline-primary btn-sm" data-act="boardToday">本日</button>
    </div>
    <div class="ms-2 fw-bold">${fmtJp(ds)}${ds === D(0) ? '　<span class="badge b-method b-sq">本日</span>' : ''}</div>
    <div class="ms-auto">
      <div class="btn-group btn-group-sm" role="group">
        ${[['all','すべて'],['drop','持込'],['pickup','引取']].map(([v,t]) =>
          `<button type="button" class="btn ${b.tab === v ? 'btn-primary' : 'btn-outline-secondary'}" data-act="boardTab" data-tab="${v}">${t}</button>`).join('')}
      </div>
    </div>
  </div>
  ${blocks}`;
}

};

/* =========================================================================
   代行入力（電話で受けた予約・集荷依頼を社内が入力）
   取引先ポータルと同一の登録内容。登録後は同様に承認待ちとなる
   ========================================================================= */
const blankLine = () => ({item_id:'', qty:'', unit_id:''});
const blankProxy = () => ({
  company_id:'', plant_id:'pl1', type:'', date:'', slotId:'',
  begin_time:'', end_time:'',
  lines:[blankLine()],
  car_number:'', driver_name:'', driver_tel:'',
  note:'', errors:[]
});
function nextPickupNo() {
  const n = PICKUPS.map(p => Number(p.id.slice(-4))).reduce((a,b) => Math.max(a,b), 0);
  return 'R-2026-' + pad(n + 1);
}

function viewProxy() {
  if (!state.proxy) state.proxy = blankProxy();
  const d = state.proxy;
  const pl = plant(d.plant_id);
  const slotOpts = (pl.slots || []).map(s => ({v:s.id, t:`${s.name}　${s.from} 〜 ${s.to}`}));
  const err = d.errors.length ? `<div class="alert alert-danger" role="alert"><b>入力内容を確認してください</b>
    <ul class="mb-0 mt-2">${d.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '';

  const lines = d.lines.map((l,i) => `<div class="border rounded p-3 mb-2">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <b style="font-size:13px;color:var(--ink-sub)">品目 ${i+1}</b>
      ${d.lines.length > 1 ? `<button class="btn btn-outline-danger btn-sm btn-icon" data-act="pxRemoveLine" data-idx="${i}" aria-label="削除">${ic('trash',15)}</button>` : ''}
    </div>
    <div class="row g-2">
      <div class="col-12 col-md-6"><label class="form-label">品目<span class="req">必須</span></label>
        <select class="form-select" data-px="lines.${i}.item_id">${opts(ITEMS.map(x => ({v:x.id, t:`${x.name}（${itemTypeName(x.type)}）`})), l.item_id)}</select></div>
      <div class="col-6 col-md-3"><label class="form-label">申告数量<span class="req">必須</span></label>
        <input type="text" inputmode="decimal" class="form-control" data-px="lines.${i}.qty" value="${esc(l.qty)}" placeholder="例：1.2"></div>
      <div class="col-6 col-md-3"><label class="form-label">単位<span class="req">必須</span></label>
        <select class="form-select" data-px="lines.${i}.unit_id">${opts(o1(UNITS), l.unit_id)}</select></div>
    </div>
  </div>`).join('');

  return pageHead('代行入力',
    '電話で受けた予約・集荷依頼を社内で代行入力します。取引先ポータルからの申請と同じく、登録後は承認待ちになります。',
    null,
    `<button class="btn btn-outline-secondary btn-sm" data-act="pxReset">入力内容をクリア</button>`) +
  specNote('proxy') + err +
  `<div class="row g-3"><div class="col-12 col-xl-8">
    <div class="card mb-3"><div class="card-head">申請元</div><div class="card-body">
      <div class="row g-3">
        <div class="col-12 col-md-6"><label class="form-label">取引先<span class="req">必須</span></label>

function proxyPreview(d) {
  if (!d.company_id || !d.date || !d.type) return '<p class="hint mb-0">取引先・受入方法・日付を入力すると、取引先の登録状態や拠点の対応可否を表示します。</p>';
  const pl = plant(d.plant_id);
  const s = (pl.slots || []).find(x => x.id === d.slotId);
  const tmp = {
    id:'（新規）', type:d.type, status:'pending', company_id:d.company_id, plant_id:d.plant_id,
    date:d.date,
    begin_time: d.type === 'drop' ? (s ? s.from : '') : d.begin_time,
    end_time:   d.type === 'drop' ? (s ? s.to   : '') : d.end_time
  };
  return `<div class="d-flex flex-column gap-2">${checksOf(tmp).map(chkHtml).join('')}</div>
    <div class="form-text mt-2">注意があっても登録は可能です。可否の確定判断は承認者が行います。</div>`;
}

function pxValidate() {
  const d = state.proxy, e = [], pl = plant(d.plant_id);
  if (!d.company_id) e.push('取引先を選択してください。');
  if (!d.type) e.push('受入方法を選択してください。');
  if (!d.date) e.push('日付を入力してください。');
  if (d.type === 'drop') {
    if (!d.slotId) e.push('受入時間枠を選択してください。');
    if (!d.car_number.trim()) e.push('車両ナンバーを入力してください。');
    if (!d.driver_name.trim()) e.push('ドライバー名を入力してください。');
    if (!d.driver_tel.trim()) e.push('ドライバーの連絡先を入力してください。');
  } else if (d.type === 'pickup') {
    if (!d.begin_time) e.push('引取希望時間の開始を入力してください。');
    if (!d.end_time) e.push('引取希望時間の終了を入力してください。');
    if (d.begin_time && d.end_time && d.end_time <= d.begin_time) e.push('終了時間は開始時間より後にしてください。');
  }
  d.lines.forEach((l,i) => {
    const n = `品目 ${i+1}：`;
    if (!l.item_id) e.push(n + '品目を選択してください。');
    if (!String(l.qty).trim()) e.push(n + '申告数量を入力してください。');
    else if (isNaN(Number(l.qty))) e.push(n + '申告数量は数字で入力してください。');
    if (!l.unit_id) e.push(n + '単位を選択してください。');
  });
  d.errors = e;
  return e.length === 0;
}
function pxSubmit() {
  if (!pxValidate()) { render(); return; }
  const d = state.proxy, now = new Date(), pl = plant(d.plant_id);
  const s = (pl.slots || []).find(x => x.id === d.slotId);
  const p = {
    id: nextPickupNo(), type:d.type, status:'pending',
    company_id:d.company_id, plant_id:d.plant_id, date:d.date,
    begin_time: d.type === 'drop' ? s.from : d.begin_time,
    end_time:   d.type === 'drop' ? s.to   : d.end_time,
    applied_at:`${D(0)} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    via:'電話（代行入力）', note:d.note
  };
  if (d.type === 'drop') Object.assign(p, {car_number:d.car_number, driver_name:d.driver_name, driver_tel:d.driver_tel});
  PICKUPS.unshift(p);
  d.lines.forEach(l => PICKUP_ITEMS.push({id:'pi' + (++_pi), pickup_id:p.id,
    item_id:l.item_id, unit_id:l.unit_id, qty:Number(l.qty)}));
  audit('代行入力', p.id, `${typeLabel(p.type)}／${company(p.company_id).name}／${fmtMd(p.date)}`);
  state.proxy = blankProxy();
  state.route = 'approvals';
  state.approval.sel = p.id;
  toast(`${p.id} を登録しました。承認キューに追加されています。`);
  render();
}

   受付時間・休業日の設定（拠点ごと）
   - 受入時間枠（持込）は複数設定可
   - 引取対応時間（≒営業時間）は単一設定
   - 枠ごとの受付上限・品目上限は設けない

function monthDays(ym) {
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= last.getDate(); d++) cells.push(dstr(new Date(y, m-1, d)));
  while (cells.length % 7) cells.push(null);
  return cells;
}
const shiftMonth = (ym, n) => {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
};
const monthLabel = ym => `${ym.split('-')[0]}年${Number(ym.split('-')[1])}月`;

      <span class="sub ms-2">セルをクリックすると臨時休業日を登録・解除できます</span>
      <span class="ms-auto sub">数字は承認済・申請中を含む予約件数</span></div>

/* 申告数量の重量換算（kg）。t/kg 以外の単位は換算しない */
function declaredKg(pickupId) {
  return linesOf(pickupId).reduce((s,l) => {
    const u = unit(l.unit_id).name;
    if (u === 't') return s + Number(l.qty) * 1000;
    if (u === 'kg') return s + Number(l.qty);
    return s;
  }, 0);
}
const todayList = () => PICKUPS.filter(p => p.date === D(0) && inScope(p) && ['approved','arrived','done'].includes(p.status));
function nextReceiptNumber(plantId, ds) {
  const n = PICKUPS.filter(p => p.plant_id === plantId && p.date === ds && p.receipt_number)
    .reduce((a,p) => Math.max(a, p.receipt_number), 0);
  return n + 1;
}

function viewReception() {
  const q = state.reception.q.trim();
  let list = todayList();
  if (q) list = list.filter(p => (p.id + (p.car_number || '') + company(p.company_id).name).includes(q));
  list.sort((a,b) => a.begin_time < b.begin_time ? -1 : 1);

  const st = p => p.status === 'done' ? {t:'計量済', c:'b-approved'}
    : p.status === 'arrived' ? {t:'入場済（計量待ち）', c:'b-pending'} : {t:'未着', c:'b-neutral'};

  const rows = list.map(p => {
    const s = st(p);
    return `<tr>
      <td class="mono">${p.id}${p.receipt_number ? `<div class="text-secondary" style="font-size:11px">伝票 No.${p.receipt_number}</div>` : ''}</td>

      <td class="mono nowrap">${timeRange(p)}</td>
      <td>${esc(company(p.company_id).name)}<div class="text-secondary" style="font-size:11px">${esc(plantShort(p.plant_id))}</div></td>
      <td style="font-size:13px">${esc(linesText(p.id))}</td>
      <td class="mono" style="font-size:13px">${esc(p.car_number || '—')}</td>
      <td>${p.weight != null ? `<b>${num(p.weight)}</b> kg` : '—'}</td>
      <td><span class="badge ${s.c}">${s.t}</span>${p.arrived_at ? `<div class="text-secondary" style="font-size:11px">入場 ${esc(p.arrived_at)}</div>` : ''}</td>

/* ---------- 計量モーダル ---------- */
function weighInit(id) {
  return {
    id, total_weight:'', car_weight:'',
    lines: linesOf(id).map(l => ({id:l.id, item_id:l.item_id, unit_id:l.unit_id, qty:l.qty, actual_qty:dec(l.qty)})),
    diff_reason:''
  };
}
var MODALS_WEIGH = m => {
  const p = pk(m.id);
  const net = Number(m.total_weight) - Number(m.car_weight);
  const netOk = m.total_weight !== '' && m.car_weight !== '' && net > 0;
  const dec_kg = declaredKg(p.id);
  const diff = netOk ? net - dec_kg : 0;
  const hasDiff = netOk && dec_kg > 0 && Math.abs(diff) / dec_kg > 0.1;

  const lineRows = m.lines.map((l,i) => {
    const d = Number(l.actual_qty) - Number(l.qty);
    return `<tr>
      <td><select class="form-select form-select-sm" data-mod="lines.${i}.item_id" data-rerender="1">${opts(o1(ITEMS), l.item_id, false)}</select></td>
      <td class="num">${dec(l.qty)}</td>
      <td class="num"><input type="text" inputmode="decimal" class="form-control form-control-sm text-end" style="width:96px" data-mod="lines.${i}.actual_qty" data-rerender="1" value="${esc(l.actual_qty)}"></td>
      <td><select class="form-select form-select-sm" style="width:90px" data-mod="lines.${i}.unit_id" data-rerender="1">${opts(o1(UNITS), l.unit_id, false)}</select></td>
      <td class="num ${Math.abs(d) > 0.001 ? 'text-danger fw-bold' : ''}">${d > 0 ? '+' : ''}${dec(d)}</td>
      <td>${m.lines.length > 1 ? `<button class="btn btn-outline-danger btn-sm btn-icon" data-act="weighRemoveLine" data-idx="${i}" aria-label="削除">${ic('trash',14)}</button>` : ''}</td>
    </tr>`;
  }).join('');

  return {
    title:`計量入力　${p.id}　${esc(company(p.company_id).name)}`,
    body:`<div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><label class="form-label">総重量（kg）<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="total_weight" data-rerender="1" value="${esc(m.total_weight)}" placeholder="例：6120"></div>
        <div class="col-6 col-md-3"><label class="form-label">空車重量（kg）<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="car_weight" data-rerender="1" value="${esc(m.car_weight)}" placeholder="例：2480"></div>
        <div class="col-12 col-md-6">${kpi('正味重量（自動算出）', netOk ? num(net) + ' <small>kg</small>' : '<small class="text-secondary">総重量・空車重量を入力</small>',
          netOk && dec_kg ? `申告 ${num(dec_kg)} kg ／ 差異 ${diff > 0 ? '+' : ''}${num(diff)} kg` : '')}</div>
      </div>
      <h6 style="font-size:14px;font-weight:700">実搬入内容（申告との差異を記録します）</h6>
      <div class="table-wrap mb-2"><table class="table table-sm mb-0">
        <thead><tr><th style="width:34%">品目</th><th class="num">申告</th><th class="num">実数量</th><th>単位</th><th class="num">差異</th><th></th></tr></thead>
        <tbody>${lineRows}</tbody></table></div>
      <button class="btn btn-outline-primary btn-sm mb-3" data-act="weighAddLine">${ic('plus',15)}品目を追加</button>
      ${hasDiff ? `<div class="mb-3"><label class="form-label">差異理由<span class="req">必須</span></label>
        <select class="form-select" data-mod="diff_reason">${opts([
          {v:'実測差（申告は目安）',t:'実測差（申告は目安）'},{v:'品目の相違',t:'品目の相違'},
          {v:'積込時に追加発生分あり',t:'積込時に追加発生分あり'},{v:'異物混入',t:'異物混入'},{v:'その他',t:'その他'}], m.diff_reason)}</select></div>` : ''}
      ${m.err ? `<div class="text-danger" style="font-size:13px">${esc(m.err)}</div>` : ''}
      <div class="form-text">確定すると実績として記録され、実績一覧・CSV出力の対象になります。</div>`,
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>

};

/* =========================================================================
   実績一覧
   ========================================================================= */
function filteredActuals() {
  const f = state.actuals;
  return PICKUPS.filter(p =>
    p.status === 'done' && inScope(p) &&
    p.date >= f.from && p.date <= f.to &&
    (!f.companyId || p.company_id === f.companyId) &&
    (!f.type || p.type === f.type) &&
    (!f.itemId || linesOf(p.id).some(l => l.item_id === f.itemId)) &&
    (!f.diffOnly || (p.diff_reason && p.diff_reason !== ''))
  ).sort((a,b) => a.date === b.date ? (a.id < b.id ? 1 : -1) : (a.date < b.date ? 1 : -1));
}

function viewActuals() {
  const f = state.actuals, list = filteredActuals();

      <td class="num">${num(p.car_weight)}</td>

    <div class="f"><label>区分</label><select class="form-select form-select-sm" data-act="acFilter" data-key="type">${opts([{v:'drop',t:'持込'},{v:'pickup',t:'引取'}], f.type, 'すべて')}</select></div>

function getPath(o, p) { return p.split('.').reduce((t,k) => (t == null ? t : t[k]), o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let t = o;
  for (let i = 0; i < ks.length - 1; i++) { if (t[ks[i]] == null) t[ks[i]] = {}; t = t[ks[i]]; }
  t[ks[ks.length-1]] = v;
}
const MASTERS = {

function cellText(col, row) {
  const v = getPath(row, col.k);
  if (col.type === 'bool') return v ? `<span class="badge b-approved b-sq">${ic('check',13)}</span>` : '<span class="text-secondary">—</span>';
  if (col.fmt) return v == null || v === '' ? '<span class="text-secondary">—</span>' : col.fmt(v);
  if (col.type === 'select' && col.opts) {
    const o = col.opts().find(x => String(x.v) === String(v));
    return o ? esc(o.t) : (v ? esc(v) : '<span class="text-secondary">—</span>');
  }
  return v == null || v === '' ? '<span class="text-secondary">—</span>' : esc(v);
}
function viewMaster(route) {
  const m = MASTERS[route], rows = m.data(), cols = m.cols.filter(c => c.list);

    </tr>`).join('') : `<tr><td colspan="${cols.length + 1}" class="text-center text-secondary py-4">登録がありません</td></tr>`}</tbody>
  </table></div>`;

/* =========================================================================
   ルーティング・描画
   ========================================================================= */
const VIEWS = {
  approvals: viewApprovals, board: viewBoard, proxy: viewProxy,
  hours: viewHours, reception: viewReception, actuals: viewActuals,
  m_companies: viewCompanies, audit: viewAudit, invite: viewInvite
};
Object.keys(MASTERS).forEach(k => VIEWS[k] = () => viewMaster(k));

const MODALS = {
  approve: MODALS_APPROVE, reject: MODALS_REJECT, pickup: MODALS_PICKUP,
  changeSlot: MODALS_CHANGESLOT, changeVisit: MODALS_CHANGEVISIT, cancel: MODALS_CANCEL,
  slot: MODALS_SLOT, holiday: MODALS_HOLIDAY,
  weigh: MODALS_WEIGH, spot: MODALS_SPOT, refuse: MODALS_REFUSE,
  newCompany: MODALS_NEWCOMPANY, invite: MODALS_INVITE, company: MODALS_COMPANY,
  master: MODALS_MASTER
};

const nowHm = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
let lastRoute = null;

function focusKey(el) {
  if (!el || !el.dataset) return null;
  const d = el.dataset;
  if (d.px)  return 'px:'  + d.px;
  if (d.mod) return 'mod:' + d.mod;
  if (d.inv) return 'inv:' + d.inv;
  if (d.key) return 'key:' + d.key;
  return null;
}
function restoreFocus(key, pos) {
  if (!key) return;
  const i = key.indexOf(':'), t = key.slice(0, i), v = key.slice(i+1);
  const el = document.querySelector(`[data-${t}="${window.CSS && CSS.escape ? CSS.escape(v) : v}"]`);
  if (!el) return;
  el.focus({preventScroll:true});
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}

function renderSidebar() {
  document.getElementById('elSidebar').innerHTML = NAV.map(sec => {
    const items = sec.items.map(it => {
      const cnt = it.badge ? pendingCount() : 0;
      return `<a href="#${it.route}" class="navitem ${state.route === it.route ? 'active' : ''}" data-act="go" data-route="${it.route}">
        <span class="ico">${ic(it.ico, 17)}</span><span>${it.label}</span>
        ${cnt ? `<span class="cnt">${cnt}</span>` : ''}</a>`;
    }).join('');
    return `<div class="navsec">${sec.sec}</div>${items}`;
  }).join('');
}

function renderChrome() {
  const ps = document.getElementById('elPlantSel');
  if (!ps.options.length) {
    ps.innerHTML = `<option value="all">すべての拠点</option>` +
      PLANTS.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('elMenuBtn').innerHTML = ic('menu');
    document.getElementById('elEmitterBtn').innerHTML = ic('login',15) + '排出者側の画面';
    document.getElementById('elWho').textContent = `${ME.role}　${ME.name}`;
  }
  ps.value = state.plantId;
  const n = pendingCount();
  document.getElementById('elNotifBtn').innerHTML =
    ic('bell') + (n ? ` <span class="badge b-rejected b-sq" style="padding:1px 6px">${n}</span>` : '');
}

const BRAND_HTML = '産廃予約管理システム<span>株式会社エコクリーン埼玉（処理業者）</span>';
const BRAND_INVITE = '産廃予約システム<span>取引先アカウント登録</span>';

function render() {
  const y = window.scrollY;
  const isInvite = state.route === 'invite';
  document.body.classList.toggle('invite-mode', isInvite);
  document.querySelector('.topbar .brand').innerHTML = isInvite ? BRAND_INVITE : BRAND_HTML;
  ['elPlantSel','elNotifBtn','elWho','elEmitterBtn','elMenuBtn'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = isInvite ? 'none' : '';
  });
  const af = document.activeElement, fk = focusKey(af);
  const pos = af && af.setSelectionRange ? (af.selectionStart || 0) : 0;
  renderChrome();
  renderSidebar();
  document.getElementById('elView').innerHTML = VIEWS[state.route]();
  if (state.route !== lastRoute) { window.scrollTo(0,0); lastRoute = state.route; }
  else window.scrollTo(0, y);
  restoreFocus(fk, pos);
  const hash = state.route === 'invite' ? `#invite/${state.invite.token}` : '#' + state.route;
  if (location.hash !== hash) history.replaceState(null, '', hash);
}
function go(route) {
  state.route = route;
  document.getElementById('elSidebar').classList.remove('open');
  render();
}

/* =========================================================================
   イベント
   ========================================================================= */
document.addEventListener('input', e => {
  const d = e.target.dataset;
  const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (d.px)  { setPath(state.proxy, d.px, val); if (d.px === 'date') render(); return; }
  if (d.mod) { modBind(d.mod, val); if (d.rerender) renderModal(); return; }
  if (d.inv) { state.invite.form[d.inv] = val; return; }
  if (d.act === 'apFilter') { state.approval[d.key] = val; render(); return; }
  if (d.act === 'recQ')     { state.reception.q = val; render(); return; }
  if (d.act === 'acFilter') { state.actuals[d.key] = val; render(); return; }
});
/* テキスト入力の change は blur 時に発火し、再描画するとクリック対象のボタンが
   作り直されてクリックが失われる。再描画はセレクト・チェック・日付のみに限定する */
document.addEventListener('change', e => {
  const d = e.target.dataset;
  const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  const structural = e.target.tagName === 'SELECT' || ['checkbox','radio','date'].includes(e.target.type);
  if (d.px) {
    setPath(state.proxy, d.px, val);
    if (d.px === 'plant_id') { state.proxy.slotId = ''; }
    if (d.px === 'date') state.proxy.slotId = state.proxy.slotId;
    if (structural) render();
    return;
  }
  if (d.mod) { modBind(d.mod, val); if (structural) renderModal(); return; }
  if (d.inv) { state.invite.form[d.inv] = val; return; }
  if (d.plantflag) {
    const pl = plant(state.hours.plantId);
    pl[d.plantflag] = val;
    audit('時間設定変更', pl.name, `${d.plantflag === 'is_delivery' ? '持込受入' : '引取対応'}を${val ? '有効' : '無効'}に変更`);
    render(); return;
  }
  if (d.act === 'boardDate')   { state.board.date = val; render(); return; }
  if (d.act === 'acFilter')    { state.actuals[d.key] = val; if (structural) render(); return; }
  if (d.act === 'apFilter')    { state.approval[d.key] = val; if (structural) render(); return; }
  if (d.act === 'switchPlant') { state.plantId = val; state.approval.sel = null; render(); return; }
});

function modBind(key, val) {
  const m = state.modal; if (!m) return;
  if (key.startsWith('row.')) { setPath(m.row, key.slice(4), val); return; }
  setPath(m, key, val);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (el.tagName === 'A' && !el.getAttribute('href').startsWith('emitter')) e.preventDefault();
  if (['SELECT','INPUT','TEXTAREA'].includes(el.tagName)) return;
  const m = state.modal;

  switch (a) {
    /* ---- 共通 ---- */
    case 'go': go(d.route); break;
    case 'toggleNav': document.getElementById('elSidebar').classList.toggle('open'); break;
    case 'toggleNote': state.noteOpen = state.noteOpen === d.route ? null : d.route; render(); break;
    case 'closeModal': closeModal(); render(); break;
    case 'openNotif':
      toast(`承認待ち ${pendingCount()} 件（通知チャネルはLINE／LINE WORKS等を想定・要確定）`);
      go('approvals'); break;

    /* ---- 承認キュー ---- */
    case 'selApproval': state.approval.sel = d.id; render(); break;
    case 'openPickupDetail': openModal('pickup', {id:d.id}); break;
    case 'openApprove': {
      const p = pk(d.id), pl = plant(p.plant_id);
      const s = slotOf(pl, p) || (pl.slots || [])[0] || {};
      openModal('approve', {id:d.id, date:p.date, slotId:s.id,
        begin_time:p.begin_time, end_time:p.end_time, dispatch_note:p.dispatch_note || '', comment:''});
      break;
    }
    case 'openReject': openModal('reject', {id:d.id, reason:''}); break;
    case 'pickAlt':
      m.reason = (m.reason ? m.reason.replace(/\s*$/,'') + '\n' : '') + `代替候補：${d.label}（${d.sub}）`;
      renderModal(); break;
    case 'doApprove': {
      const p = pk(m.id), pl = plant(p.plant_id);
      if (p.type === 'drop') {
        const s = (pl.slots || []).find(x => x.id === m.slotId);
        if (!s) { m.err = '受入時間枠を選択してください。'; renderModal(); return; }
        p.date = m.date || p.date; p.begin_time = s.from; p.end_time = s.to;
      } else {
        if (!m.date || !m.begin_time || !m.end_time) { m.err = '訪問日時を入力してください。'; renderModal(); return; }
        if (m.end_time <= m.begin_time) { m.err = '終了時刻は開始時刻より後にしてください。'; renderModal(); return; }
        Object.assign(p, {date:m.date, begin_time:m.begin_time, end_time:m.end_time, dispatch_note:m.dispatch_note || ''});
      }
      p.status = 'approved'; p.approved_at = `${D(0)} ${nowHm()}`; p.approved_by = `${ME.role} ${ME.name.split(' ')[0]}`;
      if (m.comment) p.approve_comment = m.comment;
      audit('承認', p.id, `${typeLabel(p.type)}／${fmtMd(p.date)} ${timeRange(p)}`);
      closeModal(); state.approval.sel = null;
      toast(`${p.id} を承認しました。取引先へ通知を送信しました。`);
      render(); break;
    }
    case 'doReject': {
      if (!m.reason || !m.reason.trim()) { m.err = '理由を入力してください。'; renderModal(); return; }
      const p = pk(m.id);
      p.status = 'rejected'; p.reject_reason = m.reason.trim();
      p.rejected_at = `${D(0)} ${nowHm()}`; p.rejected_by = `${ME.role} ${ME.name.split(' ')[0]}`;
      audit('変更依頼', p.id, m.reason.trim().split('\n')[0]);
      closeModal(); state.approval.sel = null;
      toast(`${p.id} に変更依頼を送りました。取引先が修正して再申請します。`, 'warn');
      render(); break;
    }

    /* ---- 予約一覧ボード ---- */
    case 'boardShift': state.board.date = dstr(addDays(parseD(state.board.date), Number(d.n))); render(); break;
    case 'boardToday': state.board.date = D(0); render(); break;
    case 'boardTab': state.board.tab = d.tab; render(); break;
    case 'openChangeSlot': {
      const p = pk(d.id), pl = plant(p.plant_id), s = slotOf(pl, p) || (pl.slots || [])[0] || {};
      openModal('changeSlot', {id:d.id, date:p.date, slotId:s.id, reason:''}); break;
    }
    case 'doChangeSlot': {
      if (!m.reason || !m.reason.trim()) { m.err = '変更理由を入力してください。'; renderModal(); return; }
      const p = pk(m.id), pl = plant(p.plant_id);
      const s = (pl.slots || []).find(x => x.id === m.slotId);
      if (!s) { m.err = '受入時間枠を選択してください。'; renderModal(); return; }
      const before = `${fmtMd(p.date)} ${timeRange(p)}`;
      p.date = m.date; p.begin_time = s.from; p.end_time = s.to;
      audit('受入時間枠の変更', p.id, `${before} → ${fmtMd(p.date)} ${timeRange(p)}（${m.reason}）`);
      closeModal(); toast(`${p.id} の受入時間枠を変更し、取引先へ通知しました。`); render(); break;
    }
    case 'openChangeVisit': {
      const p = pk(d.id);
      openModal('changeVisit', {id:d.id, date:p.date, begin_time:p.begin_time, end_time:p.end_time,
        dispatch_note:p.dispatch_note || '', reason:''}); break;
    }
    case 'doChangeVisit': {
      if (!m.reason || !m.reason.trim()) { m.err = '変更理由を入力してください。'; renderModal(); return; }
      if (m.end_time <= m.begin_time) { m.err = '終了時刻は開始時刻より後にしてください。'; renderModal(); return; }
      const p = pk(m.id);
      Object.assign(p, {date:m.date, begin_time:m.begin_time, end_time:m.end_time, dispatch_note:m.dispatch_note});
      audit('訪問日時の変更', p.id, `${fmtMd(p.date)} ${timeRange(p)}（${m.reason}）`);
      closeModal(); toast(`${p.id} の訪問日時を変更し、取引先へ通知しました。`); render(); break;
    }
    case 'openCancel': openModal('cancel', {id:d.id, reason:''}, 'modal-md'); break;
    case 'doCancel': {
      if (!m.reason || !m.reason.trim()) { m.err = '取消理由を入力してください。'; renderModal(); return; }
      const p = pk(m.id);
      p.status = 'canceled'; p.cancel_reason = m.reason.trim(); p.canceled_at = `${D(0)} ${nowHm()}`;
      audit('取消', p.id, m.reason.trim());
      closeModal(); toast(`${p.id} を取消しました。`, 'warn'); render(); break;
    }
    case 'exportBoard': {
      const ds = state.board.date;
      const rows = [['日付','受付番号','区分','ステータス','拠点','時間','取引先','品目・申告数量','車両ナンバー','ドライバー','連絡先','集荷手配メモ']];
      PICKUPS.filter(p => p.date === ds && inScope(p) && !['pending','rejected'].includes(p.status))
        .forEach(p => rows.push([ds, p.id, typeLabel(p.type), STATUS[p.status].t, plant(p.plant_id).name,
          timeRange(p), company(p.company_id).name, linesText(p.id),
          p.car_number || '', p.driver_name || '', p.driver_tel || '', p.dispatch_note || '']));
      downloadCsv(`予約一覧_${ds}.csv`, rows);
      toast('CSVを出力しました。'); break;
    }

    /* ---- 代行入力 ---- */
    case 'pxType': state.proxy.type = d.v; state.proxy.slotId = ''; state.proxy.errors = []; render(); break;
    case 'pxAddLine': state.proxy.lines.push(blankLine()); render(); break;
    case 'pxRemoveLine':
      state.proxy.lines.splice(Number(d.idx), 1);
      if (!state.proxy.lines.length) state.proxy.lines.push(blankLine());
      render(); break;
    case 'pxReset': state.proxy = blankProxy(); render(); break;
    case 'pxSubmit': pxSubmit(); break;

    /* ---- 受付時間・休業日 ---- */
    case 'hoursPlant': state.hours.plantId = d.id; render(); break;
    case 'hoursMonth': state.hours.month = shiftMonth(state.hours.month, Number(d.n)); render(); break;
    case 'goHours': state.hours.plantId = d.id; go('hours'); break;
    case 'openSlot': openModal('slot', {plantId:d.plant, slotId:d.slot || null}, 'modal-md'); break;
    case 'saveSlot': {
      const pl = plant(m.plantId);
      const s = (pl.slots || []).find(x => x.id === m.slotId);
      const name = m.name != null ? m.name : (s ? s.name : '');
      const from = m.from != null ? m.from : (s ? s.from : '');
      const to   = m.to   != null ? m.to   : (s ? s.to   : '');
      if (!name.trim() || !from || !to) { m.err = '名称・開始・終了をすべて入力してください。'; renderModal(); return; }
      if (to <= from) { m.err = '終了は開始より後にしてください。'; renderModal(); return; }
      if (s) { Object.assign(s, {name:name.trim(), from, to}); }
      else {
        pl.slots.push({id:'s' + Date.now().toString(36), name:name.trim(), from, to});
        pl.slots.sort((x,y) => x.from < y.from ? -1 : 1);
      }
      audit('時間設定変更', pl.name, `受入時間枠を${s ? '変更' : '追加'}（${name} ${from}〜${to}）`);
      closeModal(); toast('受入時間枠を保存しました。'); render(); break;
    }
    case 'delSlot': {
      const pl = plant(d.plant);
      const s = pl.slots.find(x => x.id === d.slot);
      if (!confirm(`受入時間枠「${s.name} ${s.from}〜${s.to}」を削除します。よろしいですか？`)) return;
      pl.slots = pl.slots.filter(x => x.id !== d.slot);
      audit('時間設定変更', pl.name, `受入時間枠を削除（${s.name} ${s.from}〜${s.to}）`);
      toast('受入時間枠を削除しました。', 'warn'); render(); break;
    }
    case 'saveHours': {
      const pl = plant(d.id);
      const b = document.querySelector('[data-hours="begin_time"]').value;
      const t = document.querySelector('[data-hours="end_time"]').value;
      if (!b || !t || t <= b) { toast('引取対応時間を確認してください。', 'err'); return; }
      pl.begin_time = b; pl.end_time = t;
      audit('時間設定変更', pl.name, `引取対応時間を ${b}〜${t} に変更`);
      toast('引取対応時間を保存しました。'); render(); break;
    }
    case 'saveDows': {
      const pl = plant(d.id);
      pl.closed_dows = [...document.querySelectorAll('[data-dow]')].filter(x => x.checked).map(x => Number(x.dataset.dow));
      audit('時間設定変更', pl.name, `定休日を ${pl.closed_dows.map(i => DOW[i]).join('・') || 'なし'} に変更`);
      toast('定休日を保存しました。'); render(); break;
    }
    case 'openHoliday': openModal('holiday', {plantId:state.hours.plantId, date:d.date}, 'modal-md'); break;
    case 'saveHoliday': {
      if (!m.reason || !String(m.reason).trim()) { m.err = '理由を入力してください。'; renderModal(); return; }
      const pl = plant(m.plantId), ex = holidayOf(pl.id, d.date);
      if (ex) ex.reason = String(m.reason).trim();
      else HOLIDAYS.push({id:'h' + Date.now().toString(36), plant_id:pl.id, date:d.date, reason:String(m.reason).trim()});
      audit('時間設定変更', pl.name, `${d.date} を臨時休業に設定（${String(m.reason).trim()}）`);
      closeModal(); toast(`${fmtMd(d.date)} を臨時休業にしました。`); render(); break;
    }
    case 'delHoliday': {
      const h = HOLIDAYS.find(x => x.id === d.id);
      HOLIDAYS = HOLIDAYS.filter(x => x.id !== d.id);
      audit('時間設定変更', plant(h.plant_id).name, `${h.date} の臨時休業を解除`);
      closeModal(); toast('臨時休業を解除しました。'); render(); break;
    }

    /* ---- 入場受付・計量 ---- */
    case 'doArrive': {
      const p = pk(d.id);
      p.status = 'arrived'; p.arrived_at = nowHm();
      p.receipt_number = nextReceiptNumber(p.plant_id, p.date);
      audit('入場受付', p.id, `入場 ${p.arrived_at}／伝票番号 No.${p.receipt_number}`);
      toast(`${p.id} を入場受付しました（伝票 No.${p.receipt_number}）。`); render(); break;
    }
    case 'openWeigh': openModal('weigh', weighInit(d.id), 'modal-xl'); break;
    case 'weighAddLine': m.lines.push({id:null, item_id:'', unit_id:'u2', qty:0, actual_qty:''}); renderModal(); break;
    case 'weighRemoveLine': m.lines.splice(Number(d.idx), 1); renderModal(); break;
    case 'doWeigh': {
      const p = pk(m.id);
      const g = Number(m.total_weight), c = Number(m.car_weight);
      if (m.total_weight === '' || m.car_weight === '' || isNaN(g) || isNaN(c)) { m.err = '総重量・空車重量を数字で入力してください。'; renderModal(); return; }
      if (g <= c) { m.err = '総重量は空車重量より大きい値を入力してください。'; renderModal(); return; }
      if (m.lines.some(l => !l.item_id || !l.unit_id || l.actual_qty === '' || isNaN(Number(l.actual_qty)) || Number(l.actual_qty) <= 0)) {
        m.err = '実数量は品目ごとに正の数で入力してください。'; renderModal(); return;
      }
      const net = g - c, dk = declaredKg(p.id);
      const hasDiff = dk > 0 && Math.abs(net - dk) / dk > 0.1;
      if (hasDiff && !m.diff_reason) { m.err = '差異理由を選択してください。'; renderModal(); return; }
      PICKUP_ITEMS = PICKUP_ITEMS.filter(l => l.pickup_id !== p.id);
      m.lines.forEach(l => PICKUP_ITEMS.push({id:l.id || 'pi' + (++_pi), pickup_id:p.id,
        item_id:l.item_id, unit_id:l.unit_id, qty:Number(l.qty) || 0, actual_qty:Number(l.actual_qty)}));
      Object.assign(p, {status:'done', total_weight:g, car_weight:c, weight:net,
        diff: dk ? net - dk : 0, diff_reason: m.diff_reason || ''});
      audit('計量実績の登録', p.id, `正味 ${num(net)} kg（総重量 ${num(g)} − 空車 ${num(c)}）`);
      closeModal(); toast(`${p.id} の実績を確定しました（正味 ${num(net)} kg）。`); render(); break;
    }
    case 'openSpot': openModal('spot', {company_id:'', plant_id:PLANTS.filter(p => p.is_delivery)[0].id,
      item_id:'', qty:'', unit_id:'u2', car_number:'', total_weight:'', car_weight:''}); break;
    case 'doSpot': {
      if (!m.company_id || !m.item_id || !m.unit_id || !String(m.qty).trim()) { m.err = '取引先・品目・数量・単位を入力してください。'; renderModal(); return; }
      const g = Number(m.total_weight), c = Number(m.car_weight);
      if (!m.total_weight || !m.car_weight || isNaN(g) || isNaN(c) || g <= c) { m.err = '総重量・空車重量を確認してください。'; renderModal(); return; }
      const id = nextPickupNo(), net = g - c;
      PICKUPS.unshift({id, type:'drop', status:'done', company_id:m.company_id, plant_id:m.plant_id,
        date:D(0), begin_time:nowHm(), end_time:nowHm(),
        car_number:m.car_number || '', driver_name:'', driver_tel:'',
        applied_at:`${D(0)} ${nowHm()}`, via:'飛び込み',
        approved_at:`${D(0)} ${nowHm()}`, approved_by:`${ME.role} ${ME.name.split(' ')[0]}`,
        arrived_at:nowHm(), receipt_number:nextReceiptNumber(m.plant_id, D(0)),
        total_weight:g, car_weight:c, weight:net, diff:0, diff_reason:'飛び込み搬入（予約なし）'});
      PICKUP_ITEMS.push({id:'pi' + (++_pi), pickup_id:id, item_id:m.item_id, unit_id:m.unit_id,
        qty:Number(m.qty), actual_qty:Number(m.qty)});
      audit('飛び込み搬入の登録', id, `${company(m.company_id).name}／${item(m.item_id).name}／正味 ${num(net)} kg`);
      closeModal(); toast(`飛び込み搬入 ${id} を実績登録しました。`); render(); break;
    }
    case 'openRefuse': openModal('refuse', {id:d.id, reason:''}, 'modal-md'); break;
    case 'doRefuse': {
      if (!m.reason) { m.err = '理由を選択してください。'; renderModal(); return; }
      const p = pk(m.id);
      p.status = 'canceled'; p.cancel_reason = m.reason; p.canceled_at = `${D(0)} ${nowHm()}`;
      audit(p.type === 'drop' ? '受入拒否の記録' : '集荷不可の記録', p.id, m.reason);
      closeModal(); toast(`${p.id} を「${m.reason}」として記録しました。`, 'warn'); render(); break;
    }

    /* ---- 実績一覧 ---- */
    case 'exportActuals': {
      const rows = [['受付番号','日付','伝票番号','区分','取引先','拠点','品目','申告数量','単位','実数量','総重量kg','空車重量kg','正味重量kg','差異kg','差異理由','入場時刻']];
      filteredActuals().forEach(p => linesOf(p.id).forEach(l => rows.push([
        p.id, p.date, p.receipt_number || '', typeLabel(p.type), company(p.company_id).name, plant(p.plant_id).name,
        item(l.item_id).name, l.qty, unit(l.unit_id).name, l.actual_qty != null ? l.actual_qty : '',
        p.total_weight, p.car_weight, p.weight, p.diff, p.diff_reason || '', p.arrived_at || ''])));
      downloadCsv(`実績一覧_${state.actuals.from}_${state.actuals.to}.csv`, rows);
      toast(`実績 ${filteredActuals().length} 件をCSV出力しました。`); break;
    }

    /* ---- 取引先マスタ ---- */
    case 'newCompany': openModal('newCompany', {is_generator:true, is_transporter:false}); break;
    case 'doNewCompany': {
      if (!m.name || !m.name.trim()) { m.err = '取引先名を入力してください。'; renderModal(); return; }
      if (!m.is_generator && !m.is_transporter) { m.err = '区分を1つ以上選択してください。'; renderModal(); return; }
      let n = COMPANIES.length + 1;
      while (COMPANIES.find(x => x.id === 'c' + n)) n++;
      const c = {id:'c' + n, name:m.name.trim(), kana:m.kana || '',
        is_generator:!!m.is_generator, is_transporter:!!m.is_transporter,
        postalcode:'', pref:'', address:'', phone:m.phone || '', email:'', contact:m.contact || '',
        invoice:'', bank:'', credit:'', contract_file:m.contract_file || '',
        status:'invited', token:randToken(), invited_at:`${D(0)} ${nowHm()}`, registered_at:null};
      COMPANIES.push(c);
      audit('取引先の招待', c.name, '登録用URLを発行');
      state.modal = null;
      openModal('invite', {id:c.id});
      toast(`${c.name} を作成し、登録用URLを発行しました。`);
      render(); break;
    }
    case 'showInvite': openModal('invite', {id:d.id}); break;
    case 'copyInvite': {
      const url = INVITE_BASE + d.token;
      if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
      toast('登録用URLをコピーしました。'); break;
    }
    case 'sendInvite': {
      const c = company(d.id);
      audit('取引先の招待', c.name, '登録用URLをメール送付（モック）');
      toast(`${c.contact || 'ご担当者'} 様へ登録用URLを送付しました（モック）。`); break;
    }
    case 'openInvitePage':
      closeModal();
      state.invite = {token:d.token, form:null, done:false};
      go('invite'); break;
    case 'doInvite': {
      const c = COMPANIES.find(x => x.token === d.token), f = state.invite.form, e2 = [];
      if (!f.contact.trim()) e2.push('ご担当者名を入力してください。');
      if (!f.phone.trim()) e2.push('電話番号を入力してください。');
      if (!f.email.trim()) e2.push('メールアドレスを入力してください。');
      else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.trim())) e2.push('メールアドレスの形式を確認してください。');
      if (f.password.length < 8) e2.push('パスワードは8文字以上で入力してください。');
      if (f.password !== f.password2) e2.push('パスワード（確認）が一致しません。');
      f.errors = e2;
      if (e2.length) { render(); return; }
      Object.assign(c, {status:'active', contact:f.contact, email:f.email, phone:f.phone,
        postalcode:f.postalcode, pref:f.pref, address:f.address, invoice:f.invoice, bank:f.bank,
        registered_at:`${D(0)} ${nowHm()}`});
      audit('取引先の本登録', c.name, `${f.email} で登録完了`);
      state.invite.done = true;
      toast(`${c.name} の本登録が完了しました。`);
      render(); break;
    }
    case 'editCompany': openModal('company', {i:Number(d.i), row:JSON.parse(JSON.stringify(COMPANIES[Number(d.i)]))}); break;
    case 'saveCompany': {
      if (!m.row.name || !m.row.name.trim()) { m.err = '取引先名を入力してください。'; renderModal(); return; }
      Object.assign(COMPANIES[m.i], m.row);
      audit('マスタ更新', '取引先マスタ', `${m.row.name} を更新`);
      closeModal(); toast('保存しました。'); render(); break;
    }
    case 'delCompany': {
      const c = COMPANIES[Number(d.i)];
      if (!confirm(`取引先「${c.name}」を削除します。よろしいですか？`)) return;
      COMPANIES.splice(Number(d.i), 1);
      audit('マスタ削除', '取引先マスタ', `${c.name} を削除`);
      toast('削除しました。', 'warn'); render(); break;
    }
    case 'csvCompanies': {
      const rows = [['取引先名','フリガナ','排出事業者','運搬業者','担当者','メールアドレス','電話番号','郵便番号','都道府県','住所','インボイス登録番号','振込先口座','与信区分','契約書','状態','招待日時','登録日時']];
      COMPANIES.forEach(c => rows.push([c.name, c.kana, c.is_generator ? '○' : '', c.is_transporter ? '○' : '',
        c.contact, c.email, c.phone, c.postalcode, c.pref, c.address, c.invoice, c.bank, c.credit,
        c.contract_file, c.status === 'active' ? '本登録済' : '招待中', c.invited_at || '', c.registered_at || '']));
      downloadCsv('取引先マスタ.csv', rows);
      toast('CSVを出力しました。'); break;
    }

    /* ---- 拠点・品目・単位マスタ ---- */
    case 'mAdd': {
      const mm = MASTERS[d.m], row = {};
      mm.cols.forEach(c => setPath(row, c.k, c.type === 'bool' ? false : ''));
      if (d.m === 'm_plants') Object.assign(row, {slots:[], closed_dows:[0], begin_time:'08:00', end_time:'17:00'});
      openModal('master', {m:d.m, idx:null, row}); break;
    }
    case 'mEdit': openModal('master', {m:d.m, idx:Number(d.i), row:JSON.parse(JSON.stringify(MASTERS[d.m].data()[Number(d.i)]))}); break;
    case 'mDel': {
      const arr = MASTERS[d.m].data(), i = Number(d.i);
      if (!confirm(`${MASTERS[d.m].title}の「${arr[i].name}」を削除します。よろしいですか？`)) return;
      const removed = arr.splice(i, 1)[0];
      audit('マスタ削除', MASTERS[d.m].title, `${removed.name} を削除`);
      toast('削除しました。', 'warn'); render(); break;
    }
    case 'mSave': {
      const mm = MASTERS[m.m], arr = mm.data();
      const miss = mm.cols.filter(c => c.req && !getPath(m.row, c.k));
      if (miss.length) { m.err = `必須項目が未入力です：${miss.map(c => c.label).join('、')}`; renderModal(); return; }
      if (m.idx == null) {
        const pref = (arr[0] && arr[0].id ? String(arr[0].id).replace(/\d+$/,'') : 'x');
        let n = arr.length + 1;
        while (arr.find(x => x.id === pref + n)) n++;
        m.row.id = pref + n;
        arr.push(m.row);
        audit('マスタ登録', mm.title, `${m.row.name} を登録`);
      } else {
        Object.assign(arr[m.idx], m.row);
        audit('マスタ更新', mm.title, `${arr[m.idx].name} を更新`);
      }
      closeModal(); toast('保存しました。'); render(); break;
    }
    case 'mCsv': {
      const mm = MASTERS[d.m];
      const rows = [mm.cols.map(c => c.label)];
      mm.data().forEach(r => rows.push(mm.cols.map(c => {
        const v = getPath(r, c.k);
        return typeof v === 'boolean' ? (v ? '○' : '') : (v == null ? '' : v);
      })));
      downloadCsv(`${mm.title}.csv`, rows);
      toast('CSVを出力しました。'); break;
    }
    case 'exportAudit': {
      const rows = [['日時','操作者','操作','対象','内容']];
      AUDIT.forEach(x => rows.push([x.at, x.user, x.act, x.target, x.detail]));
      downloadCsv('監査ログ.csv', rows);
      toast('CSVを出力しました。'); break;
    }
  }
});

/* =========================================================================
   初期化
   ========================================================================= */
function applyHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('invite/')) {
    state.invite = {token:h.slice(7), form:null, done:false};
    state.route = 'invite';
    return true;
  }
  if (VIEWS[h] && h !== 'invite') { state.route = h; return true; }
  return false;
}
applyHash();
window.addEventListener('hashchange', () => { if (applyHash()) render(); });
render();
</script>
</body>
</html>
