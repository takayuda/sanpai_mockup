<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>産廃DX｜処理業者 管理画面 モック（第1期）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* =========================================================================
   デザイントークン（排出元ポータル ワイヤーフレームと共通）
   ========================================================================= */
:root{
  --blue-900:#000B5F; --blue-800:#0017C1; --blue-100:#E8F1FE;
  --ink:#1A1A1C; --ink-sub:#626264;
  --line:#D8D8DB; --line-strong:#767676;
  --bg:#F2F2F2; --white:#FFFFFF;
  --error:#CE0000; --error-bg:#FDEEEE;
  --success:#197A4B; --success-bg:#E6F5EC;
  --warn:#B75200; --warn-bg:#FDF3E6;
  --radius:8px;
  --sidebar-w:248px; --topbar-h:64px;

  /* Bootstrap 5 のトークンを上書きして既存モックの配色に合わせる */
  --bs-primary:#0017C1; --bs-primary-rgb:0,23,193;
  --bs-body-font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --bs-body-font-size:16px; --bs-body-line-height:1.7;
  --bs-body-color:#1A1A1C; --bs-body-color-rgb:26,26,28;
  --bs-body-bg:#F2F2F2;
  --bs-border-color:#D8D8DB;
  --bs-border-radius:8px; --bs-border-radius-sm:6px; --bs-border-radius-lg:8px;
  --bs-link-color:#0017C1; --bs-link-hover-color:#000B5F;
  --bs-link-color-rgb:0,23,193;
  --bs-emphasis-color:#1A1A1C;
  --bs-secondary-color:#626264;
}
body{-webkit-font-smoothing:antialiased;}
:focus-visible{outline:3px solid #FFD43D;outline-offset:0;box-shadow:0 0 0 5px var(--ink);border-radius:2px;}

/* ボタン */
.btn{font-weight:700;}
.btn-primary{--bs-btn-bg:var(--blue-800);--bs-btn-border-color:var(--blue-800);--bs-btn-hover-bg:var(--blue-900);--bs-btn-hover-border-color:var(--blue-900);--bs-btn-active-bg:var(--blue-900);--bs-btn-active-border-color:var(--blue-900);--bs-btn-disabled-bg:#9A9A9C;--bs-btn-disabled-border-color:#9A9A9C;}
.btn-outline-primary{--bs-btn-color:var(--blue-800);--bs-btn-border-color:var(--blue-800);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--blue-100);--bs-btn-hover-color:var(--blue-900);--bs-btn-hover-border-color:var(--blue-800);--bs-btn-active-bg:var(--blue-100);--bs-btn-active-color:var(--blue-900);--bs-btn-active-border-color:var(--blue-800);}
.btn-outline-danger{--bs-btn-color:var(--error);--bs-btn-border-color:var(--error);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--error-bg);--bs-btn-hover-color:var(--error);--bs-btn-hover-border-color:var(--error);--bs-btn-active-bg:var(--error-bg);--bs-btn-active-color:var(--error);--bs-btn-active-border-color:var(--error);}
.btn-outline-secondary{--bs-btn-color:var(--ink);--bs-btn-border-color:var(--line-strong);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--bg);--bs-btn-hover-color:var(--ink);--bs-btn-hover-border-color:var(--line-strong);--bs-btn-active-bg:var(--bg);--bs-btn-active-color:var(--ink);--bs-btn-active-border-color:var(--line-strong);}
.btn-success{--bs-btn-bg:var(--success);--bs-btn-border-color:var(--success);--bs-btn-hover-bg:#14603B;--bs-btn-hover-border-color:#14603B;--bs-btn-active-bg:#14603B;--bs-btn-active-border-color:#14603B;}

/* フォーム */
.form-control,.form-select{border-color:var(--line-strong);}
.form-control:focus,.form-select:focus{border-color:var(--blue-800);box-shadow:0 0 0 .2rem rgba(0,23,193,.15);}
.form-label{font-weight:700;font-size:15px;margin-bottom:6px;}
.form-text{color:var(--ink-sub);}
.req{font-size:12px;font-weight:700;color:var(--error);border:1px solid var(--error);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}
.opt{font-size:12px;font-weight:500;color:var(--ink-sub);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}

/* レイアウト */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:1030;}
.topbar .brand{font-weight:700;font-size:17px;white-space:nowrap;line-height:1.25;}
.topbar .brand span{display:block;font-size:11px;font-weight:400;color:var(--ink-sub);}
.sidebar{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--line);overflow-y:auto;padding:12px 0 40px;z-index:1020;}
.sidebar .navsec{font-size:11px;font-weight:700;color:var(--ink-sub);letter-spacing:.06em;padding:16px 20px 6px;}
.sidebar a.navitem{display:flex;align-items:center;gap:10px;padding:9px 20px 9px 17px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent;}
.sidebar a.navitem:hover{background:var(--blue-100);}
.sidebar a.navitem.active{background:var(--blue-100);border-left-color:var(--blue-800);color:var(--blue-800);font-weight:700;}
.sidebar a.navitem.locked{opacity:.42;pointer-events:none;}
.sidebar .navitem .ico{width:20px;text-align:center;flex:none;font-size:15px;}
.sidebar .navitem .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--error);color:#fff;border-radius:99px;padding:1px 8px;}
.sidebar .navitem .tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-sub);border:1px solid var(--line);border-radius:4px;padding:0 5px;}
.content{margin-left:var(--sidebar-w);padding:24px 28px 80px;padding-top:calc(var(--topbar-h) + 24px);}
.page-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
.page-h h1{font-size:24px;font-weight:700;margin:0;}
.page-lead{color:var(--ink-sub);font-size:14px;margin:0 0 20px;}
.fnids{display:flex;gap:6px;flex-wrap:wrap;}
.fnid{font-size:11px;font-weight:700;color:var(--blue-900);background:var(--blue-100);border:1px solid var(--blue-800);border-radius:4px;padding:1px 7px;}

/* カード・パネル */
.card{border-color:var(--line);border-radius:var(--radius);overflow-x:auto;}
.card-head{background:#FAFAFA;border-bottom:1px solid var(--line);padding:10px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.card-head .sub{font-weight:400;font-size:13px;color:var(--ink-sub);}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;height:100%;}
.kpi .t{font-size:12px;color:var(--ink-sub);font-weight:500;margin-bottom:2px;}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-sub);}
.kpi.alert-kpi{border-color:var(--error);background:var(--error-bg);}
.kpi.alert-kpi .v{color:var(--error);}

/* テーブル */
.table{--bs-table-bg:var(--white);font-size:14px;border-color:var(--line);margin-bottom:0;}
.table thead th{background:#FAFAFA;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle;}
.table td,.table th{padding:10px 12px;vertical-align:middle;}
.table td.num,.table th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;background:var(--white);}
.table tbody tr.clickable{cursor:pointer;}
.table tbody tr.clickable:hover{background:var(--blue-100);}
.table tbody tr.sel{background:var(--blue-100);box-shadow:inset 3px 0 0 var(--blue-800);}
.table tbody tr.dim td{color:var(--ink-sub);background:#FBFBFB;}

/* バッジ */
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px;border:1px solid transparent;}
.b-pending{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
.b-approved{background:var(--success-bg);color:var(--success);border-color:var(--success);}
.b-rejected{background:var(--error-bg);color:var(--error);border-color:var(--error);}
.b-method{background:var(--blue-100);color:var(--blue-900);border-color:var(--blue-800);}
.b-neutral{background:var(--white);color:var(--ink-sub);border-color:var(--line-strong);}
.b-dark{background:var(--blue-900);color:#fff;border-color:var(--blue-900);}
.b-sq{border-radius:4px;}

/* 事前チェック */
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);}
.chk.ok{border-color:var(--success);background:var(--success-bg);}
.chk.ng{border-color:var(--error);background:var(--error-bg);}
.chk.wa{border-color:var(--warn);background:var(--warn-bg);}
.chk .m{font-weight:700;flex:none;}

/* 枠メーター */
.meter{margin-bottom:10px;}
.meter .lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.meter .lbl b{font-variant-numeric:tabular-nums;}
.meter .bar{height:8px;background:#EDEDEF;border-radius:99px;overflow:hidden;display:flex;}
.meter .bar span{display:block;height:100%;background:var(--blue-800);}
.meter.over .bar span{background:var(--error);}
.meter.near .bar span{background:var(--warn);}
.meter .bar span.pend{background:repeating-linear-gradient(45deg,#B0B0B4,#B0B0B4 3px,#D8D8DB 3px,#D8D8DB 6px);}

/* 枠カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-sub);padding:4px 0;}
.cal .day{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:6px 7px;min-height:86px;text-align:left;font:inherit;cursor:pointer;}
.cal .day:hover{background:var(--blue-100);}
.cal .day .d{font-size:13px;font-weight:700;}
.cal .day .m{font-size:11px;color:var(--ink-sub);line-height:1.45;font-variant-numeric:tabular-nums;}
.cal .day.off{background:#F4F4F5;color:#9A9A9C;}
.cal .day.off .m{color:#9A9A9C;}
.cal .day.today{border:2px solid var(--blue-800);padding:5px 6px;}
.cal .day.tight{background:var(--warn-bg);border-color:var(--warn);}
.cal .day.full{background:var(--error-bg);border-color:var(--error);}
.cal .day.blank{background:transparent;border:0;cursor:default;}
.cal .day .ov{font-size:10px;font-weight:700;color:var(--warn);}

/* 仕様メモ */
.specnote{border:1px dashed var(--line-strong);border-radius:var(--radius);background:#FBFBFC;padding:0;margin-bottom:20px;}
.specnote > button{width:100%;text-align:left;background:none;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--ink-sub);padding:9px 14px;cursor:pointer;}
.specnote .in{padding:0 16px 14px;font-size:13px;}
.specnote h6{font-size:12px;font-weight:700;color:var(--ink-sub);margin:10px 0 4px;}
.specnote ul{margin:0;padding-left:18px;}
.specnote li{margin-bottom:2px;}
.specnote .q{color:var(--warn);font-weight:700;}

/* その他 */
.empty{background:var(--white);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-sub);}
.hint{font-size:13px;color:var(--ink-sub);margin:0 0 6px;}
.sticky-col{position:sticky;top:calc(var(--topbar-h) + 16px);}
.divline{border-top:1px solid var(--line);margin:16px 0;}
.mono{font-variant-numeric:tabular-nums;}
.filterbar{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.filterbar .f{min-width:150px;}
.filterbar .f label{font-size:12px;font-weight:700;color:var(--ink-sub);display:block;margin-bottom:2px;}
.toast-host{position:fixed;right:20px;bottom:20px;z-index:1090;display:flex;flex-direction:column;gap:8px;}
.toast-item{background:var(--blue-900);color:#fff;border-radius:var(--radius);padding:12px 18px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.24);max-width:420px;}
.toast-item.warn{background:var(--warn);}
.toast-item.err{background:var(--error);}
.modal-header{border-bottom-color:var(--line);}
.modal-footer{border-top-color:var(--line);}
.modal-title{font-size:18px;font-weight:700;}
.dl{display:grid;grid-template-columns:120px 1fr;gap:0;font-size:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.dl dt{background:#FAFAFA;padding:8px 12px;font-weight:500;color:var(--ink-sub);border-bottom:1px solid var(--line);margin:0;}
.dl dd{padding:8px 12px;border-bottom:1px solid var(--line);margin:0;font-weight:500;}
.dl dt:nth-last-of-type(1),.dl dd:nth-last-of-type(1){border-bottom:0;}
.timeline{list-style:none;margin:0;padding:0;font-size:13px;}
.timeline li{padding:6px 0 6px 18px;border-left:2px solid var(--line);margin-left:6px;position:relative;}
.timeline li::before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--line-strong);}
.timeline li.on::before{background:var(--blue-800);}
@media (max-width:767px){
  .topbar{gap:8px;padding:0 12px;}
  .topbar .brand{font-size:14px;}
  .topbar #elSiteSel{display:none;}
}
@media (max-width:991px){
  :root{--sidebar-w:0px;}
  .sidebar{transform:translateX(-100%);transition:transform .2s;width:248px;}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.4);}
  .content{padding:calc(var(--topbar-h) + 16px) 14px 64px;}
}
</style>
</head>
<body>

  <button class="btn btn-outline-secondary btn-sm d-lg-none" data-act="toggleNav" aria-label="メニュー">☰</button>
  <div class="brand">産廃予約管理システム<span>株式会社エコクリーン埼玉（処理業者）</span></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* =========================================================================
   産廃DX 処理業者 管理画面モック（第1期スコープ）
   - 仕様書「20260727_産廃システム仕様書_v2」7.2 社内向け画面に対応
   - データはすべてブラウザ内のダミー。リロードで初期状態に戻る
   ========================================================================= */

/* ---------- 日付ユーティリティ ---------- */
const DOW = ['日','月','火','水','木','金','土'];
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const D = n => dstr(addDays(TODAY,n));
const parseD = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y,m-1,dd); };
const fmtMd = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`; };
const fmtJp = s => { const d = parseD(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };
const ymOf = s => s.slice(0,7);
/* 稼働日（日曜以外）で n 日後／n 日前を返す。ダミーデータが休業日に乗らないようにするため */
function bizDay(n) {
  let d = new Date(TODAY), c = 0, step = n < 0 ? -1 : 1;
  while (c < Math.abs(n)) { d = addDays(d, step); if (d.getDay() !== 0) c++; }
  return dstr(d);
}
function B(n) { return bizDay(n); }

/* ---------- 拠点・ロール ---------- */
const BASES = [
  {id:'b1', name:'本社工場（さいたま中間処理場）'},
  {id:'b2', name:'川口ヤード（複数拠点展開は将来）', disabled:true}
];
const ROLES = [
  {id:'admin',  name:'システム管理者'},
  {id:'uke',    name:'受入責任者'},
  {id:'haisha', name:'配車責任者'},
  {id:'eigyo',  name:'営業'},
  {id:'keiryo', name:'計量・構内担当'},
  {id:'keiri',  name:'経理'}
];

/* ---------- E-01 取引先マスタ ---------- */
const PARTNERS = [
  {id:'c1', name:'株式会社サンプル建設', kana:'サンプルケンセツ', type:'emitter',
   invoice:'T1234567890123', pay:'月末締／翌月末払', credit:'A', tel:'048-000-0001',
   addr:'埼玉県さいたま市大宮区桜木町0-0-0'},
  {id:'c2', name:'大宮運輸株式会社', kana:'オオミヤウンユ', type:'carrier',
   invoice:'T2345678901234', pay:'月末締／翌月20日払', credit:'B', tel:'048-000-0002',
   addr:'埼玉県さいたま市北区宮原町0-0-0',
   permit:{no:'第01100000001号', pref:'埼玉県', expire:'2027-03-31',
           items:['廃プラスチック類','木くず','金属くず','混合廃棄物']}},
  {id:'c3', name:'埼玉建設工業株式会社', kana:'サイタマケンセツコウギョウ', type:'both',
   invoice:'T3456789012345', pay:'20日締／翌月10日払', credit:'A', tel:'048-000-0003',
   addr:'埼玉県さいたま市浦和区高砂0-0-0',
   permit:{no:'第01100000002号', pref:'埼玉県', expire:D(34),
           items:['ガラス・コンクリート・陶磁器くず','汚泥']}},
  {id:'c4', name:'株式会社グリーンハウス', kana:'グリーンハウス', type:'emitter',
   invoice:'T4567890123456', pay:'月末締／翌月末払', credit:'C', tel:'04-000-0004',
   addr:'埼玉県所沢市くすのき台0-0-0'},
  {id:'c5', name:'武蔵野解体株式会社', kana:'ムサシノカイタイ', type:'emitter',
   invoice:'T5678901234567', pay:'月末締／翌月末払', credit:'B', tel:'048-000-0005',
   addr:'埼玉県さいたま市中央区下落合0-0-0'}
];

/* ---------- E-02 事業所・排出現場マスタ ---------- */
const SITES = [
  {id:'st1', partnerId:'c1', name:'大宮第一現場', addr:'埼玉県さいたま市大宮区桜木町0-0-0',
   road:'4m以上', machine:'あり', attend:'不要', note:'搬出口は南側ゲート'},
  {id:'st2', partnerId:'c1', name:'川越倉庫', addr:'埼玉県川越市脇田本町0-0-0',
   road:'3m未満', machine:'なし', attend:'要', note:'2t車まで進入可'},
  {id:'st3', partnerId:'c3', name:'浦和第二工区', addr:'埼玉県さいたま市浦和区仲町0-0-0',
   road:'4m以上', machine:'あり', attend:'不要', note:''},
  {id:'st4', partnerId:'c4', name:'所沢資材置場', addr:'埼玉県所沢市くすのき台0-0-0',
   road:'4m以上', machine:'なし', attend:'要', note:'スポット案件'},
  {id:'st5', partnerId:'c5', name:'与野解体現場', addr:'埼玉県さいたま市中央区本町東0-0-0',
   road:'3m未満', machine:'あり', attend:'要', note:'近隣配慮のため9時以降'}
];

let ACTUALS = [];

/* 疑似乱数（毎回同じダミーを生成するための固定シード） */
let _seed = 20260727;
const rnd = () => { _seed = (_seed * 1103515245 + 12345) % 2147483648; return _seed / 2147483648; };
const pick = a => a[Math.floor(rnd()*a.length)];
const round1 = n => Math.round(n*10)/10;

/* 過去45日ぶんの実績・売上をダミー生成（実績一覧・締め処理の検証用） */
(function seedHistory(){
  let an = 240, sn = 520, rn = 100;
  for (let k = 45; k >= 1; k--) {
    const ds = D(-k), dow = parseD(ds).getDay();
    if (dow === 0) continue;
    const cnt = dow === 6 ? 2 : 3 + Math.floor(rnd()*3);
    for (let j = 0; j < cnt; j++) {
      const ct = pick(CONTRACTS);
      const itemId = pick(ct.items);
      const it = ITEMS.find(x => x.id === itemId);
      const method = rnd() < 0.3 ? 'pickup' : 'drop';
      const site = SITES.find(s => s.partnerId === ct.partnerId) || SITES[0];
      const veh = pick(VEHICLES.slice(1));
      const declared = round1(0.4 + rnd()*4);
      const gross = Math.round((declared + 2.5) * 1000);
      const tare  = Math.round(2500 + rnd()*400);
      const net   = it.unit === 'm3' ? round1(declared * (0.9 + rnd()*0.3))
                                     : round1((gross - tare) / 1000);
      const resvNo = 'R-2026-' + String(rn++).padStart(4,'0');
      const a = {
        id:'A-2026-0' + (an++), date:ds, resvNo, method,
        partnerId:ct.partnerId, siteId:site.id, itemId, unit:it.unit,
        declared, gross, tare, net,
        vehicleId:veh.id, plate:'大宮 100 あ ' + (10+Math.floor(rnd()*80)) + '-' + (10+Math.floor(rnd()*80)),
        diffReason: Math.abs(net - declared) / Math.max(declared, 0.1) > 0.25 ? '実測差（申告は目安）' : '',
        spot:false, status:'fixed', allocations:null
      };
      ACTUALS.push(a);
      SALES.push(...buildSalesFor(a, 'S-2026-' + String(sn++).padStart(4,'0')));
    }
  }
  /* 前月は締め済み */
  const lastYm = ymOf(D(-32));
  CLOSINGS.push({ym:lastYm, closedAt:D(-4)+' 18:20', by:'経理 小林'});
  SALES.forEach(s => { if (ymOf(s.date) === lastYm) s.closed = true; });
  ACTUALS.forEach(a => { if (ymOf(a.date) === lastYm) a.status = 'closed'; });

  /* 本日ぶんの計量済み実績（R-2026-0164） */

    vehicleId:'v4', plate:'大宮 100 あ 12-34',
    diffReason:'積込時に追加発生分あり', spot:false, status:'fixed', allocations:null
  };
  ACTUALS.push(todayA);
  SALES.push(...buildSalesFor(todayA, 'S-2026-0999'));

  AUDIT = [
    {at:D(-4)+' 18:20', user:'経理 小林',        role:'経理',       target:'月次締め '+lastYm, act:'締め処理', detail:'対象期間の実績を確定'},

const partner   = id => PARTNERS.find(x => x.id === id) || {};

/* 数量を品目の標準単位に換算する（kg→t など） */
function toStd(qty, unit, itemId) {
  const it = item(itemId), q = Number(qty) || 0;
  if (it.unit === unit) return q;
  if (it.unit === 't'  && unit === 'kg') return q / 1000;
  if (it.unit === 'kg' && unit === 't')  return q * 1000;
  return q; /* m3/個/台は換算しない */
}
/* 予約の申告数量（重量換算 t。枠消費量の目安に使う） */
function declaredWeight(r) {
  return (r.lines || []).reduce((s, ln) => {
    const it = item(ln.itemId);
    if (it.unit === 'm3') return s + toStd(ln.qty, ln.unit, ln.itemId) * 0.3; /* 暫定換算係数 */
    return s + toStd(ln.qty, ln.unit, ln.itemId);
  }, 0);
}
const lineText = ln => `${item(ln.itemId).name} ${dec(ln.qty)}${ln.unit}${ln.memo ? '（' + ln.memo + '）' : ''}`;
const linesText = r => (r.lines || []).map(lineText).join(' ／ ');

/* =========================================================================
   マスタ参照ロジック（契約・単価）
   ========================================================================= */
function activeContract(partnerId, date) {
  return CONTRACTS.find(k => k.partnerId === partnerId && k.from <= date && date <= k.to);
}
function disposalPrice(contractId, itemId, date) {
  return DISPOSAL_PRICES
    .filter(p => p.contractId === contractId && p.itemId === itemId && p.from <= date)
    .sort((a,b) => a.from < b.from ? 1 : -1)[0];
}
function transportPrice(contractId, siteId, vehicleId, date) {
  return TRANSPORT_PRICES
    .filter(p => p.contractId === contractId && p.siteId === siteId && p.from <= date)
    .sort((a,b) => a.from < b.from ? 1 : -1)
    .find(p => !vehicleId || p.vehicleId === vehicleId);
}
/* 単価の適用状態（マスタ画面の表示用） */
function priceState(p, sameKeyList) {
  const today = D(0);
  if (p.from > today) return {t:'適用前', c:'b-neutral'};
  const newer = sameKeyList.filter(x => x.from <= today && x.from > p.from);
  return newer.length ? {t:'失効', c:'b-neutral'} : {t:'適用中', c:'b-approved'};
}

/* =========================================================================
   F-01〜F-04 売上明細の生成
   実績（正味重量）× 契約単価。単価はスナップショットとして明細に保存する
   ========================================================================= */
function buildSalesFor(a, no) {
  const out = [];
  const ct = activeContract(a.partnerId, a.date);
  const it = ITEMS.find(x => x.id === a.itemId) || {};
  const dp = ct ? disposalPrice(ct.id, a.itemId, a.date) : null;
  const qty = a.net;
  if (dp) {
    let amount = dp.price * qty;
    let minApplied = false;
    if (dp.price > 0 && dp.min && amount < dp.min) { amount = dp.min; minApplied = true; }
    out.push({
      no, date:a.date, actualId:a.id, partnerId:a.partnerId, siteId:a.siteId,
      kind: dp.price < 0 ? 'purchase' : 'sales',      /* F-04 有価物は仕入 */
      category:'処分費', itemId:a.itemId, qty, unit:it.unit,
      unitPrice:dp.price, priceType:dp.type, minApplied, amount,
      contractId:ct.id, closed:false, red:false
    });
  } else {
    out.push({
      no, date:a.date, actualId:a.id, partnerId:a.partnerId, siteId:a.siteId,
      kind:'sales', category:'処分費', itemId:a.itemId, qty, unit:it.unit,
      unitPrice:null, priceType:null, minApplied:false, amount:0,
      contractId:null, closed:false, red:false, warn:'契約・単価が未登録のため金額未確定'
    });
  }
  /* F-02 引取は運搬費を別明細で計上 */
  if (a.method === 'pickup' && ct) {
    const tp = transportPrice(ct.id, a.siteId, a.vehicleId, a.date)
            || transportPrice(ct.id, a.siteId, null, a.date);
    if (tp) out.push({
      no: no + '-T', date:a.date, actualId:a.id, partnerId:a.partnerId, siteId:a.siteId,
      kind:'sales', category:'運搬費', itemId:null, qty:1, unit:'運行',
      unitPrice:tp.price, priceType:'固定', minApplied:false, amount:tp.price,
      contractId:ct.id, closed:false, red:false
    });
  }
  /* F-03 追加料金（異物混入などの記録がある場合） */
  if (a.extras && a.extras.length) {
    a.extras.forEach((x, i) => {
      const ex = EXTRA_CHARGES.find(e => e.id === x.id);
      if (!ex) return;
      out.push({
        no: no + '-X' + (i+1), date:a.date, actualId:a.id, partnerId:a.partnerId, siteId:a.siteId,
        kind:'sales', category:ex.name, itemId:null, qty:Number(x.qty) || 1, unit:ex.type,
        unitPrice:ex.price, priceType:ex.type, minApplied:false,
        amount:ex.price * (Number(x.qty) || 1), contractId:ct ? ct.id : null, closed:false, red:false
      });
    });
  }
  return out;
}

/* =========================================================================
   B-02〜B-09 枠のロジック
   ========================================================================= */
/* その日の受入枠 */
function capacityOf(ds) {
  const ov = capacity.days[ds] || {};
  const base = capacity.weekly[parseD(ds).getDay()];
  if (ov.closed || (!base && !ov.slots)) {
    return {closed:true, reason: ov.reason || '定休日', slots:[], override: !!ov.closed};
  }
  const slots = SLOTS.filter(s => s.active).map(s => {
    const b = (base && base[s.id]) || null;
    const o = (ov.slots && ov.slots[s.id]) || null;
    if (!b && !o) return null;
    return {
      id:s.id, label:s.label,
      trucks: o && o.trucks != null ? o.trucks : b.trucks,
      weight: o && o.weight != null ? o.weight : b.weight,
      override: !!o
    };
  }).filter(Boolean);
  return {closed:false, reason: ov.reason || '', slots, override: !!ov.slots};
}
/* その日の引取枠上限 */
function pickupLimitOf(ds) {
  const ov = pickupCapacity.days[ds];
  if (ov && ov.limit != null) return {limit:ov.limit, override:true, reason:ov.reason || ''};
  const w = pickupCapacity.weekly[parseD(ds).getDay()];
  return {limit: w == null ? 0 : w, override:false, reason:''};
}
/* その日の枠消化（承認済＝確定消費、申請中＝仮消費） */
function usageOf(ds) {
  const u = {slots:{}, items:{}, pickup:{fixed:0, pending:0}};
  SLOTS.forEach(s => u.slots[s.id] = {trucks:0, weight:0, pTrucks:0, pWeight:0});
  ITEMS.forEach(i => u.items[i.id] = {fixed:0, pending:0});
  RESV.forEach(r => {
    if (r.date !== ds) return;
    if (['canceled','rejected'].includes(r.status)) return;
    const isPending = r.status === 'pending';
    if (r.method === 'drop') {
      const s = u.slots[r.slotId]; if (!s) return;
      const t = Number(r.vCount) || 1, w = declaredWeight(r);
      if (isPending) { s.pTrucks += t; s.pWeight += w; } else { s.trucks += t; s.weight += w; }
    } else {
      if (isPending) u.pickup.pending++; else u.pickup.fixed++;
    }
    (r.lines || []).forEach(ln => {
      const b = u.items[ln.itemId]; if (!b) return;
      const q = toStd(ln.qty, ln.unit, ln.itemId);
      if (isPending) b.pending += q; else b.fixed += q;
    });
  });
  return u;
}
/* 枠メーター */
function meter(label, used, pending, cap, unit) {
  const total = used + pending;
  const p1 = cap ? Math.min(100, used / cap * 100) : 0;
  const p2 = cap ? Math.min(100 - p1, pending / cap * 100) : 0;
  const cls = cap && total > cap ? 'over' : (cap && total / cap >= 0.8 ? 'near' : '');
  return `<div class="meter ${cls}">
    <div class="lbl"><span>${esc(label)}</span>
      <b>${dec(used)}${pending ? ` <span style="color:var(--ink-sub)">(+申請中 ${dec(pending)})</span>` : ''} / ${dec(cap)} ${unit}</b></div>
    <div class="bar"><span style="width:${p1}%"></span><span class="pend" style="width:${p2}%"></span></div>
  </div>`;
}

/* =========================================================================
   A-06 / C-08 / C-09 事前チェック（契約・許可・枠）
   可否の確定判断は承認者が行う。ここでは判断材料の提示のみ
   ========================================================================= */
function checksOf(r) {
  const out = [];
  const em = partner(r.emitterId), ap = partner(r.applicantId);
  const ct = activeContract(r.emitterId, r.date);
  /* C-08 契約有無 */
  if (ct) out.push({lv:'ok', m:'契約', t:`${ct.kind}／${ct.from}〜${ct.to}`});
  else out.push({lv:'ng', m:'契約', t:`${em.name} との有効な委託契約が見つかりません（未締結または期間外）`});
  /* 契約対象品目 */
  if (ct) {
    const ng = (r.lines || []).filter(ln => !ct.items.includes(ln.itemId));
    if (ng.length) out.push({lv:'wa', m:'対象品目', t:`契約対象外の品目があります：${ng.map(l => item(l.itemId).name).join('、')}`});
  }
  /* C-09 許可有効性（申請者が運搬業者の場合） */
  if (ap.id !== em.id || ap.type === 'carrier' || ap.type === 'both') {
    const pm = ap.permit;
    if (!pm) out.push({lv:'wa', m:'許可', t:`${ap.name} の収集運搬業許可が未登録です`});
    else if (pm.expire < r.date) out.push({lv:'ng', m:'許可', t:`許可の有効期限が切れています（${pm.expire}）`});
    else {
      const soon = pm.expire <= D(60);
      const ngItems = (r.lines || []).filter(ln => !pm.items.includes(item(ln.itemId).name));
      if (ngItems.length) out.push({lv:'ng', m:'許可', t:`許可品目に含まれない品目があります：${ngItems.map(l => item(l.itemId).name).join('、')}`});
      else out.push({lv: soon ? 'wa' : 'ok', m:'許可',
        t:`${pm.pref}／${pm.no}／有効期限 ${pm.expire}${soon ? '（60日以内に期限切れ）' : ''}`});
    }
  }
  /* 代理申請の可否（E-03） */
  if (ap.id !== em.id) {
    const rel = RELATIONS.find(x => x.carrierId === ap.id && x.emitterId === em.id);
    if (!rel || !rel.proxy) out.push({lv:'ng', m:'代理', t:`${ap.name} は ${em.name} の代理予約が許可されていません`});
    else out.push({lv:'ok', m:'代理', t:`取引関係マスタに登録あり（${rel.note}）`});
  }
  /* A-06 枠残 */
  const cap = capacityOf(r.date);
  if (cap.closed) out.push({lv:'ng', m:'稼働', t:`${fmtMd(r.date)} は受付停止（${cap.reason}）`});
  else if (r.method === 'drop') {
    const u = usageOf(r.date), s = cap.slots.find(x => x.id === r.slotId);
    if (!s) out.push({lv:'ng', m:'枠', t:'指定の時間帯は設定されていません'});
    else {
      const t = u.slots[r.slotId].trucks + u.slots[r.slotId].pTrucks;
      const w = u.slots[r.slotId].weight + u.slots[r.slotId].pWeight;
      const over = t > s.trucks || w > s.weight;
      out.push({lv: over ? 'wa' : 'ok', m:'枠',
        t:`${s.label}：着車 ${dec(t)}/${s.trucks} 台、処理量 ${dec(w)}/${s.weight} t${over ? '　← 申請中を含めると上限超過' : ''}`});
    }
  } else {
    const lim = pickupLimitOf(r.date), u = usageOf(r.date);
    const c = u.pickup.fixed + u.pickup.pending;
    out.push({lv: c > lim.limit ? 'wa' : 'ok', m:'引取枠',
      t:`${fmtMd(r.date)}：${c}/${lim.limit} 件${c > lim.limit ? '　← 上限超過' : ''}`});
  }
  return out;
}

function downloadCsv(filename, rows) {
  const csv = rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function kpi(t, v, sub, cls) {
  return `<div class="kpi ${cls || ''}"><div class="t">${t}</div><div class="v">${v}${sub ? ` <small>${sub}</small>` : ''}</div></div>`;
}
const pendingCount = () => RESV.filter(r => r.status === 'pending').length;

/* =========================================================================
   C-01 / C-02 承認キュー（本システムの中核画面）
   ========================================================================= */
/* C-02 代替可能な空き枠・空き日の候補提示 */
function findAlternatives(r) {
  const out = [];
  for (let k = 1; k <= 14 && out.length < 4; k++) {
    const ds = D(k);
    if (ds === r.date) continue;
    const cap = capacityOf(ds); if (cap.closed) continue;
    const u = usageOf(ds);
    if (r.method === 'drop') {
      const need = Number(r.vCount) || 1, w = declaredWeight(r);
      cap.slots.forEach(s => {
        if (out.length >= 4) return;
        const uu = u.slots[s.id];
        if (uu.trucks + uu.pTrucks + need <= s.trucks && uu.weight + uu.pWeight + w <= s.weight)
          out.push({date:ds, slotId:s.id, label:`${fmtMd(ds)} ${s.label}`,
            rest:`残 着車${s.trucks - uu.trucks - uu.pTrucks}台／${dec(s.weight - uu.weight - uu.pWeight)}t`});
      });
    } else {
      const lim = pickupLimitOf(ds);
      const rest = lim.limit - u.pickup.fixed - u.pickup.pending;
      if (rest > 0) out.push({date:ds, label:fmtMd(ds), rest:`残 ${rest} 件`});
    }
  }
  return out;
}

function viewApprovals() {
  const f = state.approval;
  let list = RESV.filter(r => r.status === 'pending');
  if (f.method !== 'all') list = list.filter(r => r.method === f.method);
  if (f.keyword) {
    const k = f.keyword;
    list = list.filter(r => (r.no + partner(r.emitterId).name + partner(r.applicantId).name + linesText(r)).includes(k));
  }
  list.sort((a,b) => a.date === b.date ? (a.appliedAt < b.appliedAt ? -1 : 1) : (a.date < b.date ? -1 : 1));
  if (!list.find(r => r.no === f.sel)) f.sel = list.length ? list[0].no : null;

  const today = D(0), cap = capacityOf(today), u = usageOf(today), plim = pickupLimitOf(today);
  const tTrucks = cap.slots.reduce((s,x) => s + x.trucks, 0);
  const uTrucks = SLOTS.reduce((s,x) => s + (u.slots[x.id] ? u.slots[x.id].trucks : 0), 0);
  const tW = cap.slots.reduce((s,x) => s + x.weight, 0);
  const uW = SLOTS.reduce((s,x) => s + (u.slots[x.id] ? u.slots[x.id].weight : 0), 0);
  const urgent = list.filter(r => r.date <= D(1)).length;

  const rows = list.map(r => {
    const ck = checksOf(r);
    const ng = ck.filter(c => c.lv === 'ng').length, wa = ck.filter(c => c.lv === 'wa').length;
    return `<tr class="clickable ${r.no === f.sel ? 'sel' : ''}" data-act="selApproval" data-no="${r.no}">
      <td class="mono">${r.no}<div class="text-secondary" style="font-size:11px">${esc(r.appliedAt)}</div></td>
      <td>${mBadge(r.method)}</td>
      <td>${esc(partner(r.emitterId).name)}
        ${r.applicantId !== r.emitterId ? `<div class="text-secondary" style="font-size:11px">代理：${esc(partner(r.applicantId).name)}</div>` : ''}</td>
      <td class="mono">${fmtMd(r.date)}<div class="text-secondary" style="font-size:11px">${esc(resvTime(r))}</div></td>
      <td style="font-size:13px">${esc(linesText(r))}</td>
      <td>${ng ? `<span class="badge b-rejected">要確認 ${ng}</span>` : wa ? `<span class="badge b-pending">注意 ${wa}</span>` : `<span class="badge b-approved">OK</span>`}</td>
    </tr>`;
  }).join('');

  return pageHead('承認キュー',
    '取引先ポータル・代行入力から登録された予約／依頼は、すべてこの画面で承認または変更依頼を行います。自動確定は行いません。',
    ['C-01','C-02','A-06','C-08','C-09','G-01']) +
  specNote('approvals') +
  `<div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">${kpi('承認待ち', pendingCount() + ' <small>件</small>', urgent ? `うち明日まで ${urgent} 件` : '', urgent ? 'alert-kpi' : '')}</div>
    <div class="col-6 col-lg-3">${kpi('本日の着車（承認済）', `${uTrucks} <small>/ ${tTrucks} 台</small>`)}</div>
    <div class="col-6 col-lg-3">${kpi('本日の処理量（申告ベース）', `${dec(uW)} <small>/ ${tW} t</small>`)}</div>
    <div class="col-6 col-lg-3">${kpi('本日の引取', `${u.pickup.fixed} <small>/ ${plim.limit} 件</small>`)}</div>
  </div>

  <div class="filterbar">
    <div class="f"><label>区分</label>
      <select class="form-select form-select-sm" data-act="apFilter" data-key="method">
        ${opts([{v:'all',t:'すべて'},{v:'drop',t:'持込'},{v:'pickup',t:'引取'}], f.method, false)}
      </select></div>
    <div class="f" style="flex:1"><label>キーワード（受付番号・取引先・品目）</label>
      <input type="text" class="form-control form-control-sm" data-act="apFilter" data-key="keyword" value="${esc(f.keyword)}" placeholder="例：R-2026 / サンプル建設 / 汚泥"></div>
    <div class="ms-auto align-self-center text-secondary" style="font-size:13px">
      新着は責任者へ即時通知（G-01・通知チャネルは要確定）</div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-xl-7">
      <div class="table-wrap">
        <table class="table table-hover mb-0">
          <thead><tr><th>受付番号／申請日時</th><th>区分</th><th>排出事業者</th><th>希望日時</th><th>品目・申告数量</th><th>事前チェック</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="text-center text-secondary py-4">承認待ちはありません</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <div class="col-12 col-xl-5">
      <div class="sticky-col">${f.sel ? approvalDetail(resv(f.sel)) : `<div class="empty">左の一覧から案件を選択してください</div>`}</div>
    </div>
  </div>`;
}

function approvalDetail(r) {
  if (!r) return '';
  const ck = checksOf(r), cap = capacityOf(r.date), u = usageOf(r.date);
  const em = partner(r.emitterId), ap = partner(r.applicantId);
  const meters = r.method === 'drop'
    ? (cap.slots.filter(s => s.id === r.slotId).map(s =>
        meter(`着車数（${s.label}）`, u.slots[s.id].trucks, u.slots[s.id].pTrucks, s.trucks, '台') +
        meter(`処理量（${s.label}）`, u.slots[s.id].weight, u.slots[s.id].pWeight, s.weight, 't')).join('') || '<p class="hint">この日の時間帯枠が未設定です</p>')
    : meter('引取件数（日次）', u.pickup.fixed, u.pickup.pending, pickupLimitOf(r.date).limit, '件');
  const itemMeters = (r.lines || []).filter(ln => capacity.itemCaps[ln.itemId] != null).map(ln =>
    meter(`品目別上限：${item(ln.itemId).name}`, u.items[ln.itemId].fixed, u.items[ln.itemId].pending,
          capacity.itemCaps[ln.itemId], item(ln.itemId).unit)).join('');

  const base = [
    ['受付番号', `<span class="mono">${r.no}</span>`],
    ['区分', mBadge(r.method)],
    ['排出事業者', esc(em.name)],
    ['申請者', `${esc(ap.name)}${ap.id !== em.id ? '（運搬業者による代理申請）' : ''}<div class="text-secondary" style="font-size:12px">${esc(r.via)} ／ ${esc(r.appliedAt)}</div>`]
  ];
  const detail = r.method === 'drop'
    ? [['搬入日', fmtJp(r.date)], ['時間帯', esc(slotDef(r.slotId).label)],
       ['車格・台数', `${esc(vehicle(r.vehicleId).name)} × ${r.vCount} 台`],
       ['車両ナンバー', esc(r.plate)],
       ['ドライバー', `${esc(r.driver)}（${esc(r.driverTel)}）`]]
    : [['引取希望日', fmtJp(r.date)], ['希望時間', `${esc(r.startAt)} 〜 ${esc(r.endAt)}`],
       ['引取場所', `${esc(site(r.siteId).name)}<div class="text-secondary" style="font-size:12px">${esc(site(r.siteId).addr)}</div>`],
       ['現場条件', `道幅 ${esc(site(r.siteId).road)} ／ 重機 ${esc(site(r.siteId).machine)} ／ 立会 ${esc(site(r.siteId).attend)}`],
       ['荷姿・容器', esc(container(r.containerId).name || '—')]];
  const lines = `<table class="table table-sm mb-0"><thead><tr><th>品目</th><th class="num">申告数量</th><th>備考</th></tr></thead><tbody>
    ${(r.lines || []).map(ln => `<tr><td>${esc(item(ln.itemId).name)}${item(ln.itemId).valuable ? ' <span class="badge b-neutral b-sq">有価物</span>' : ''}</td>
      <td class="num">${dec(ln.qty)} ${esc(ln.unit)}</td><td style="font-size:13px">${esc(ln.memo || '—')}</td></tr>`).join('')}
  </tbody></table>`;

  return `<div class="card mb-3">
    <div class="card-head">${r.no}　${mBadge(r.method)}　${stBadge(r.status)}</div>
    <div class="card-body">
      ${dl(base.concat(detail))}
      <h6 class="mt-3 mb-2" style="font-size:14px;font-weight:700">申告内容</h6>
      <div class="table-wrap">${lines}</div>
      <h6 class="mt-3 mb-2" style="font-size:14px;font-weight:700">事前チェック</h6>
      <div class="d-flex flex-column gap-2">${ck.map(chkHtml).join('')}</div>
      <h6 class="mt-3 mb-2" style="font-size:14px;font-weight:700">枠の消化状況（${fmtMd(r.date)}）</h6>
      ${meters}${itemMeters}
      <div class="divline"></div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" data-act="openApprove" data-no="${r.no}">承認する</button>
        <button class="btn btn-outline-danger" data-act="openReject" data-no="${r.no}">変更依頼（差戻し）</button>
        <button class="btn btn-outline-secondary ms-auto" data-act="openResvDetail" data-no="${r.no}">全項目を表示</button>
      </div>
    </div>
  </div>`;
}

/* ---------- 承認モーダル ---------- */
var MODALS_APPROVE = payload => {
  const r = resv(payload.no), isDrop = r.method === 'drop';
  const cap = capacityOf(payload.date || r.date);
  const u = usageOf(payload.date || r.date);
  const slotOpts = cap.slots.map(s => {
    const uu = u.slots[s.id];
    return {v:s.id, t:`${s.label}（残 着車${s.trucks - uu.trucks - uu.pTrucks}台／${dec(s.weight - uu.weight - uu.pWeight)}t）`};
  });
  const body = isDrop
    ? `<p class="hint">承認すると予約が確定し、取引先へ通知されます（G-02）。必要に応じて時間帯を調整できます（C-04）。</p>
       <div class="mb-3"><label class="form-label">搬入日</label>
         <input type="date" class="form-control" data-mod="date" value="${payload.date || r.date}"></div>
       <div class="mb-3"><label class="form-label">時間帯<span class="req">必須</span></label>
         <select class="form-select" data-mod="slotId">${opts(slotOpts, payload.slotId || r.slotId, false)}</select></div>
       <div class="mb-3"><label class="form-label">取引先への連絡事項<span class="opt">任意</span></label>
         <textarea class="form-control" rows="2" data-mod="comment" placeholder="例：場内は徐行でお願いします">${esc(payload.comment || '')}</textarea></div>`
    : `<p class="hint">引取依頼の承認では<b>訪問日時の入力が必須</b>です（C-05／A-09）。第1期では車両・ドライバーへの割当編成はシステム外で行います。</p>
       <div class="row g-2 mb-3">
         <div class="col-12 col-sm-5"><label class="form-label">訪問日<span class="req">必須</span></label>
           <input type="date" class="form-control" data-mod="visitDate" value="${payload.visitDate || r.date}"></div>
         <div class="col-6 col-sm-3"><label class="form-label">開始<span class="req">必須</span></label>
           <input type="time" class="form-control" step="1800" data-mod="visitFrom" value="${payload.visitFrom || r.startAt}"></div>
         <div class="col-6 col-sm-3"><label class="form-label">終了<span class="req">必須</span></label>
           <input type="time" class="form-control" step="1800" data-mod="visitTo" value="${payload.visitTo || r.endAt}"></div>
       </div>
       <div class="mb-3"><label class="form-label">集荷手配メモ<span class="opt">任意</span></label>
         <input type="text" class="form-control" data-mod="dispatchNote" value="${esc(payload.dispatchNote || '')}" placeholder="例：4t車・ドライバー中村で手配済（台帳）">
         <div class="form-text">第1期は台帳・電話での手配内容を記録するだけの欄です。配車ボードは第2期。</div></div>
       <div class="mb-0"><label class="form-label">取引先への連絡事項<span class="opt">任意</span></label>
         <textarea class="form-control" rows="2" data-mod="comment">${esc(payload.comment || '')}</textarea></div>`;
  const warn = checksOf(r).filter(c => c.lv !== 'ok');
  return {
    title:`${r.no} を承認`,
    body: (warn.length ? `<div class="d-flex flex-column gap-2 mb-3">${warn.map(chkHtml).join('')}
      <div class="text-secondary" style="font-size:13px">※ 事前チェックに注意がありますが、可否の判断は承認者が行います。</div></div>` : '') + body,
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>
          <button class="btn btn-primary" data-act="doApprove" data-no="${r.no}">この内容で承認する</button>`
  };
};

/* ---------- 変更依頼モーダル ---------- */
var MODALS_REJECT = payload => {

    title:`${r.no} に変更依頼（差戻し）`,

  else rows.push(

};

/* =========================================================================

function viewBoard() {
  const b = state.board, ds = b.date;
  const cap = capacityOf(ds), u = usageOf(ds), plim = pickupLimitOf(ds);
  const all = RESV.filter(r => (r.method === 'drop' ? r.date : (r.visitDate || r.date)) === ds
                            && !['pending','rejected'].includes(r.status));
  const drops = all.filter(r => r.method === 'drop');
  const picks = all.filter(r => r.method === 'pickup')
    .sort((x,y) => (x.visitFrom || x.startAt) < (y.visitFrom || y.startAt) ? -1 : 1);

  const dropRow = r => `<tr>
    <td class="mono">${r.no}</td>
    <td>${esc(partner(r.emitterId).name)}${r.applicantId !== r.emitterId ? `<div class="text-secondary" style="font-size:11px">運搬：${esc(partner(r.applicantId).name)}</div>` : ''}</td>

  const dropBlocks = cap.closed
    ? `<div class="empty">${fmtJp(ds)} は受付停止（${esc(cap.reason)}）</div>`

        </div>`;
      }).join('');

  const pickBlock = `<div class="card mb-3">
    <div class="card-head">引取（集荷）
      <span class="sub">${u.pickup.fixed}/${plim.limit} 件${plim.override ? `　<span class="badge b-pending b-sq">上書き：${esc(plim.reason)}</span>` : ''}</span></div>
    ${picks.length ? `<table class="table table-hover mb-0">
      <thead><tr><th>受付番号</th><th>訪問日時</th><th>排出事業者・現場</th><th>品目・想定数量</th><th>現場条件</th><th>集荷手配メモ</th><th>ステータス</th><th></th></tr></thead>

const blankLine = () => ({itemId:'', qty:'', unit:'', memo:''});
const blankProxy = () => ({
  applicantId:'', emitterId:'', method:'', date:'', slotId:'',
  startAt:'', endAt:'', siteId:'', containerId:'',
  lines:[blankLine()],
  vehicleId:'', vCount:'1', driver:'', driverTel:'', plate:'',
  memo:'', errors:[]
});
function nextResvNo() {
  const n = RESV.map(r => Number(r.no.slice(-4))).reduce((a,b) => Math.max(a,b), 0);
  return 'R-2026-' + pad(n + 1);
}
/* 申請者が代理できる排出事業者 */
function emitterOptionsFor(applicantId) {
  const ap = partner(applicantId);
  if (!ap.id) return [];
  const out = [];
  if (ap.type === 'emitter' || ap.type === 'both') out.push({v:ap.id, t:ap.name + '（自社排出）'});
  RELATIONS.filter(r => r.carrierId === applicantId && r.proxy && r.emitterId !== applicantId)
    .forEach(r => out.push({v:r.emitterId, t:partner(r.emitterId).name + '（受託）'}));
  return out;
}

  specNote('proxy') + err +
  `<div class="row g-3"><div class="col-12 col-xl-8">

      <div class="row g-3">

          <select class="form-select" data-px="applicantId">${opts(PARTNERS.map(p => ({v:p.id, t:`${p.name}（${{emitter:'排出事業者', carrier:'運搬業者', both:'排出／運搬'}[p.type]}）`})), d.applicantId)}</select></div>
        <div class="col-12 col-md-6"><label class="form-label">排出事業者<span class="req">必須</span></label>
          <select class="form-select" data-px="emitterId">${opts(emOpts, d.emitterId, d.applicantId ? '選択してください' : '先に申請者を選択')}</select>
          <div class="form-text">運搬業者が代理で予約できる範囲は取引関係マスタ（E-03）で定義します。</div></div>
      </div>
      <div class="mt-3"><span class="form-label d-block">受入方法<span class="req">必須</span></span>
        <div class="btn-group" role="group">
          ${[['pickup','引取（当社が集荷に行く）'],['drop','持込（取引先が搬入）']].map(([v,t]) =>
            `<button type="button" class="btn ${d.method === v ? 'btn-primary' : 'btn-outline-secondary'}" data-act="pxMethod" data-v="${v}">${t}</button>`).join('')}

        : `<div class="row g-2" style="max-width:420px">

/* 入力途中の内容で契約・許可・枠を確認する */
function proxyPreview(d) {
  if (!d.emitterId || !d.date || !d.method) return '<p class="hint mb-0">申請者・排出事業者・日付・受入方法を入力すると、契約／許可／枠の状況を表示します。</p>';
  const tmp = {
    no:'（新規）', method:d.method, status:'pending',
    emitterId:d.emitterId, applicantId:d.applicantId, date:d.date,
    slotId:d.slotId, startAt:d.startAt, endAt:d.endAt, siteId:d.siteId,
    lines:d.lines.filter(l => l.itemId && l.qty), vCount:Number(d.vCount) || 1, vehicleId:d.vehicleId
  };
  return `<div class="d-flex flex-column gap-2">${checksOf(tmp).map(chkHtml).join('')}</div>
    <div class="form-text mt-2">超過・未締結でも登録は可能です。可否の確定判断は承認者が行います。</div>`;
}

function pxValidate() {
  const d = state.proxy, e = [];
  if (!d.applicantId) e.push('申請者を選択してください。');
  if (!d.emitterId) e.push('排出事業者を選択してください。');
  if (!d.method) e.push('受入方法を選択してください。');
  if (!d.date) e.push('日付を入力してください。');
  if (d.method === 'drop') {
    if (!d.slotId) e.push('時間帯を選択してください。');
    if (!d.vehicleId) e.push('車格を選択してください。');
    if (!/^\d+$/.test(String(d.vCount).trim())) e.push('台数は半角数字で入力してください。');
    if (!d.driver.trim()) e.push('ドライバー名を入力してください。');
    if (!d.driverTel.trim()) e.push('ドライバー連絡先を入力してください。');
    if (!d.plate.trim()) e.push('車両ナンバーを入力してください。');
  } else if (d.method === 'pickup') {
    if (!d.startAt) e.push('引取希望時間の開始を入力してください。');
    if (!d.endAt) e.push('引取希望時間の終了を入力してください。');
    if (d.startAt && d.endAt && d.endAt <= d.startAt) e.push('終了時間は開始時間より後にしてください。');
    if (!d.siteId) e.push('排出現場を選択してください。');
  }
  d.lines.forEach((ln,i) => {
    const n = `品目 ${i+1}：`;
    if (!ln.itemId) e.push(n + '品目を選択してください。');
    if (!String(ln.qty).trim()) e.push(n + '申告数量を入力してください。');
    else if (isNaN(Number(ln.qty))) e.push(n + '申告数量は数字で入力してください。');
    if (!ln.unit) e.push(n + '単位を選択してください。');
  });
  d.errors = e;
  return e.length === 0;
}
function pxSubmit() {
  if (!pxValidate()) { render(); return; }
  const d = state.proxy, now = new Date();
  const r = {
    no: nextResvNo(), method:d.method, status:'pending',
    emitterId:d.emitterId, applicantId:d.applicantId, date:d.date,
    lines: d.lines.map(l => ({itemId:l.itemId, qty:Number(l.qty), unit:l.unit, memo:l.memo})),
    appliedAt: `${D(0)} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    via:'電話（営業 代行入力）', memo:d.memo
  };
  if (d.method === 'drop') Object.assign(r, {slotId:d.slotId, vehicleId:d.vehicleId,
    vCount:Number(d.vCount), driver:d.driver, driverTel:d.driverTel, plate:d.plate});
  else Object.assign(r, {startAt:d.startAt, endAt:d.endAt, siteId:d.siteId, containerId:d.containerId});
  RESV.unshift(r);
  audit('代行入力', r.no, `${methodLabel(r.method)}／${partner(r.emitterId).name}／${fmtMd(r.date)}`);
  state.proxy = blankProxy();
  state.route = 'approvals';
  state.approval.sel = r.no;
  toast(`${r.no} を登録しました。承認キューに追加されています。`);
  render();
}

function monthDays(ym) {
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= last.getDate(); d++) cells.push(dstr(new Date(y, m-1, d)));
  while (cells.length % 7) cells.push(null);
  return cells;
}
const shiftMonth = (ym, n) => {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
};
const monthLabel = ym => `${ym.split('-')[0]}年${Number(ym.split('-')[1])}月`;

function capCalendar() {
  const ym = state.capacity.month, cells = monthDays(ym);

    const cap = capacityOf(ds), u = usageOf(ds);
    const d = parseD(ds);
    if (cap.closed) return `<button class="day off" data-act="openDayCap" data-date="${ds}">
      <div class="d">${d.getDate()}</div><div class="m">休業<br>${esc(cap.reason)}</div></button>`;
    const tCap = cap.slots.reduce((s,x) => s + x.trucks, 0);
    const tUse = cap.slots.reduce((s,x) => s + u.slots[x.id].trucks + u.slots[x.id].pTrucks, 0);
    const wCap = cap.slots.reduce((s,x) => s + x.weight, 0);
    const wUse = cap.slots.reduce((s,x) => s + u.slots[x.id].weight + u.slots[x.id].pWeight, 0);
    const rate = tCap ? tUse / tCap : 0;
    const cls = [rate >= 1 ? 'full' : rate >= 0.8 ? 'tight' : '', ds === D(0) ? 'today' : ''].join(' ');
    return `<button class="day ${cls}" data-act="openDayCap" data-date="${ds}">
      <div class="d">${d.getDate()}</div>
      <div class="m">着車 ${tUse}/${tCap}<br>量 ${dec(wUse)}/${wCap}t</div>

  <div class="filterbar">

      <input type="text" class="form-control" data-act="recQ" value="${esc(state.reception.q)}" placeholder="例：R-2026-0165 / 大宮 100 き 11-22" autocomplete="off"></div>
    <div class="align-self-center text-secondary" style="font-size:13px">本日：${fmtJp(D(0))}</div>
  </div>
  <div class="table-wrap">
    <table class="table table-hover mb-0">
      <thead><tr><th>受付番号</th><th>区分</th><th>時間</th><th>取引先</th><th>申告内容</th><th>車番</th><th>状態</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="8" class="text-center text-secondary py-4">該当する予約がありません</td></tr>`}</tbody>
    </table>
  </div>`;
}

/* ---------- 計量モーダル（D-02〜D-04） ---------- */
function weighInit(no) {
  const r = resv(no);
  return {
    no, gross:'', tare:'',
    lines: r.lines.map(ln => ({itemId:ln.itemId, declared:toStd(ln.qty, ln.unit, ln.itemId), qty:dec(toStd(ln.qty, ln.unit, ln.itemId))})),
    diffReason:'', extras:[], multi:false,
    alloc: r.method === 'pickup' ? [{siteId:r.siteId, qty:''}, {siteId:'', qty:''}] : []
  };
}
var MODALS_WEIGH = p => {
  const r = resv(p.no);
  const net = (Number(p.gross) - Number(p.tare)) / 1000;
  const netOk = p.gross && p.tare && net > 0;
  const sumW = p.lines.reduce((s,l) => s + (item(l.itemId).unit === 't' ? Number(l.qty) || 0 : 0), 0);
  const gap = netOk ? net - sumW : 0;
  const hasDiff = p.lines.some(l => Math.abs((Number(l.qty) || 0) - l.declared) / Math.max(l.declared, 0.01) > 0.1);

  const lineRows = p.lines.map((l,i) => {
    const it = item(l.itemId);
    const d = (Number(l.qty) || 0) - l.declared;
    return `<tr>
      <td><select class="form-select form-select-sm" data-mod="lines.${i}.itemId" data-rerender="1">${opts(o1(ITEMS), l.itemId, false)}</select></td>
      <td class="num">${dec(l.declared)} ${it.unit}</td>
      <td class="num"><input type="text" inputmode="decimal" class="form-control form-control-sm text-end" style="width:96px" data-mod="lines.${i}.qty" data-rerender="1" value="${esc(l.qty)}"></td>
      <td class="num">${it.unit}</td>
      <td class="num ${Math.abs(d) > 0.001 ? 'text-danger fw-bold' : ''}">${d > 0 ? '+' : ''}${dec(d)}</td>
      <td>${p.lines.length > 1 ? `<button class="btn btn-outline-danger btn-sm" data-act="weighRemoveLine" data-idx="${i}">削除</button>` : ''}</td>
    </tr>`;
  }).join('');

  const allocBlock = r.method === 'pickup' ? `
    <div class="form-check form-switch mb-2">
      <input class="form-check-input" type="checkbox" data-mod="multi" data-rerender="1" ${p.multi ? 'checked' : ''}>
      <label class="form-check-label">1運行で複数現場を回った（現場別に按分する・D-03）</label></div>
    ${p.multi ? `<div class="table-wrap mb-2"><table class="table table-sm mb-0">
      <thead><tr><th>排出現場</th><th class="num">数量(t)</th><th></th></tr></thead>
      <tbody>${p.alloc.map((a,i) => `<tr>
        <td><select class="form-select form-select-sm" data-mod="alloc.${i}.siteId" data-rerender="1">${opts(SITES.map(s => ({v:s.id, t:`${partner(s.partnerId).name}／${s.name}`})), a.siteId)}</select></td>
        <td class="num"><input type="text" inputmode="decimal" class="form-control form-control-sm text-end" style="width:96px" data-mod="alloc.${i}.qty" data-rerender="1" value="${esc(a.qty)}"></td>
        <td>${p.alloc.length > 2 ? `<button class="btn btn-outline-danger btn-sm" data-act="weighRemoveAlloc" data-idx="${i}">削除</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <button class="btn btn-outline-primary btn-sm mb-2" data-act="weighAddAlloc">＋ 現場を追加</button>
      <div class="${Math.abs(p.alloc.reduce((s,a) => s + (Number(a.qty)||0), 0) - sumW) < 0.01 ? 'text-secondary' : 'text-danger fw-bold'}" style="font-size:13px">
        按分合計 ${dec(p.alloc.reduce((s,a) => s + (Number(a.qty)||0), 0))} t ／ 実数量合計 ${dec(sumW)} t</div>` : ''}` : '';

  return {
    title:`計量入力　${r.no}　${esc(partner(r.emitterId).name)}`,
    body:`<div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><label class="form-label">総重量（kg）<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="gross" data-rerender="1" value="${esc(p.gross)}" placeholder="例：6120"></div>
        <div class="col-6 col-md-3"><label class="form-label">空車重量（kg）<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="tare" data-rerender="1" value="${esc(p.tare)}" placeholder="例：2480"></div>
        <div class="col-12 col-md-6">${kpi('正味重量（自動算出）', netOk ? dec(net) + ' <small>t</small>' : '<small class="text-secondary">総重量・空車重量を入力</small>')}</div>
      </div>
      <h6 style="font-size:14px;font-weight:700">実搬入内容（申告との差異を記録します・D-04）</h6>
      <div class="table-wrap mb-2"><table class="table table-sm mb-0">
        <thead><tr><th style="width:34%">品目</th><th class="num">申告</th><th class="num">実数量</th><th class="num">単位</th><th class="num">差異</th><th></th></tr></thead>
        <tbody>${lineRows}</tbody></table></div>
      <button class="btn btn-outline-primary btn-sm mb-3" data-act="weighAddLine">＋ 品目を追加</button>
      ${netOk && Math.abs(gap) > 0.05 ? `<div class="chk wa mb-3"><span class="m">⚠ 差異</span><span>重量計上品目の実数量合計（${dec(sumW)} t）と正味重量（${dec(net)} t）が ${dec(Math.abs(gap))} t ずれています。体積計上品目がある場合は正常です。</span></div>` : ''}
      ${hasDiff ? `<div class="mb-3"><label class="form-label">差異理由<span class="req">必須</span></label>
        <select class="form-select" data-mod="diffReason">${opts([
          {v:'実測差（申告は目安）',t:'実測差（申告は目安）'},{v:'品目の相違',t:'品目の相違'},
          {v:'追加発生分あり',t:'追加発生分あり'},{v:'異物混入',t:'異物混入'},{v:'その他',t:'その他'}], p.diffReason)}</select>
        ${p.err2 ? `<div class="text-danger mt-1" style="font-size:13px">${esc(p.err2)}</div>` : ''}</div>` : ''}
      ${allocBlock}
      <div class="mb-2"><label class="form-label">追加料金（F-03）<span class="opt">任意</span></label>
        <div class="d-flex gap-3 flex-wrap">${EXTRA_CHARGES.map(x => `
          <div class="form-check"><input class="form-check-input" type="checkbox" data-mod="extra.${x.id}" ${p.extras.find(e => e.id === x.id) ? 'checked' : ''}>
            <label class="form-check-label" style="font-size:14px">${esc(x.name)}（${yen(x.price)}／${x.type}）</label></div>`).join('')}</div></div>
      ${p.err ? `<div class="text-danger" style="font-size:13px">${esc(p.err)}</div>` : ''}
      <div class="form-text">確定すると契約単価が適用され、売上明細が自動生成されます（F-01）。適用単価は明細にスナップショットとして保存されます。</div>`,
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>
          <button class="btn btn-primary" data-act="doWeigh" data-no="${r.no}">実績を確定して売上明細を作成</button>`
  };
};

/* ---------- 飛び込み搬入（C-07） ---------- */
var MODALS_SPOT = p => {
  const siteOpts = SITES.filter(s => s.partnerId === p.partnerId).map(s => ({v:s.id, t:s.name}));
  const net = (Number(p.gross) - Number(p.tare)) / 1000;
  return {
    title:'飛び込み搬入の登録',
    body:`<p class="hint">予約を伴わない搬入を、実績として直接登録します。契約・単価が未登録の場合は金額未確定の明細になります。</p>
      <div class="row g-3">
        <div class="col-12 col-md-6"><label class="form-label">取引先<span class="req">必須</span></label>
          <select class="form-select" data-mod="partnerId" data-rerender="1">${opts(o1(PARTNERS), p.partnerId)}</select></div>
        <div class="col-12 col-md-6"><label class="form-label">排出現場<span class="opt">任意</span></label>
          <select class="form-select" data-mod="siteId">${opts(siteOpts, p.siteId, '（指定なし）')}</select></div>
        <div class="col-12 col-md-6"><label class="form-label">品目<span class="req">必須</span></label>
          <select class="form-select" data-mod="itemId" data-rerender="1">${opts(o1(ITEMS), p.itemId)}</select></div>
        <div class="col-6 col-md-3"><label class="form-label">車格</label>
          <select class="form-select" data-mod="vehicleId">${opts(o1(VEHICLES), p.vehicleId)}</select></div>
        <div class="col-6 col-md-3"><label class="form-label">車両ナンバー</label>
          <input type="text" class="form-control" data-mod="plate" value="${esc(p.plate || '')}"></div>
        <div class="col-6 col-md-3"><label class="form-label">総重量(kg)<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="gross" data-rerender="1" value="${esc(p.gross || '')}"></div>
        <div class="col-6 col-md-3"><label class="form-label">空車重量(kg)<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="tare" data-rerender="1" value="${esc(p.tare || '')}"></div>
        <div class="col-12 col-md-6">${kpi('正味重量', p.gross && p.tare ? dec(net) + ' <small>t</small>' : '—')}</div>
      </div>
      ${p.itemId && item(p.itemId).unit === 'm3' ? `<div class="mt-3" style="max-width:220px"><label class="form-label">体積(m3)<span class="req">必須</span></label>
        <input type="text" inputmode="decimal" class="form-control" data-mod="vol" value="${esc(p.vol || '')}"></div>` : ''}
      ${p.err ? `<div class="text-danger mt-2" style="font-size:13px">${esc(p.err)}</div>` : ''}`,
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>
          <button class="btn btn-primary" data-act="doSpot">実績として登録</button>`
  };
};

/* ---------- 受入拒否・集荷不可（D-05） ---------- */
var MODALS_REJECT2 = p => {
  const r = resv(p.no);
  return {
    title:`${r.no} の${r.method === 'drop' ? '受入拒否' : '集荷不可'}を記録`,
    body:`<p class="hint">当日の受入拒否・集荷不可を記録します。枠は解放され、取引先へ通知されます。</p>
      <div class="mb-0"><label class="form-label">理由<span class="req">必須</span></label>
        <select class="form-select" data-mod="reason">${opts(
          (r.method === 'drop'
            ? ['異物混入のため受入不可','契約外品目のため受入不可','車両・書類不備','その他']
            : ['現場都合により集荷不可','荷量が想定を大きく超過','進入不可（道幅・駐車）','その他']
          ).map(x => ({v:x,t:x})), p.reason)}</select>
        ${p.err ? `<div class="text-danger mt-1" style="font-size:13px">${esc(p.err)}</div>` : ''}</div>`,
    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">やめる</button>
          <button class="btn btn-outline-danger" data-act="doReject2" data-no="${r.no}">記録する</button>`
  };
};

/* =========================================================================
   D-06 実績一覧 ／ F-01〜F-06 締め処理・売上一覧
   ========================================================================= */
const salesOf = actualId => SALES.filter(s => s.actualId === actualId);
const amountOf = actualId => salesOf(actualId).reduce((s,x) => s + x.amount, 0);
const isClosed = ym => CLOSINGS.some(c => c.ym === ym);

function filteredActuals() {
  const f = state.actuals;
  return ACTUALS.filter(a =>
    a.date >= f.from && a.date <= f.to &&
    (!f.partnerId || a.partnerId === f.partnerId) &&
    (!f.itemId || a.itemId === f.itemId) &&
    (!f.method || a.method === f.method) &&
    (!f.diffOnly || (a.diffReason && a.diffReason !== ''))
  ).sort((x,y) => x.date === y.date ? (x.id < y.id ? 1 : -1) : (x.date < y.date ? 1 : -1));
}

function viewActuals() {
  const f = state.actuals, list = filteredActuals();
  const netT = list.filter(a => a.unit === 't').reduce((s,a) => s + a.net, 0);
  const sales = list.reduce((s,a) => s + salesOf(a.id).filter(x => x.kind === 'sales').reduce((t,x) => t + x.amount, 0), 0);
  const buy   = list.reduce((s,a) => s + salesOf(a.id).filter(x => x.kind === 'purchase').reduce((t,x) => t + x.amount, 0), 0);

  const rows = list.slice(0, 200).map(a => {
    const d = a.net - a.declared;
    return `<tr class="clickable" data-act="openActual" data-id="${a.id}">
      <td class="mono">${a.id}</td>
      <td class="mono">${fmtMd(a.date)}</td>
      <td class="mono">${esc(a.resvNo || '—')}${a.spot ? ' <span class="badge b-neutral b-sq">飛込</span>' : ''}</td>
      <td>${mBadge(a.method)}</td>
      <td>${esc(partner(a.partnerId).name)}<div class="text-secondary" style="font-size:11px">${esc(site(a.siteId).name || '—')}</div></td>
      <td>${esc(item(a.itemId).name)}</td>
      <td class="num">${dec(a.declared)}</td>
      <td class="num fw-bold">${dec(a.net)} ${a.unit}</td>
      <td class="num ${Math.abs(d) > 0.001 ? 'text-danger' : ''}">${d > 0 ? '+' : ''}${dec(d)}
        ${a.diffReason ? `<div class="text-secondary" style="font-size:11px">${esc(a.diffReason)}</div>` : ''}</td>
      <td class="num">${yen(amountOf(a.id))}</td>
      <td>${a.status === 'closed' ? '<span class="badge b-neutral">締め済</span>' : '<span class="badge b-approved">確定</span>'}</td>
    </tr>`;
  }).join('');

  return pageHead('実績一覧',
    '計量実績を検索・確認します。予約との差異、現場別按分、売上金額をここで突き合わせます。',
    ['D-06','D-04','D-03'],
    `<button class="btn btn-outline-primary btn-sm" data-act="exportActuals">CSV出力</button>`) +
  specNote('actuals') +
  `<div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">${kpi('実績件数', list.length + ' <small>件</small>')}</div>
    <div class="col-6 col-lg-3">${kpi('正味重量合計', dec(netT) + ' <small>t</small>')}</div>
    <div class="col-6 col-lg-3">${kpi('売上（税抜）', yen(sales))}</div>
    <div class="col-6 col-lg-3">${kpi('仕入（有価物）', yen(buy))}</div>
  </div>
  <div class="filterbar">
    <div class="f"><label>開始日</label><input type="date" class="form-control form-control-sm" data-act="acFilter" data-key="from" value="${f.from}"></div>
    <div class="f"><label>終了日</label><input type="date" class="form-control form-control-sm" data-act="acFilter" data-key="to" value="${f.to}"></div>
    <div class="f"><label>取引先</label><select class="form-select form-select-sm" data-act="acFilter" data-key="partnerId">${opts(o1(PARTNERS), f.partnerId, 'すべて')}</select></div>
    <div class="f"><label>品目</label><select class="form-select form-select-sm" data-act="acFilter" data-key="itemId">${opts(o1(ITEMS), f.itemId, 'すべて')}</select></div>
    <div class="f"><label>区分</label><select class="form-select form-select-sm" data-act="acFilter" data-key="method">${opts([{v:'drop',t:'持込'},{v:'pickup',t:'引取'}], f.method, 'すべて')}</select></div>
    <div class="f align-self-end"><div class="form-check"><input class="form-check-input" type="checkbox" data-act="acFilter" data-key="diffOnly" ${f.diffOnly ? 'checked' : ''}>
      <label class="form-check-label" style="font-size:13px">差異のある実績のみ</label></div></div>
  </div>
  <div class="table-wrap">
    <table class="table table-hover mb-0">
      <thead><tr><th>実績番号</th><th>日付</th><th>受付番号</th><th>区分</th><th>取引先・現場</th><th>品目</th>
        <th class="num">申告</th><th class="num">実数量</th><th class="num">差異</th><th class="num">金額</th><th>状態</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="11" class="text-center text-secondary py-4">該当する実績がありません</td></tr>`}</tbody>
    </table>
  </div>
  ${list.length > 200 ? `<p class="hint mt-2">先頭200件を表示しています（全 ${list.length} 件）。CSV出力には全件が含まれます。</p>` : ''}`;
}

/* ---------- 実績詳細 ---------- */
var MODALS_ACTUAL = p => {
  const a = ACTUALS.find(x => x.id === p.id);
  const ss = salesOf(a.id);
  const rows = [
    ['実績番号', `<span class="mono">${a.id}</span>`],
    ['日付', fmtJp(a.date)],
    ['受付番号', a.resvNo ? `<span class="mono">${esc(a.resvNo)}</span>` : '飛び込み搬入（予約なし）'],
    ['区分', methodLabel(a.method)],
    ['取引先', esc(partner(a.partnerId).name)],
    ['排出現場', esc(site(a.siteId).name || '—')],
    ['品目', esc(item(a.itemId).name) + (item(a.itemId).valuable ? ' <span class="badge b-neutral b-sq">有価物</span>' : '')],
    ['申告数量', `${dec(a.declared)} ${a.unit}`],
    ['計量', a.gross ? `総重量 ${num(a.gross)} kg − 空車重量 ${num(a.tare)} kg` : '—'],

  ];

  return {
    title:`実績詳細 ${a.id}`,
    body: dl(rows) + `<h6 class="mt-3 mb-2" style="font-size:14px;font-weight:700">売上明細（F-01）</h6>
      <div class="table-wrap"><table class="table table-sm mb-0">
        <thead><tr><th>明細番号</th><th>区分</th><th>内容</th><th class="num">数量</th><th class="num">単価</th><th class="num">金額</th></tr></thead>
        <tbody>${ss.map(s => `<tr class="${s.red ? 'dim' : ''}">
          <td class="mono">${esc(s.no)}</td>
          <td>${s.kind === 'purchase' ? '<span class="badge b-neutral">仕入</span>' : '<span class="badge b-method">売上</span>'}</td>
          <td>${esc(s.category)}${s.minApplied ? ' <span class="badge b-pending b-sq">最低料金</span>' : ''}${s.red ? ' <span class="badge b-rejected b-sq">赤伝</span>' : ''}
            ${s.warn ? `<div class="text-danger" style="font-size:11px">${esc(s.warn)}</div>` : ''}</td>
          <td class="num">${dec(s.qty)} ${esc(s.unit)}</td>
          <td class="num">${s.unitPrice == null ? '—' : yen(s.unitPrice)}</td>
          <td class="num fw-bold">${yen(s.amount)}</td></tr>`).join('')}
        </tbody></table></div>
      ${a.status === 'closed' ? `<div class="chk wa mt-3"><span class="m">⚠ 締め済</span>
        <span>締め後の実績は編集できません。修正は赤伝（マイナス明細）で行います（F-05）。</span></div>` : ''}`,
    foot:`${a.status === 'closed' && !ss.some(s => s.red) ? `<button class="btn btn-outline-danger me-auto" data-act="doRed" data-id="${a.id}">赤伝を起票</button>` : ''}
      <button class="btn btn-outline-secondary" data-act="closeModal">閉じる</button>`
  };
};

/* =========================================================================
   締め処理・売上一覧
   ========================================================================= */
const CSV_TEMPLATES = [
  {id:'generic', name:'汎用フォーマット'},
  {id:'acctA',   name:'会計ソフトA 仕訳インポート'},
  {id:'acctB',   name:'会計ソフトB 売上補助'}
];
function viewClosing() {
  const ym = state.closing.ym;
  const lines = SALES.filter(s => ymOf(s.date) === ym);
  const closed = isClosed(ym);
  const cl = CLOSINGS.find(c => c.ym === ym);
  const sales = lines.filter(s => s.kind === 'sales').reduce((t,s) => t + s.amount, 0);
  const buy   = lines.filter(s => s.kind === 'purchase').reduce((t,s) => t + s.amount, 0);
  const notFixed = RESV.filter(r => ymOf(r.date) === ym && ['approved','arrived'].includes(r.status)).length;
  const warnLines = lines.filter(s => s.warn).length;

  const byPartner = {};
  lines.forEach(s => {

            ${s.kind === 'purchase' ? ' <span class="badge b-neutral b-sq">仕入</span>' : ''}
            ${s.red ? ' <span class="badge b-rejected b-sq">赤伝</span>' : ''}</td>
          <td class="num">${dec(s.qty)} ${esc(s.unit)}</td>
          <td class="num">${s.unitPrice == null ? '—' : yen(s.unitPrice)}</td>
          <td class="num">${yen(s.amount)}</td></tr>`).join('')}</tbody></table></div></td></tr>` : '';
    return `<tr class="clickable" data-act="expandPartner" data-pid="${pid}">
      <td>${open ? '▾' : '▸'} ${esc(partner(pid).name)}</td>

  t[ks[ks.length-1]] = v;
}

function cellText(col, row) {
  const v = getPath(row, col.k);
  if (col.type === 'bool') return v ? '<span class="badge b-approved b-sq">✓</span>' : '<span class="text-secondary">—</span>';
  if (col.fmt) return v == null || v === '' ? '<span class="text-secondary">—</span>' : col.fmt(v);
  if (col.type === 'select' && col.opts) {
    const o = col.opts().find(x => String(x.v) === String(v));
    return o ? esc(o.t) : (v ? esc(v) : '<span class="text-secondary">—</span>');
  }
  return v == null || v === '' ? '<span class="text-secondary">—</span>' : esc(v);
}
