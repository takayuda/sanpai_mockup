<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>産廃DX モック（第1期）｜処理業者 管理画面＋排出者ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* =========================================================================
   デザイントークン（排出元ポータル ワイヤーフレームと共通）
   ========================================================================= */
:root{
  --blue-900:#000B5F; --blue-800:#0017C1; --blue-100:#E8F1FE;
  --ink:#1A1A1C; --ink-sub:#626264;
  --line:#D8D8DB; --line-strong:#767676;
  --bg:#F2F2F2; --white:#FFFFFF;
  --error:#CE0000; --error-bg:#FDEEEE;
  --success:#197A4B; --success-bg:#E6F5EC;
  --warn:#B75200; --warn-bg:#FDF3E6;
  --radius:8px;
  --sidebar-w:236px; --topbar-h:60px;

  /* Bootstrap 5 のトークンを上書きして既存モックの配色に合わせる */
  --bs-primary:#0017C1; --bs-primary-rgb:0,23,193;
  --bs-body-font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --bs-body-font-size:16px; --bs-body-line-height:1.7;
  --bs-body-color:#1A1A1C; --bs-body-color-rgb:26,26,28;
  --bs-body-bg:#F2F2F2;
  --bs-border-color:#D8D8DB;
  --bs-border-radius:8px; --bs-border-radius-sm:6px; --bs-border-radius-lg:8px;
  --bs-link-color:#0017C1; --bs-link-hover-color:#000B5F;
  --bs-link-color-rgb:0,23,193;
  --bs-emphasis-color:#1A1A1C;
  --bs-secondary-color:#626264;
}
body{-webkit-font-smoothing:antialiased;}
:focus-visible{outline:3px solid #FFD43D;outline-offset:0;box-shadow:0 0 0 5px var(--ink);border-radius:2px;}
.ic{vertical-align:-.18em;flex:none;}

/* ボタン */
.btn{font-weight:700;}
.btn-primary{--bs-btn-bg:var(--blue-800);--bs-btn-border-color:var(--blue-800);--bs-btn-hover-bg:var(--blue-900);--bs-btn-hover-border-color:var(--blue-900);--bs-btn-active-bg:var(--blue-900);--bs-btn-active-border-color:var(--blue-900);--bs-btn-disabled-bg:#9A9A9C;--bs-btn-disabled-border-color:#9A9A9C;}
.btn-outline-primary{--bs-btn-color:var(--blue-800);--bs-btn-border-color:var(--blue-800);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--blue-100);--bs-btn-hover-color:var(--blue-900);--bs-btn-hover-border-color:var(--blue-800);--bs-btn-active-bg:var(--blue-100);--bs-btn-active-color:var(--blue-900);--bs-btn-active-border-color:var(--blue-800);}
.btn-outline-danger{--bs-btn-color:var(--error);--bs-btn-border-color:var(--error);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--error-bg);--bs-btn-hover-color:var(--error);--bs-btn-hover-border-color:var(--error);--bs-btn-active-bg:var(--error-bg);--bs-btn-active-color:var(--error);--bs-btn-active-border-color:var(--error);}
.btn-outline-secondary{--bs-btn-color:var(--ink);--bs-btn-border-color:var(--line-strong);--bs-btn-bg:var(--white);--bs-btn-hover-bg:var(--bg);--bs-btn-hover-color:var(--ink);--bs-btn-hover-border-color:var(--line-strong);--bs-btn-active-bg:var(--bg);--bs-btn-active-color:var(--ink);--bs-btn-active-border-color:var(--line-strong);}
.btn .ic{margin-right:5px;}
.btn-icon .ic{margin-right:0;}

/* フォーム */
.form-control,.form-select{border-color:var(--line-strong);}
.form-control:focus,.form-select:focus{border-color:var(--blue-800);box-shadow:0 0 0 .2rem rgba(0,23,193,.15);}
.form-label{font-weight:700;font-size:15px;margin-bottom:6px;}
.form-text{color:var(--ink-sub);}
.req{font-size:12px;font-weight:700;color:var(--error);border:1px solid var(--error);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}
.opt{font-size:12px;font-weight:500;color:var(--ink-sub);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}

/* レイアウト */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;z-index:1030;}
.topbar .brand{font-weight:700;font-size:16px;white-space:nowrap;line-height:1.25;}
.topbar .brand span{display:block;font-size:11px;font-weight:400;color:var(--ink-sub);}
.topbar .who{font-size:13px;color:var(--ink-sub);white-space:nowrap;}
.mockbtn{position:relative;}
.mockbtn::after{content:"MOCK";position:absolute;top:-8px;right:-10px;background:var(--warn);color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:0 4px;letter-spacing:.04em;}
.sidebar{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 40px;z-index:1020;}
.sidebar .navsec{font-size:11px;font-weight:700;color:var(--ink-sub);letter-spacing:.06em;padding:14px 18px 5px;}
.sidebar a.navitem{display:flex;align-items:center;gap:9px;padding:9px 18px 9px 15px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent;}
.sidebar a.navitem:hover{background:var(--blue-100);}
.sidebar a.navitem.active{background:var(--blue-100);border-left-color:var(--blue-800);color:var(--blue-800);font-weight:700;}
.sidebar .navitem .ico{width:18px;height:18px;display:grid;place-items:center;color:var(--ink-sub);flex:none;}
.sidebar a.navitem.active .ico{color:var(--blue-800);}
.sidebar .navitem .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--error);color:#fff;border-radius:99px;padding:1px 8px;}
.content{margin-left:var(--sidebar-w);padding:22px 26px 80px;padding-top:calc(var(--topbar-h) + 22px);}
.page-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.page-h h1{font-size:23px;font-weight:700;margin:0;}

/* カード・パネル */
.card{border-color:var(--line);border-radius:var(--radius);overflow-x:auto;}
.card-head{background:#FAFAFA;border-bottom:1px solid var(--line);padding:10px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.card-head .sub{font-weight:400;font-size:13px;color:var(--ink-sub);}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;height:100%;}
.kpi .t{font-size:12px;color:var(--ink-sub);font-weight:500;margin-bottom:2px;}
.kpi .v{font-size:25px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-sub);}
.kpi.alert-kpi{border-color:var(--error);background:var(--error-bg);}
.kpi.alert-kpi .v{color:var(--error);}

/* テーブル */
.table{--bs-table-bg:var(--white);font-size:14px;border-color:var(--line);margin-bottom:0;}
.table thead th{background:#FAFAFA;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle;}
.table td,.table th{padding:10px 12px;vertical-align:middle;}
.table td.num,.table th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;background:var(--white);}
.table tbody tr.clickable{cursor:pointer;}
.table tbody tr.clickable:hover{background:var(--blue-100);}
.table tbody tr.sel{background:var(--blue-100);box-shadow:inset 3px 0 0 var(--blue-800);}
.table tbody tr.dim td{color:var(--ink-sub);background:#FBFBFB;}

/* バッジ */
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px;border:1px solid transparent;}
.b-pending{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
.b-approved{background:var(--success-bg);color:var(--success);border-color:var(--success);}
.b-rejected{background:var(--error-bg);color:var(--error);border-color:var(--error);}
.b-method{background:var(--blue-100);color:var(--blue-900);border-color:var(--blue-800);}
.b-neutral{background:var(--white);color:var(--ink-sub);border-color:var(--line-strong);}
.b-dark{background:var(--blue-900);color:#fff;border-color:var(--blue-900);}
.b-sq{border-radius:4px;}

/* 注意書き（重要な警告のみ） */
.warnbox{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:10px 12px;border:1px solid var(--warn);border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);font-weight:500;}
.warnbox.danger{border-color:var(--error);background:var(--error-bg);color:var(--error);}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-sub);padding:4px 0;}
.cal .day{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:6px 7px;min-height:76px;text-align:left;font:inherit;cursor:pointer;}
.cal .day:hover{background:var(--blue-100);}
.cal .day .d{font-size:13px;font-weight:700;}
.cal .day .m{font-size:11px;color:var(--ink-sub);line-height:1.45;font-variant-numeric:tabular-nums;}
.cal .day.off{background:#F4F4F5;color:#9A9A9C;}
.cal .day.off .m{color:#9A9A9C;}
.cal .day.today{border:2px solid var(--blue-800);padding:5px 6px;}
.cal .day.busy{background:var(--blue-100);border-color:var(--blue-800);}
.cal .day.blank{background:transparent;border:0;cursor:default;}
.cal .day .ov{font-size:10px;font-weight:700;color:var(--warn);}

/* 時間枠チップ */
.slotchip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);padding:8px 10px 8px 14px;font-variant-numeric:tabular-nums;}
.slotchip b{font-size:15px;}
.slotchip .del{border:0;background:none;color:var(--error);padding:2px 4px;line-height:1;cursor:pointer;}

/* ボード：持込・引取で列幅を揃える */
.board-tbl{table-layout:fixed;min-width:1140px;}
.board-tbl td.text-end{padding-left:2px;padding-right:10px;}
.board-tbl td{word-break:break-word;}

/* その他 */
.empty{background:var(--white);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:44px 24px;text-align:center;color:var(--ink-sub);}
.hint{font-size:13px;color:var(--ink-sub);margin:0 0 6px;}
.sticky-col{position:sticky;top:calc(var(--topbar-h) + 16px);}
.divline{border-top:1px solid var(--line);margin:16px 0;}
.mono{font-variant-numeric:tabular-nums;}
.filterbar{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.filterbar .f{min-width:150px;}
.filterbar .f label{font-size:12px;font-weight:700;color:var(--ink-sub);display:block;margin-bottom:2px;}
.toast-host{position:fixed;right:20px;bottom:20px;z-index:1090;display:flex;flex-direction:column;gap:8px;}
.toast-item{background:var(--blue-900);color:#fff;border-radius:var(--radius);padding:12px 18px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.24);max-width:420px;}
.toast-item.warn{background:var(--warn);}
.toast-item.err{background:var(--error);}
.modal-header{border-bottom-color:var(--line);}
.modal-footer{border-top-color:var(--line);}
.modal-title{font-size:18px;font-weight:700;}
.dl{display:grid;grid-template-columns:130px 1fr;gap:0;font-size:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.dl dt{background:#FAFAFA;padding:8px 12px;font-weight:500;color:var(--ink-sub);border-bottom:1px solid var(--line);margin:0;}
.dl dd{padding:8px 12px;border-bottom:1px solid var(--line);margin:0;font-weight:500;}
.dl dt:nth-last-of-type(1),.dl dd:nth-last-of-type(1){border-bottom:0;}
.urlbox{display:flex;gap:8px;align-items:center;background:#FAFAFA;border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px 12px;font-size:13px;word-break:break-all;}
.urlbox code{color:var(--blue-900);font-weight:700;}
.invitewrap{max-width:560px;margin:0 auto;}
.nowrap{white-space:nowrap;}
/* 取引先の本登録画面（本番では取引先側アプリの画面）はガワを切り替える */
body.invite-mode .sidebar{display:none;}
body.invite-mode .content{margin-left:0;}
body.invite-mode .topbar{background:var(--blue-900);border-bottom:0;}
body.invite-mode .topbar .brand{color:#fff;}
body.invite-mode .topbar .brand span{color:#C9D2FF;}
/* 単一ファイル版：排出者ポータルを同じファイル内に表示する */
.emitframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);z-index:1040;}
.backbtn{position:fixed;right:20px;bottom:20px;z-index:1060;background:var(--white);border:1px solid var(--blue-800);
  color:var(--blue-800);font-weight:700;font-size:14px;border-radius:99px;padding:10px 20px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;gap:6px;}
.backbtn:hover{background:var(--blue-100);}
@media (max-width:767px){
  .topbar{gap:8px;padding:0 12px;}
  .topbar .brand{font-size:14px;}
  .topbar #elPlantSel{display:none;}
}
@media (max-width:991px){
  :root{--sidebar-w:0px;}
  .sidebar{transform:translateX(-100%);transition:transform .2s;width:236px;}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.4);}
  .content{padding:calc(var(--topbar-h) + 16px) 14px 64px;}
}
</style>
</head>

<!-- 排出者ポータル（添付モックをそのまま同梱。iframe で表示するため互いのCSS/JSは干渉しない） -->
<script type="text/html" id="emitterHtml">
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>産廃DX｜排出元ポータル ワイヤーフレーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#000B5F; --blue-800:#0017C1; --blue-100:#E8F1FE;
  --ink:#1A1A1C; --ink-sub:#626264;
  --line:#D8D8DB; --line-strong:#767676;
  --bg:#F2F2F2; --white:#FFFFFF;
  --error:#CE0000; --error-bg:#FDEEEE;
  --success:#197A4B; --success-bg:#E6F5EC;
  --warn:#B75200; --warn-bg:#FDF3E6;
  --radius:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
:focus-visible{outline:3px solid #FFD43D;outline-offset:0;box-shadow:0 0 0 5px var(--ink);border-radius:2px;}

/* header */
.appbar{background:var(--white);border-bottom:1px solid var(--line);}
.appbar-inner{max-width:1040px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:32px;min-height:64px;}
.brand{font-weight:700;font-size:18px;white-space:nowrap;}
.brand span{display:block;font-size:11px;font-weight:400;color:var(--ink-sub);line-height:1.3;}
.gnav{display:flex;gap:4px;}
.gnav button{font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:none;border:0;border-bottom:3px solid transparent;padding:20px 16px 17px;cursor:pointer;}
.gnav button:hover{background:var(--blue-100);}
.gnav button[aria-current="page"]{color:var(--blue-800);border-bottom-color:var(--blue-800);font-weight:700;}

/* layout */
.wrap{max-width:840px;margin:0 auto;padding:32px 24px 96px;}
.wrap.wide{max-width:1040px;}
h1{font-size:28px;line-height:1.4;margin:0 0 8px;font-weight:700;}
h2{font-size:19px;line-height:1.5;margin:0 0 16px;font-weight:700;}
.lead{color:var(--ink-sub);font-size:15px;margin:0 0 28px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px 28px;margin-bottom:16px;}

/* stepper */
.stepper{display:flex;margin:0 0 28px;padding:0;list-style:none;flex-wrap:wrap;}
.stepper li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-sub);padding:0 14px 0 0;}
.stepper li::after{content:"";width:16px;height:1px;background:var(--line-strong);margin-left:6px;}
.stepper li:last-child::after{display:none;}
.stepper .num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--white);border:1px solid var(--line-strong);color:var(--ink-sub);}
.stepper li.done .num{background:var(--blue-100);border-color:var(--blue-800);color:var(--blue-800);}
.stepper li.current .num{background:var(--blue-800);border-color:var(--blue-800);color:var(--white);}
.stepper li.current{color:var(--ink);font-weight:700;}

/* forms */
.field{margin-bottom:22px;}
.field:last-child{margin-bottom:0;}
.label{display:block;font-weight:700;font-size:15px;margin-bottom:6px;}
.req{font-size:12px;font-weight:700;color:var(--error);border:1px solid var(--error);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}
.opt{font-size:12px;font-weight:500;color:var(--ink-sub);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px;}
.hint{font-size:13px;color:var(--ink-sub);margin:0 0 6px;}
input[type="text"],input[type="tel"],select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);color:var(--ink);}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:44px;}
textarea{min-height:88px;resize:vertical;}
.row{display:flex;gap:16px;flex-wrap:wrap;}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:15px;}
.checkline input{margin-top:6px;width:20px;height:20px;flex:none;}
.procinfo{font-size:13px;color:var(--ink-sub);margin-top:8px;}

/* time picker */
.timeset{display:flex;gap:24px;flex-wrap:wrap;}
.timeset > div{flex:0 0 auto;}
.hm{display:flex;align-items:center;gap:6px;}
.hm select{width:auto;min-width:84px;}
.hm .sep{font-weight:700;}
.hm .unit{font-size:14px;color:var(--ink-sub);}

/* radio cards */
.optionlist{display:flex;gap:12px;flex-wrap:wrap;}
.optionitem{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:var(--radius);padding:14px 16px;background:var(--white);cursor:pointer;flex:1 1 300px;}
.optionitem:hover{background:var(--blue-100);}
.optionitem input{margin-top:4px;width:20px;height:20px;flex:none;}
.optionitem .t{font-weight:700;display:block;}
.optionitem .d{font-size:13px;color:var(--ink-sub);display:block;}
.optionitem.selected{border-color:var(--blue-800);border-width:2px;padding:13px 15px;background:var(--blue-100);}

/* date & slot buttons */
.datebtns{display:flex;flex-wrap:wrap;gap:10px;}
.datebtn{font:inherit;font-size:15px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);padding:10px 16px;cursor:pointer;text-align:center;min-width:112px;}
.datebtn .dow{display:block;font-size:12px;color:var(--ink-sub);}
.datebtn:hover:not(:disabled){background:var(--blue-100);}
.datebtn[aria-pressed="true"]{border:2px solid var(--blue-800);background:var(--blue-100);padding:9px 15px;font-weight:700;}
.datebtn:disabled{background:var(--bg);color:#9A9A9C;border-color:var(--line);cursor:not-allowed;}
.slot{font:inherit;font-size:15px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--white);padding:12px 24px;cursor:pointer;min-width:180px;text-align:center;}
.slot:hover{background:var(--blue-100);}
.slot[aria-pressed="true"]{border:2px solid var(--blue-800);background:var(--blue-100);padding:11px 23px;font-weight:700;}
.subblock{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);}

/* buttons */
.actions{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.btn{font:inherit;font-weight:700;border-radius:var(--radius);padding:12px 28px;cursor:pointer;border:1px solid transparent;}
.btn-primary{background:var(--blue-800);color:var(--white);}
.btn-primary:hover{background:var(--blue-900);}
.btn-secondary{background:var(--white);color:var(--blue-800);border-color:var(--blue-800);}
.btn-secondary:hover{background:var(--blue-100);}
.btn-sm{padding:7px 18px;font-size:14px;}
.spacer{flex:1;}

/* confirm */
.reviewgroup{border:1px solid var(--line);border-radius:var(--radius);background:var(--white);margin-bottom:16px;overflow:hidden;}
.reviewhead{background:#FAFAFA;border-bottom:1px solid var(--line);padding:10px 16px;font-weight:700;font-size:15px;}
.reviewtable{width:100%;border-collapse:collapse;}
.reviewtable th{width:32%;text-align:left;vertical-align:top;font-weight:500;color:var(--ink-sub);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--white);font-size:14px;}
.reviewtable td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;}
.reviewtable tr:last-child th,.reviewtable tr:last-child td{border-bottom:0;}
.reviewtable td.val{font-weight:500;}
.reviewtable td.act{width:92px;text-align:right;padding-left:0;}
.reviewtable tr.editing th{background:var(--blue-100);color:var(--ink);font-weight:700;}
.reviewtable tr.editing td{background:var(--blue-100);}
.editbtn{font:inherit;font-size:13px;background:var(--white);border:1px solid var(--blue-800);color:var(--blue-800);border-radius:var(--radius);padding:4px 10px;cursor:pointer;white-space:nowrap;}
.editbtn:hover{background:var(--blue-100);}
.editactions{display:flex;gap:8px;margin-top:14px;}
.itemline{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.linehead{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:12px;color:var(--ink-sub);}
.btn-danger{border-color:var(--error);color:var(--error);}
.btn-danger:hover{background:var(--error-bg);}
.groupfoot{padding:12px 16px;border-top:1px solid var(--line);}
.empty-val{color:var(--ink-sub);}

/* list */
.tbl{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:14px;}
.tbl thead th{background:#FAFAFA;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;}
.tbl td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl tbody tr:last-child td{border-bottom:0;}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap;}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 12px;white-space:nowrap;}
.badge.pending{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);}
.badge.approved{background:var(--success-bg);color:var(--success);border:1px solid var(--success);}
.badge.rejected{background:var(--error-bg);color:var(--error);border:1px solid var(--error);}
.badge.method{background:var(--blue-100);color:var(--blue-900);border:1px solid var(--blue-800);}

/* misc */
.alert{border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;border:2px solid;}
.alert.error{background:var(--error-bg);border-color:var(--error);}
.alert h3{margin:0;font-size:16px;color:var(--error);}
.alert ul{margin:8px 0 0;padding-left:20px;}
.alert li{font-size:14px;}
.done-hero{background:var(--success-bg);border:2px solid var(--success);border-radius:var(--radius);padding:28px;text-align:center;margin-bottom:16px;}
.done-hero h1{color:var(--success);font-size:24px;margin-bottom:4px;}
.done-hero p{margin:0;}
.emptystate{background:var(--white);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:56px 24px;text-align:center;color:var(--ink-sub);}
.dialog-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;z-index:50;}
.dialog{background:var(--white);border-radius:var(--radius);max-width:640px;width:100%;max-height:86vh;overflow:auto;}
.dialog-head{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);}
.dialog-head h2{margin:0;font-size:18px;flex:1;}
.dialog-body{padding:24px;}
.dialog-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}
@media (max-width:600px){
  .appbar-inner{flex-wrap:wrap;gap:0 16px;padding:8px 16px;}
  .gnav{order:3;width:100%;overflow-x:auto;}
  .gnav button{padding:12px;font-size:14px;}
  .wrap{padding:24px 16px 72px;}
  .card{padding:20px 16px 24px;}
  h1{font-size:22px;}
  .reviewtable th{width:38%;}
  .tbl{font-size:13px;}
  .timeset{gap:16px;}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">産廃予約システム<span>株式会社サンプル建設（排出元）</span></div>
    <nav class="gnav" id="elGnav" aria-label="メインメニュー"></nav>
  </div>
</header>

<main id="elMain"></main>
<div id="elDialog"></div>

<script>
/* ===== ダミーデータ ===== */
const PROCESSORS = [
  {id:'p1', name:'株式会社エコクリーン埼玉', area:'埼玉県さいたま市北区宮原町0-0-0', permit:'産業廃棄物 収集運搬業／中間処理業'},
  {id:'p2', name:'グリーンリサイクル株式会社', area:'埼玉県川口市領家0-0-0', permit:'産業廃棄物 収集運搬業'},
  {id:'p3', name:'中央環境サービス株式会社', area:'東京都足立区入谷0-0-0', permit:'産業廃棄物 収集運搬業／積替保管'}
];
const MASTER = {
  items:['廃プラスチック類','木くず','金属くず','ガラス・コンクリート・陶磁器くず','汚泥','紙くず','混合廃棄物'],
  units:['kg','t','m3','個','台'],
  vehicleClasses:['軽トラック','2tトラック（平ボディ）','2tトラック（ダンプ）','4tトラック','10tトラック','ユニック車（4t）']
};
const SITES = [
  {id:'s1', name:'大宮第一現場', addr:'埼玉県さいたま市大宮区桜木町0-0-0'},
  {id:'s2', name:'川越倉庫', addr:'埼玉県川越市脇田本町0-0-0'}
];
const SLOT_DEFS = [{id:'am',label:'9:00 〜 12:00'},{id:'pm',label:'13:00 〜 16:00'}];
const HOURS = Array.from({length:15},(_,i)=>String(i+6).padStart(2,'0')); // 06〜20時
const MINUTES = ['00','30'];

function buildDates(){
  const out=[], d=new Date(); d.setDate(d.getDate()+2);
  while(out.length<8){ if(d.getDay()!==0) out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
const DATES = buildDates();
const DOW = ['日','月','火','水','木','金','土'];
const fmtKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtJp  = d => `${d.getMonth()+1}月${d.getDate()}日`;
const fmtFull= key => { if(!key) return ''; const [y,m,dd]=key.split('-'); const dt=new Date(+y,+m-1,+dd); return `${y}年${+m}月${+dd}日（${DOW[dt.getDay()]}）`; };
const dateAvailable = idx => idx!==3;   // 処理業者が受付停止にした日のサンプル

/* ===== 状態 ===== */
const emptyLine = () => ({item:'', qty:'', unit:'', memo:''});
const blank = () => ({
  processorId:null, method:null,
  date:null, slotId:null,
  startH:'', startM:'', endH:'', endM:'',
  addr:'', siteId:'', saveSite:false, siteName:'',
  lines:[emptyLine()],
  vClass:'', vCount:'', driver:'', driverTel:'', plate:''
});
const clone = o => JSON.parse(JSON.stringify(o));
function setPath(obj,path,v){
  const p=path.split('.'); let t=obj;
  for(let i=0;i<p.length-1;i++) t=t[p[i]];
  t[p[p.length-1]]=v;
}
const lineText = ln => ln.item ? `${ln.item}　${ln.qty?ln.qty+' '+ln.unit:''}${ln.memo?'　／　'+ln.memo:''}` : '';
const state = {
  page:'input', errors:[], editing:null, snapshot:null, lastNo:null, detailNo:null,
  data:blank(),
  reservations:[
    {no:'R-2026-0148', processorId:'p1', method:'drop', dateLabel:'2026年8月28日（金） 9:00 〜 12:00', status:'approved',
     lines:[{item:'廃プラスチック類', qty:'320', unit:'kg', memo:'フレコンバッグ4袋'}],
     vClass:'2tトラック（平ボディ）', vCount:'1', driver:'佐藤 健', driverTel:'090-0000-0000', plate:'大宮 100 あ 12-34'},
    {no:'R-2026-0152', processorId:'p2', method:'pickup', dateLabel:'2026年8月31日（月） 10:00 〜 11:30', status:'pending',
     lines:[{item:'木くず', qty:'1.2', unit:'t', memo:'搬出口は建物裏手'},{item:'金属くず', qty:'80', unit:'kg', memo:''},{item:'混合廃棄物', qty:'2', unit:'m3', memo:''}],
     addr:'埼玉県さいたま市大宮区桜木町0-0-0', siteName:'大宮第一現場'},
    {no:'R-2026-0155', processorId:'p1', method:'pickup', dateLabel:'2026年9月2日（水） 14:00 〜 15:00', status:'rejected',
     lines:[{item:'混合廃棄物', qty:'3', unit:'m3', memo:''}],
     rejectReason:'指定日の収集ルートが満車のため。別日での再申請をお願いします。', addr:'埼玉県川越市脇田本町0-0-0', siteName:'川越倉庫'}
  ]
};
const proc = id => PROCESSORS.find(p=>p.id===id) || {};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts = (list,cur,ph) => `<option value="">${ph||'選択してください'}</option>`+list.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
const timeStr = (h,m) => (h&&m) ? `${h}:${m}` : '';
const toMin = (h,m) => Number(h)*60+Number(m);

function stepper(cur){
  return `<ol class="stepper">${['入力','確認','完了'].map((l,i)=>{
    const n=i+1, cls = n===cur?'current':(n<cur?'done':'');
    return `<li class="${cls}"><span class="num">${n<cur?'✓':n}</span>${l}</li>`;
  }).join('')}</ol>`;
}
function errorBox(){
  if(!state.errors.length) return '';
  return `<div class="alert error" role="alert" tabindex="-1" id="elErrors"><h3>入力内容を確認してください</h3>
    <ul>${state.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;
}

/* ===== 共通パーツ ===== */
function dateButtons(){
  const d=state.data;
  return `<div class="datebtns" role="group">
    ${DATES.map((dt,i)=>{
      const key=fmtKey(dt), ok=dateAvailable(i);
      return `<button type="button" class="datebtn" aria-pressed="${d.date===key}" ${ok?'':'disabled'}
        data-act="pickDate" data-date="${key}">${fmtJp(dt)}<span class="dow">${ok?DOW[dt.getDay()]:'受付停止'}</span></button>`;
    }).join('')}</div>`;
}
function slotButtons(){
  const d=state.data;
  return `<div class="datebtns" role="group">
    ${SLOT_DEFS.map(s=>`<button type="button" class="slot" aria-pressed="${d.slotId===s.id}" data-act="pickSlot" data-slot="${s.id}">${s.label}</button>`).join('')}</div>`;
}
function timePicker(idPrefix){
  const d=state.data;
  const g=(lbl,hKey,mKey)=>`<div>
    <p class="hint">${lbl}</p>
    <div class="hm">
      <select id="${idPrefix}${hKey}" data-bind="${hKey}" aria-label="${lbl}の時">${opts(HOURS,d[hKey],'--')}</select><span class="unit">時</span>
      <select data-bind="${mKey}" aria-label="${lbl}の分">${opts(MINUTES,d[mKey],'--')}</select><span class="unit">分</span>
    </div></div>`;
  return `<div class="timeset">${g('開始','startH','startM')}${g('終了','endH','endM')}</div>`;
}

/* ===== 入力画面 ===== */
function viewInput(){
  const d=state.data, p=proc(d.processorId);
  const optCard=(v,t,desc)=>`<label class="optionitem ${d.method===v?'selected':''}">
    <input type="radio" name="method" value="${v}" ${d.method===v?'checked':''} data-bind="method">
    <span><span class="t">${t}</span><span class="d">${desc}</span></span></label>`;

  let html = `<div class="card">
    <h2>申請先</h2>
    <div class="field">
      <label class="label" for="elProc">処理業者<span class="req">必須</span></label>
      <select id="elProc" data-bind="processorId">
        <option value="">選択してください</option>
        ${PROCESSORS.map(x=>`<option value="${x.id}" ${d.processorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
      </select>
      ${d.processorId?`<p class="procinfo">${esc(p.area)}／${esc(p.permit)}</p>`:''}
    </div>
    <div class="field">
      <span class="label" id="elMethodLbl">受入方法<span class="req">必須</span></span>
      <div class="optionlist" role="radiogroup" aria-labelledby="elMethodLbl">
        ${optCard('pickup','引取','処理業者が現場まで収集に来ます')}
        ${optCard('drop','持込','自社の車両で処理業者の施設へ搬入します')}
      </div>
    </div>
  </div>`;

  const head = `<div class="wrap"><h1>予約を作成する</h1>
    <p class="lead">処理業者への搬入・引取の予約を申請します。申請後、処理業者の承認をもって予約が確定します。</p>
    ${stepper(1)}${errorBox()}`;

  if(!d.method){
    return head+html+`<div class="card" style="color:var(--ink-sub);">受入方法を選ぶと、日時と内容の入力欄が表示されます。</div></div>`;
  }

  html += `<div class="card">
    <h2>日時</h2>
    <div class="field">
      <span class="label">${d.method==='drop'?'搬入日':'引取希望日'}<span class="req">必須</span></span>
      ${dateButtons()}
    </div>`;
  if(d.date && d.method==='drop'){
    html += `<div class="subblock"><span class="label">時間枠<span class="req">必須</span></span>
      <p class="hint">${fmtFull(d.date)} の受入枠です。</p>${slotButtons()}</div>`;
  }
  if(d.date && d.method==='pickup'){
    html += `<div class="subblock"><span class="label">引取希望時間<span class="req">必須</span></span>
      <p class="hint">分は30分単位で選べます。</p>${timePicker('el')}</div>`;
  }
  html += `</div>`;

  if(d.method==='pickup'){
    html += `<div class="card">
      <h2>引取場所</h2>
      <div class="field">
        <label class="label" for="elSite">登録済みの現場から選ぶ<span class="opt">任意</span></label>
        <select id="elSite" data-bind="siteId" data-act="pickSite">
          <option value="">選択しない（住所を直接入力）</option>
          ${SITES.map(s=>`<option value="${s.id}" ${d.siteId===s.id?'selected':''}>${esc(s.name)}（${esc(s.addr)}）</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label class="label" for="elAddr">住所<span class="req">必須</span></label>
        <input type="text" id="elAddr" data-bind="addr" value="${esc(d.addr)}" placeholder="例：埼玉県さいたま市大宮区桜木町0-0-0">
      </div>
      <div class="field">
        <label class="checkline"><input type="checkbox" data-bind="saveSite" ${d.saveSite?'checked':''}>
        <span>この住所を現場マスタに登録する</span></label>
        ${d.saveSite?`<div style="margin-top:12px;padding-left:30px;">
          <label class="label" for="elSiteName">現場名<span class="req">必須</span></label>
          <p class="hint">次回以降、この名前でプルダウンから選べるようになります。</p>
          <input type="text" id="elSiteName" data-bind="siteName" value="${esc(d.siteName)}" placeholder="例：大宮第二現場">
        </div>`:''}
      </div>
    </div>`;
  }

  html += `<div class="card">
    <h2>廃棄物の内容</h2>
    <p class="hint">品目ごとに1行ずつ入力してください。</p>
    ${d.lines.map((ln,i)=>`
      <div class="itemline">
        <div class="linehead"><span>品目 ${i+1}</span>
          ${d.lines.length>1?`<button type="button" class="editbtn btn-danger" data-act="removeLine" data-idx="${i}">削除</button>`:''}
        </div>
        <div class="row">
          <div class="field" style="flex:2 1 240px;margin-bottom:16px;">
            <label class="label" for="ln${i}item">品目<span class="req">必須</span></label>
            <select id="ln${i}item" data-bind="lines.${i}.item">${opts(MASTER.items,ln.item)}</select></div>
          <div class="field" style="flex:1 1 120px;margin-bottom:16px;">
            <label class="label" for="ln${i}qty">数量<span class="req">必須</span></label>
            <input type="text" inputmode="decimal" id="ln${i}qty" data-bind="lines.${i}.qty" value="${esc(ln.qty)}" placeholder="例：320"></div>
          <div class="field" style="flex:1 1 120px;margin-bottom:16px;">
            <label class="label" for="ln${i}unit">単位<span class="req">必須</span></label>
            <select id="ln${i}unit" data-bind="lines.${i}.unit">${opts(MASTER.units,ln.unit)}</select></div>
        </div>
        <div class="field">
          <label class="label" for="ln${i}memo">備考<span class="opt">任意</span></label>
          <input type="text" id="ln${i}memo" data-bind="lines.${i}.memo" value="${esc(ln.memo)}" placeholder="荷姿、搬出場所、当日の連絡事項など"></div>
      </div>`).join('')}
    <button type="button" class="btn btn-secondary btn-sm" data-act="addLine">＋ 品目を追加</button>
  </div>`;

  if(d.method==='drop'){
    html += `<div class="card">
      <h2>車両・ドライバー</h2>
      <div class="row">
        <div class="field" style="flex:2 1 260px;">
          <label class="label" for="elVClass">車格<span class="req">必須</span></label>
          <select id="elVClass" data-bind="vClass">${opts(MASTER.vehicleClasses,d.vClass)}</select></div>
        <div class="field" style="flex:1 1 120px;">
          <label class="label" for="elVCount">台数<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" id="elVCount" data-bind="vCount" value="${esc(d.vCount)}" placeholder="1"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1 1 240px;">
          <label class="label" for="elDriver">ドライバー名<span class="req">必須</span></label>
          <input type="text" id="elDriver" data-bind="driver" value="${esc(d.driver)}" placeholder="例：佐藤 健"></div>
        <div class="field" style="flex:1 1 240px;">
          <label class="label" for="elTel">ドライバー連絡先<span class="req">必須</span></label>
          <input type="tel" id="elTel" data-bind="driverTel" value="${esc(d.driverTel)}" placeholder="例：090-0000-0000"></div>
      </div>
      <div class="field">
        <label class="label" for="elPlate">車両ナンバー<span class="req">必須</span></label>
        <input type="text" id="elPlate" data-bind="plate" value="${esc(d.plate)}" placeholder="例：大宮 100 あ 12-34"></div>
    </div>`;
  }

  html += `<div class="actions"><span class="spacer"></span>
    <button type="button" class="btn btn-primary" data-act="toConfirm">入力内容を確認</button></div>`;
  return head+html+`</div>`;
}

/* ===== 確認画面（インライン編集） ===== */
function rrow(key,label,value,editor){
  if(state.editing===key){
    return `<tr class="editing"><th>${label}</th><td colspan="2">${editor}
      <div class="editactions">
        <button type="button" class="btn btn-primary btn-sm" data-act="applyEdit">確定</button>
        <button type="button" class="btn btn-secondary btn-sm" data-act="cancelEdit">キャンセル</button>
      </div></td></tr>`;
  }
  const v=(value===''||value==null)?'<span class="empty-val">未入力</span>':esc(value);
  return `<tr><th>${label}</th><td class="val">${v}</td>
    <td class="act"><button type="button" class="editbtn" data-act="edit" data-key="${key}" aria-label="${label}を編集">✎ 編集</button></td></tr>`;
}
const edSelect = (bind,list,cur)=>`<select data-bind="${bind}" data-focus="1">${opts(list,cur)}</select>`;
const edText = (bind,cur,ph)=>`<input type="text" data-bind="${bind}" value="${esc(cur)}" placeholder="${ph||''}" data-focus="1">`;

function lineEditor(i){
  const ln=state.data.lines[i];
  return `<div class="row">
      <div style="flex:2 1 200px;"><p class="hint">品目</p><select data-bind="lines.${i}.item" data-focus="1">${opts(MASTER.items,ln.item)}</select></div>
      <div style="flex:1 1 110px;"><p class="hint">数量</p><input type="text" inputmode="decimal" data-bind="lines.${i}.qty" value="${esc(ln.qty)}"></div>
      <div style="flex:1 1 110px;"><p class="hint">単位</p><select data-bind="lines.${i}.unit">${opts(MASTER.units,ln.unit)}</select></div>
    </div>
    <div style="margin-top:12px;"><p class="hint">備考</p><input type="text" data-bind="lines.${i}.memo" value="${esc(ln.memo)}" placeholder="荷姿、搬出場所、当日の連絡事項など"></div>
    ${state.data.lines.length>1?`<div style="margin-top:12px;"><button type="button" class="editbtn btn-danger" data-act="removeLine" data-idx="${i}">この品目を削除</button></div>`:''}`;
}
function itemsBlock(){
  const d=state.data;
  return `<div class="reviewgroup"><div class="reviewhead">廃棄物の内容</div>
    <table class="reviewtable">
      ${d.lines.map((ln,i)=>rrow('line'+i, `品目 ${i+1}`, lineText(ln), lineEditor(i))).join('')}
    </table>
    <div class="groupfoot"><button type="button" class="btn btn-secondary btn-sm" data-act="addLine">＋ 品目を追加</button></div>
  </div>`;
}
function viewConfirm(){
  const d=state.data, p=proc(d.processorId);
  const methodEditor = `<div class="optionlist">
    ${[['pickup','引取'],['drop','持込']].map(([v,t])=>`<label class="optionitem ${d.method===v?'selected':''}" style="flex:0 1 auto;">
      <input type="radio" name="cmethod" value="${v}" ${d.method===v?'checked':''} data-bind="method"><span class="t">${t}</span></label>`).join('')}
    </div><p class="hint" style="margin:8px 0 0;">受入方法を変えると、日時や車両などの項目が入れ替わります。</p>`;
  let blocks = `<div class="reviewgroup"><div class="reviewhead">申請先</div><table class="reviewtable">
    ${rrow('processorId','処理業者', p.name,
      `<select data-bind="processorId" data-focus="1"><option value="">選択してください</option>
        ${PROCESSORS.map(x=>`<option value="${x.id}" ${d.processorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}
    ${rrow('method','受入方法', d.method?(d.method==='drop'?'持込（自社車両で搬入）':'引取（処理業者が収集）'):'', methodEditor)}
  </table></div>`;

  if(d.method==='drop'){
    blocks += `<div class="reviewgroup"><div class="reviewhead">日時</div><table class="reviewtable">
      ${rrow('date','搬入日', fmtFull(d.date), dateButtons())}
      ${rrow('slotId','時間枠', SLOT_DEFS.find(s=>s.id===d.slotId)?.label||'',
        d.date?slotButtons():`<p class="hint" style="margin:0;">先に搬入日を選んでください。</p>`)}
    </table></div>
    ${itemsBlock()}
    <div class="reviewgroup"><div class="reviewhead">車両・ドライバー</div><table class="reviewtable">
      ${rrow('vClass','車格', d.vClass, edSelect('vClass',MASTER.vehicleClasses,d.vClass))}
      ${rrow('vCount','台数', d.vCount?d.vCount+' 台':'', edText('vCount',d.vCount,'1'))}
      ${rrow('driver','ドライバー名', d.driver, edText('driver',d.driver,'例：佐藤 健'))}
      ${rrow('driverTel','ドライバー連絡先', d.driverTel, edText('driverTel',d.driverTel,'例：090-0000-0000'))}
      ${rrow('plate','車両ナンバー', d.plate, edText('plate',d.plate,'例：大宮 100 あ 12-34'))}
    </table></div>`;
  }else if(d.method==='pickup'){
    const site = SITES.find(s=>s.id===d.siteId);
    const siteEditor = `<select data-bind="siteId" data-act="pickSite" data-focus="1">
      <option value="">選択しない（住所を直接入力）</option>
      ${SITES.map(s=>`<option value="${s.id}" ${d.siteId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <p class="hint" style="margin:8px 0 0;">選ぶと住所も置き換わります。</p>`;
    blocks += `<div class="reviewgroup"><div class="reviewhead">日時</div><table class="reviewtable">
      ${rrow('date','引取希望日', fmtFull(d.date), dateButtons())}
      ${rrow('time','引取希望時間', (d.startH&&d.startM&&d.endH&&d.endM)?`${timeStr(d.startH,d.startM)} 〜 ${timeStr(d.endH,d.endM)}`:'', timePicker('c'))}
    </table></div>
    <div class="reviewgroup"><div class="reviewhead">引取場所</div><table class="reviewtable">
      ${rrow('siteId','現場', site?site.name:'（マスタ未登録）', siteEditor)}
      ${rrow('addr','住所', d.addr, edText('addr',d.addr,'例：埼玉県さいたま市大宮区桜木町0-0-0'))}
      ${rrow('saveSite','現場マスタへの登録', d.saveSite?`登録する（現場名：${d.siteName||'未入力'}）`:'登録しない',
        `<label class="checkline"><input type="checkbox" data-bind="saveSite" ${d.saveSite?'checked':''} data-focus="1"><span>この住所を現場マスタに登録する</span></label>
         ${d.saveSite?`<div style="margin-top:12px;padding-left:30px;"><p class="hint">現場名</p>
           <input type="text" data-bind="siteName" value="${esc(d.siteName)}" placeholder="例：大宮第二現場"></div>`:''}`)}
    </table></div>
    ${itemsBlock()}`;
  }

  return `<div class="wrap"><h1>入力内容の確認</h1>
    <p class="lead">修正する場合は各項目の「✎ 編集」を押してください。この画面のまま直せます。</p>
    ${stepper(2)}${errorBox()}
    ${blocks}
    <div class="actions">
      <button type="button" class="btn btn-secondary" data-act="backToInput">入力に戻る</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" data-act="submit">この内容で申請する</button>
    </div></div>`;
}

/* ===== 完了 ===== */
function viewDone(){
  const r = state.reservations.find(x=>x.no===state.lastNo) || {};
  return `<div class="wrap">${stepper(3)}
    <div class="done-hero"><h1>申請しました</h1><p>受付番号　<b>${esc(r.no||'')}</b></p></div>
    <div class="card">
      <p style="margin-top:0;">${esc(proc(r.processorId).name)} が内容を確認します。承認されると予約が確定し、メールでお知らせします。現在のステータスは <span class="badge pending">申請中</span> です。</p>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-act="newReservation">続けて予約を作成</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary" data-act="goList">予約一覧を見る</button>
      </div></div></div>`;
}

/* ===== 予約一覧 ===== */
const STATUS = {pending:['申請中','pending'], approved:['承認済（予約確定）','approved'], rejected:['差戻し','rejected']};
function viewList(){
  const rows = state.reservations.map(r=>{
    const [t,c]=STATUS[r.status];
    return `<tr><td class="num">${esc(r.no)}</td><td>${esc(proc(r.processorId).name)}</td>
      <td><span class="badge method">${r.method==='drop'?'持込':'引取'}</span></td>
      <td>${esc(r.dateLabel)}</td>
      <td>${esc(r.lines[0].item)}　${esc(r.lines[0].qty)} ${esc(r.lines[0].unit)}${r.lines.length>1?`<br><span style="color:var(--ink-sub);font-size:12px;">ほか ${r.lines.length-1} 品目</span>`:''}</td>
      <td><span class="badge ${c}">${t}</span></td>
      <td><button type="button" class="btn btn-secondary btn-sm" data-act="detail" data-no="${esc(r.no)}">詳細</button></td></tr>`;
  }).join('');
  return `<div class="wrap wide"><h1>予約一覧</h1>
    <p class="lead">申請した予約と、処理業者の承認状況を確認できます。</p>
    ${state.reservations.length ? `<table class="tbl">
      <thead><tr><th>受付番号</th><th>処理業者</th><th>方法</th><th>日時</th><th>品目・数量</th><th>ステータス</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>` :
      `<div class="emptystate">まだ予約がありません。<br><button type="button" class="btn btn-primary" style="margin-top:16px;" data-act="newReservation">予約を作成する</button></div>`}
    </div>`;
}
function viewDetailDialog(){
  const r = state.reservations.find(x=>x.no===state.detailNo); if(!r) return '';
  const [t,c]=STATUS[r.status];
  const line=(k,v)=>`<tr><th>${k}</th><td class="val">${v?esc(v):'<span class="empty-val">—</span>'}</td></tr>`;
  return `<div class="dialog-back" data-act="closeDetail">
    <div class="dialog" role="dialog" aria-modal="true" aria-label="予約詳細" onclick="event.stopPropagation()">
      <div class="dialog-head"><h2>${esc(r.no)}</h2><span class="badge ${c}">${t}</span></div>
      <div class="dialog-body">
        ${r.status==='rejected'&&r.rejectReason?`<div class="alert error"><h3>差戻しの理由</h3><p style="margin:8px 0 0;font-size:14px;">${esc(r.rejectReason)}</p></div>`:''}
        <div class="reviewgroup"><table class="reviewtable">
          ${line('処理業者', proc(r.processorId).name)}
          ${line('受入方法', r.method==='drop'?'持込':'引取')}
          ${line('日時', r.dateLabel)}
          ${r.method==='pickup'?line('引取場所',(r.siteName?r.siteName+'／':'')+(r.addr||'')):''}
          ${r.lines.map((ln,i)=>line(`品目 ${i+1}`, `${ln.item}　${ln.qty} ${ln.unit}${ln.memo?'　／　'+ln.memo:''}`)).join('')}
          ${r.method==='drop'?line('車格',r.vClass)+line('台数',r.vCount?r.vCount+' 台':'')+line('ドライバー名',r.driver)+line('ドライバー連絡先',r.driverTel)+line('車両ナンバー',r.plate):''}
        </table></div>
      </div>
      <div class="dialog-foot"><button type="button" class="btn btn-secondary" data-act="closeDetail">閉じる</button></div>
    </div></div>`;
}

function viewSettings(){
  return `<div class="wrap"><h1>設定</h1>
    <p class="lead">アカウントとマスタの設定を行います。</p>
    <div class="emptystate">この画面は未実装です。</div></div>`;
}

/* ===== バリデーション ===== */
function validate(){
  const d=state.data, e=[];
  if(!d.processorId) e.push('処理業者を選択してください。');
  if(!d.method) e.push('受入方法を選択してください。');
  if(d.method){
    if(!d.date) e.push('日付を選択してください。');
    if(d.method==='drop'){
      if(d.date && !d.slotId) e.push('時間枠を選択してください。');
      if(!d.vClass) e.push('車格を選択してください。');
      if(!String(d.vCount).trim()) e.push('台数を入力してください。');
      else if(!/^\d+$/.test(String(d.vCount).trim())) e.push('台数は半角数字で入力してください。');
      if(!d.driver.trim()) e.push('ドライバー名を入力してください。');
      if(!d.driverTel.trim()) e.push('ドライバー連絡先を入力してください。');
      if(!d.plate.trim()) e.push('車両ナンバーを入力してください。');
    }else{
      if(!d.startH||!d.startM) e.push('引取希望時間の開始を選択してください。');
      if(!d.endH||!d.endM) e.push('引取希望時間の終了を選択してください。');
      if(d.startH&&d.startM&&d.endH&&d.endM&&toMin(d.endH,d.endM)<=toMin(d.startH,d.startM))
        e.push('終了時間は開始時間より後にしてください。');
      if(!d.addr.trim()) e.push('引取場所の住所を入力してください。');
      if(d.saveSite && !d.siteName.trim()) e.push('現場マスタに登録する現場名を入力してください。');
    }
    d.lines.forEach((ln,i)=>{
      const n=`品目 ${i+1}：`;
      if(!ln.item) e.push(n+'品目を選択してください。');
      if(!String(ln.qty).trim()) e.push(n+'数量を入力してください。');
      else if(isNaN(Number(ln.qty))) e.push(n+'数量は数字で入力してください。');
      if(!ln.unit) e.push(n+'単位を選択してください。');
    });
  }
  state.errors=e;
  return e.length===0;
}

/* ===== 描画 ===== */
function render(){
  const y = window.scrollY;
  const pages={input:'予約作成', list:'予約一覧', settings:'設定'};
  const current = (state.page==='confirm'||state.page==='done') ? 'input' : state.page;
  document.getElementById('elGnav').innerHTML = Object.entries(pages)
    .map(([k,v])=>`<button type="button" data-act="go" data-page="${k}" ${current===k?'aria-current="page"':''}>${v}</button>`).join('');
  const views={input:viewInput, confirm:viewConfirm, done:viewDone, list:viewList, settings:viewSettings};
  document.getElementById('elMain').innerHTML = views[state.page]();
  document.getElementById('elDialog').innerHTML = state.detailNo ? viewDetailDialog() : '';

  if(state.errors.length){
    const b=document.getElementById('elErrors'); if(b){ b.scrollIntoView({block:'center'}); b.focus(); }
  }else if(state.editing){
    window.scrollTo(0,y);
    const f=document.querySelector('tr.editing [data-focus]'); if(f) f.focus({preventScroll:true});
  }else if(state.keepScroll){
    window.scrollTo(0,y); state.keepScroll=false;
  }else{
    window.scrollTo(0,0);
  }
}

/* ===== イベント ===== */
document.addEventListener('input', e=>{
  const key=e.target.dataset.bind; if(!key) return;
  const val = e.target.type==='checkbox' ? e.target.checked : e.target.value;
  if(key.indexOf('.')>=0){ setPath(state.data,key,val); return; }
  state.data[key] = val;
  if(key==='method'){
    if(state.data.method==='drop'){ state.data.startH=state.data.startM=state.data.endH=state.data.endM=''; }
    else { state.data.slotId=null; }
    state.errors=[]; state.keepScroll=true; render(); return;
  }
  if(key==='processorId'){ state.errors=[]; state.keepScroll=true; render(); return; }
  if(key==='saveSite'){ state.errors=[]; state.keepScroll=true; render(); return; }
  if(key==='addr'){
    const sel=SITES.find(s=>s.id===state.data.siteId);
    if(sel && sel.addr!==state.data.addr){ state.data.siteId=''; const el=document.querySelector('[data-bind="siteId"]'); if(el) el.value=''; }
  }
});
document.addEventListener('change', e=>{
  if(e.target.dataset.act==='pickSite'){
    const s=SITES.find(x=>x.id===e.target.value);
    state.data.siteId=e.target.value;
    if(s){ state.data.addr=s.addr; state.data.saveSite=false; }
    state.keepScroll=true; render();
  }
});
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  switch(el.dataset.act){
    case 'go':
      if(el.dataset.page==='input') state.data=blank();
      state.page=el.dataset.page; state.errors=[]; state.editing=null; state.detailNo=null; render(); break;
    case 'newReservation': state.data=blank(); state.page='input'; state.errors=[]; state.editing=null; render(); break;
    case 'goList': state.page='list'; state.errors=[]; render(); break;
    case 'pickDate':
      state.data.date=el.dataset.date; state.data.slotId=null;
      state.errors=[]; state.keepScroll=true; render(); break;
    case 'pickSlot': state.data.slotId=el.dataset.slot; state.errors=[]; state.keepScroll=true; render(); break;
    case 'addLine':
      if(state.page==='confirm') state.snapshot=clone(state.data);
      state.data.lines.push(emptyLine());
      state.errors=[]; state.keepScroll=true;
      if(state.page==='confirm') state.editing='line'+(state.data.lines.length-1);
      render(); break;
    case 'removeLine':
      state.data.lines.splice(Number(el.dataset.idx),1);
      if(!state.data.lines.length) state.data.lines.push(emptyLine());
      state.editing=null; state.snapshot=null; state.errors=[]; state.keepScroll=true; render(); break;
    case 'toConfirm': if(validate()){ state.page='confirm'; state.errors=[]; } render(); break;
    case 'backToInput': state.page='input'; state.errors=[]; state.editing=null; render(); break;
    case 'edit':
      state.snapshot=clone(state.data);
      state.editing=el.dataset.key; state.errors=[]; state.keepScroll=true; render(); break;
    case 'applyEdit': state.editing=null; state.snapshot=null; state.keepScroll=true; render(); break;
    case 'cancelEdit':
      if(state.snapshot) state.data=state.snapshot;
      state.editing=null; state.snapshot=null; state.keepScroll=true; render(); break;
    case 'submit': state.editing=null; state.snapshot=null; submit(); break;
    case 'detail': state.detailNo=el.dataset.no; render(); break;
    case 'closeDetail': state.detailNo=null; render(); break;
  }
});

function submit(){
  if(!validate()){ render(); return; }
  const d=state.data;
  const no='R-2026-'+String(156+state.reservations.length-3).padStart(4,'0');
  const dateLabel = d.method==='drop'
    ? `${fmtFull(d.date)} ${SLOT_DEFS.find(s=>s.id===d.slotId)?.label||''}`
    : `${fmtFull(d.date)} ${timeStr(d.startH,d.startM)} 〜 ${timeStr(d.endH,d.endM)}`;
  const rec={no, processorId:d.processorId, method:d.method, dateLabel, lines:clone(d.lines), status:'pending'};
  if(d.method==='drop') Object.assign(rec,{vClass:d.vClass,vCount:d.vCount,driver:d.driver,driverTel:d.driverTel,plate:d.plate});
  else{
    let siteName=(SITES.find(s=>s.id===d.siteId)||{}).name||'';
    if(d.saveSite && d.siteName.trim()){
      siteName=d.siteName.trim();
      SITES.push({id:'s'+(SITES.length+1), name:siteName, addr:d.addr});
    }
    Object.assign(rec,{addr:d.addr, siteName});
  }
  state.reservations.unshift(rec);
  state.lastNo=no; state.page='done'; state.errors=[];
  render();
}

render();
<\/script>
</body>

/* ---------- 日付ユーティリティ ---------- */
const DOW = ['日','月','火','水','木','金','土'];
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const D = n => dstr(addDays(TODAY,n));
const parseD = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y,m-1,dd); };
const fmtMd = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`; };
const fmtJp = s => { const d = parseD(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };
const ymOf = s => s.slice(0,7);
/* 稼働日（日曜以外）で n 日後／n 日前を返す。ダミーデータが休業日に乗らないようにするため */
function bizDay(n) {
  let d = new Date(TODAY), c = 0, step = n < 0 ? -1 : 1;
  while (c < Math.abs(n)) { d = addDays(d, step); if (d.getDay() !== 0) c++; }
  return dstr(d);
}
function B(n) { return bizDay(n); }

    const cnt = dow === 6 ? 1 : 2 + Math.floor(rnd()*3);
    for (let j = 0; j < cnt; j++) {
      const co = pick(COMPANIES.filter(c => c.status === 'active' && c.is_generator));
      const pl = pick(PLANTS);
      const it = pick(ITEMS.filter(x => x.type === 1));
      const type = rnd() < 0.3 && pl.is_pickup ? 'pickup' : 'drop';
      const slot = pick(pl.slots);
      const qty = round2(0.4 + rnd()*4);
      const car = 2400 + Math.round(rnd()*600);
      const net = Math.max(120, Math.round(qty * 1000 * (0.85 + rnd()*0.4)));
      const id = 'R-2026-' + pad(no++);
      addPickup({id, type, status:'done', company_id:co.id, plant_id:pl.id,
        date:ds, begin_time:slot.from, end_time:slot.to,
        car_number:'大宮 100 あ ' + (10+Math.floor(rnd()*80)) + '-' + (10+Math.floor(rnd()*80)),
        driver_name:pick(['佐藤 健','鈴木 一郎','伊藤 大輔','渡辺 翔']),
        driver_tel:'090-0000-0000',
        applied_at:D(-k-2)+' 10:00', via:'取引先ポータル',
        approved_at:D(-k-2)+' 11:00', approved_by:'受入担当 田中',
        arrived_at:pad(9+Math.floor(rnd()*6))+':'+pad(Math.floor(rnd()*6)*10),
        receipt_number:j+1,
        total_weight:car+net, car_weight:car, weight:net,
        diff: net - Math.round(qty*1000),
        diff_reason: Math.abs(net - qty*1000) / Math.max(qty*1000,1) > 0.25 ? '実測差（申告は目安）' : ''},
        [{item_id:it.id, unit_id:'u2', qty, actual_qty:round2(net/1000)}]);
    }
  }
})();

const STATUS = {

const stBadge = s => `<span class="badge ${STATUS[s].c}">${STATUS[s].t}</span>`;

/* ---------- 拠点の稼働・時間枠 ---------- */
const holidayOf = (plantId, ds) => HOLIDAYS.find(h => h.plant_id === plantId && h.date === ds);
function isClosed(plantId, ds) {
  const pl = plant(plantId);
  if (!pl.id) return false;
  if ((pl.closed_dows || []).includes(parseD(ds).getDay())) return {reason:'定休日'};
  const h = holidayOf(plantId, ds);
  return h ? {reason:h.reason} : false;
}
/* 指定日の予約件数（上限は設けない。承認判断の参考情報として表示する） */
function countOf(plantId, ds) {
  const t = PICKUPS.filter(p => p.plant_id === plantId && p.date === ds && !['canceled','rejected'].includes(p.status));
  return {
    drop: t.filter(p => p.type === 'drop').length,
    pickup: t.filter(p => p.type === 'pickup').length,
    pendingDrop: t.filter(p => p.type === 'drop' && p.status === 'pending').length,
    pendingPickup: t.filter(p => p.type === 'pickup' && p.status === 'pending').length
  };
}
const slotOf = (pl, p) => (pl.slots || []).find(s => s.from === p.begin_time && s.to === p.end_time);
const inHours = (pl, p) => p.begin_time >= pl.begin_time && p.end_time <= pl.end_time;

function toast(msg, kind) {

let bsModal = null;
function openModal(kind, payload, size) {
  state.modal = Object.assign({kind}, payload || {});
  document.getElementById('elModalDialog').className =
    'modal-dialog modal-dialog-scrollable ' + (size || 'modal-lg');
  renderModal();

    bsModal = new bootstrap.Modal(document.getElementById('appModal'));
    document.getElementById('appModal').addEventListener('hidden.bs.modal', () => { state.modal = null; });
  }

function closeModal() { if (bsModal) bsModal.hide(); state.modal = null; }
function renderModal() {
  if (!state.modal) return;
  const m = MODALS[state.modal.kind](state.modal);
  document.getElementById('elModalTitle').innerHTML = m.title;
  document.getElementById('elModalBody').innerHTML = m.body;

/* ---------- CSV 出力 ---------- */
function downloadCsv(filename, rows) {
  const csv = rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function dl(pairs) {

}
function kpi(t, v, sub, cls) {
  return `<div class="kpi ${cls || ''}"><div class="t">${t}</div><div class="v">${v}${sub ? ` <small>${sub}</small>` : ''}</div></div>`;
}

/* 変更依頼のときに提示する代替候補（稼働日と受入時間枠から作る） */
function findAlternatives(p) {
  const out = [], pl = plant(p.plant_id);
  for (let k = 1; k <= 14 && out.length < 4; k++) {
    const ds = D(k);
    if (ds === p.date || isClosed(pl.id, ds)) continue;
    const c = countOf(pl.id, ds);
    if (p.type === 'drop') {
      (pl.slots || []).forEach(s => {
        if (out.length >= 4) return;
        out.push({label:`${fmtMd(ds)} ${s.from}〜${s.to}`, sub:`持込 ${c.drop} 件`});
      });
    } else {
      out.push({label:fmtMd(ds), sub:`引取 ${c.pickup} 件`});
    }
  }
  return out;
}

  <div class="filterbar">
    <div class="f"><label>区分</label>
      <select class="form-select form-select-sm" data-act="apFilter" data-key="type">
        ${opts([{v:'all',t:'すべて'},{v:'drop',t:'持込'},{v:'pickup',t:'引取'}], f.type, false)}

    </div>

}

function approvalDetail(p) {
  if (!p) return '';
  const co = company(p.company_id), pl = plant(p.plant_id);
  const cl = isClosed(p.plant_id, p.date);
  const rows = [
    ['受付番号', `<span class="mono">${p.id}</span>`],
    ['区分', tBadge(p.type)],
    ['取引先', esc(co.name)],
    ['拠点', esc(pl.name)],
    [p.type === 'drop' ? '搬入希望日' : '引取希望日', fmtJp(p.date)],
    [p.type === 'drop' ? '受入時間枠' : '希望時間', timeRange(p)]
  ];
  if (p.type === 'drop') rows.push(
    ['車両ナンバー', esc(p.car_number)],
    ['ドライバー', `${esc(p.driver_name)}（${esc(p.driver_tel)}）`]);
  if (p.note) rows.push(['連絡事項', esc(p.note)]);
  rows.push(['申請', `${esc(p.via)}　${esc(p.applied_at)}`]);

  const alerts = [];
  if (cl) alerts.push({d:1, t:`${fmtMd(p.date)} は休業日です（${cl.reason}）`});
  if (p.type === 'drop' && !pl.is_delivery) alerts.push({d:1, t:`${pl.name} は持込の受入に対応していません`});
  if (p.type === 'pickup' && !pl.is_pickup) alerts.push({d:1, t:`${pl.name} は引取に対応していません`});

  return `<div class="card mb-3">
    <div class="card-head">${p.id}　${tBadge(p.type)}　${stBadge(p.status)}</div>
    <div class="card-body">
      ${alerts.length ? `<div class="d-flex flex-column gap-2 mb-3">${alerts.map(a =>
        `<div class="warnbox ${a.d ? 'danger' : ''}">${ic('alert',15)}<span>${esc(a.t)}</span></div>`).join('')}</div>` : ''}

      <h6 class="mt-3 mb-2" style="font-size:14px;font-weight:700">申告内容</h6>
      <div class="table-wrap"><table class="table table-sm mb-0">
        <thead><tr><th>品目</th><th>区分</th><th class="num">申告数量</th></tr></thead>
        <tbody>${linesOf(p.id).map(l => `<tr>
          <td>${esc(item(l.item_id).name)}${item(l.item_id).is_value ? ' <span class="badge b-neutral b-sq">有価物</span>' : ''}</td>
          <td style="font-size:12px">${itemTypeName(item(l.item_id).type)}</td>
          <td class="num">${dec(l.qty)} ${esc(unit(l.unit_id).name)}</td></tr>`).join('')}

      </div>
    </div>
  </div>`;
}

/* ---------- 予約詳細 ---------- */

  const p = pk(m.id), co = company(p.company_id), pl = plant(p.plant_id);
  const rows = [
    ['受付番号', `<span class="mono">${p.id}</span>`],

  if (p.type === 'drop') rows.push(['車両ナンバー', esc(p.car_number)], ['ドライバー', `${esc(p.driver_name)}（${esc(p.driver_tel)}）`]);

function pxValidate() {
  const d = state.proxy, e = [];
  if (!d.company_id) e.push('取引先を選択してください。');
  if (!d.type) e.push('受入方法を選択してください。');
  if (!d.date) e.push('日付を入力してください。');
  if (d.type === 'drop') {
    if (!d.slotId) e.push('受入時間枠を選択してください。');
    if (!d.car_number.trim()) e.push('車両ナンバーを入力してください。');
    if (!d.driver_name.trim()) e.push('ドライバー名を入力してください。');
    if (!d.driver_tel.trim()) e.push('ドライバーの連絡先を入力してください。');
  } else if (d.type === 'pickup') {
    if (!d.begin_time) e.push('引取希望時間の開始を入力してください。');
    if (!d.end_time) e.push('引取希望時間の終了を入力してください。');
    if (d.begin_time && d.end_time && d.end_time <= d.begin_time) e.push('終了時間は開始時間より後にしてください。');
  }
  d.lines.forEach((l,i) => {
    const n = `品目 ${i+1}：`;
    if (!l.item_id) e.push(n + '品目を選択してください。');
    if (!String(l.qty).trim()) e.push(n + '申告数量を入力してください。');
    else if (isNaN(Number(l.qty))) e.push(n + '申告数量は数字で入力してください。');
    if (!l.unit_id) e.push(n + '単位を選択してください。');
  });
  d.errors = e;
  return e.length === 0;
}
function pxSubmit() {
  if (!pxValidate()) { render(); return; }
  const d = state.proxy, now = new Date(), pl = plant(d.plant_id);
  const s = (pl.slots || []).find(x => x.id === d.slotId);
  const p = {
    id: nextPickupNo(), type:d.type, status:'pending',
    company_id:d.company_id, plant_id:d.plant_id, date:d.date,
    begin_time: d.type === 'drop' ? s.from : d.begin_time,
    end_time:   d.type === 'drop' ? s.to   : d.end_time,
    applied_at:`${D(0)} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    via:'電話（代行入力）', note:d.note
  };
  if (d.type === 'drop') Object.assign(p, {car_number:d.car_number, driver_name:d.driver_name, driver_tel:d.driver_tel});
  PICKUPS.unshift(p);
  d.lines.forEach(l => PICKUP_ITEMS.push({id:'pi' + (++_pi), pickup_id:p.id,
    item_id:l.item_id, unit_id:l.unit_id, qty:Number(l.qty)}));
  state.proxy = blankProxy();
  state.route = 'approvals';
  state.approval.sel = p.id;
  toast(`${p.id} を登録しました。`);
  render();
}

/* =========================================================================
   受付時間・休業日の設定（拠点ごと）
   ========================================================================= */
function monthDays(ym) {
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= last.getDate(); d++) cells.push(dstr(new Date(y, m-1, d)));
  while (cells.length % 7) cells.push(null);
  return cells;
}
const shiftMonth = (ym, n) => {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
};
const monthLabel = ym => `${ym.split('-')[0]}年${Number(ym.split('-')[1])}月`;
/* 今後の予約件数（受入可否を切り替えるときの影響確認に使う） */
function futureCount(plantId, type) {
  return PICKUPS.filter(p => p.plant_id === plantId && p.type === type &&
    p.date >= D(0) && ['pending','approved'].includes(p.status)).length;
}

function viewHours() {
  const h = state.hours, pl = plant(h.plantId);
  const cells = monthDays(h.month);
  const cal = cells.map(ds => {
    if (!ds) return `<div class="day blank"></div>`;
    const d = parseD(ds), cl = isClosed(pl.id, ds), c = countOf(pl.id, ds);
    const hol = holidayOf(pl.id, ds);
    const cls = [cl ? 'off' : (c.drop + c.pickup > 0 ? 'busy' : ''), ds === D(0) ? 'today' : ''].join(' ');
    return `<button class="day ${cls}" data-act="openHoliday" data-date="${ds}">

/* =========================================================================
   入場受付・計量
   ========================================================================= */
/* 申告数量の重量換算（kg）。t/kg 以外の単位は換算しない */
function declaredKg(pickupId) {
  return linesOf(pickupId).reduce((s,l) => {
    const u = unit(l.unit_id).name;
    if (u === 't') return s + Number(l.qty) * 1000;
    if (u === 'kg') return s + Number(l.qty);
    return s;
  }, 0);
}
const todayList = () => PICKUPS.filter(p => p.date === D(0) && inScope(p) && ['approved','arrived','done'].includes(p.status));
function nextReceiptNumber(plantId, ds) {
  const n = PICKUPS.filter(p => p.plant_id === plantId && p.date === ds && p.receipt_number)
    .reduce((a,p) => Math.max(a, p.receipt_number), 0);
  return n + 1;
}

function viewReception() {
  const q = state.reception.q.trim();
  let list = todayList();
  if (q) list = list.filter(p => (p.id + (p.car_number || '') + company(p.company_id).name).includes(q));
  list.sort((a,b) => a.begin_time < b.begin_time ? -1 : 1);

  const st = p => p.status === 'done' ? {t:'計量済', c:'b-approved'}
    : p.status === 'arrived' ? {t:'入場済（計量待ち）', c:'b-pending'} : {t:'未着', c:'b-neutral'};

  const rows = list.map(p => {
    const s = st(p);
    return `<tr>
      <td class="mono">${p.id}${p.receipt_number ? `<div class="text-secondary" style="font-size:11px">伝票 No.${p.receipt_number}</div>` : ''}</td>
      <td>${tBadge(p.type)}</td>
      <td class="mono nowrap">${timeRange(p)}</td>
      <td>${esc(company(p.company_id).name)}<div class="text-secondary" style="font-size:11px">${esc(plantShort(p.plant_id))}</div></td>
      <td style="font-size:13px">${esc(linesText(p.id))}</td>
      <td class="mono" style="font-size:13px">${esc(p.car_number || '—')}</td>
      <td>${p.weight != null ? `<b>${num(p.weight)}</b> kg` : '—'}</td>
      <td><span class="badge ${s.c}">${s.t}</span>${p.arrived_at ? `<div class="text-secondary" style="font-size:11px">入場 ${esc(p.arrived_at)}</div>` : ''}</td>
      <td class="text-end text-nowrap">
        ${p.status === 'approved' ? `<button class="btn btn-primary btn-sm" data-act="doArrive" data-id="${p.id}">入場受付</button>` : ''}
        ${p.status === 'arrived' ? `<button class="btn btn-primary btn-sm" data-act="openWeigh" data-id="${p.id}">計量入力</button>` : ''}
        ${p.status === 'done' ? `<button class="btn btn-outline-secondary btn-sm" data-act="openPickupDetail" data-id="${p.id}">実績を見る</button>` : ''}
        ${p.status !== 'done' ? `<button class="btn btn-outline-danger btn-sm ms-1" data-act="openRefuse" data-id="${p.id}">受入不可</button>` : ''}
      </td></tr>`;
  }).join('');

  const arrived = list.filter(p => p.status === 'arrived').length;
  const done = list.filter(p => p.status === 'done').length;
  const netToday = list.filter(p => p.weight).reduce((s,p) => s + p.weight, 0);

  return pageHead('入場受付・計量',
    `<button class="btn btn-outline-primary btn-sm" data-act="openSpot">${ic('plus',15)}飛び込み搬入を登録</button>`) +
  `<div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">${kpi('本日の予定', list.length + ' <small>件</small>')}</div>
    <div class="col-6 col-lg-3">${kpi('入場済（計量待ち）', arrived + ' <small>件</small>', '', arrived ? 'alert-kpi' : '')}</div>
    <div class="col-6 col-lg-3">${kpi('計量済', done + ' <small>件</small>')}</div>
    <div class="col-6 col-lg-3">${kpi('本日の正味重量', num(netToday) + ' <small>kg</small>')}</div>
  </div>
  <div class="filterbar">
    <div class="f" style="flex:1"><label>検索</label>
      <input type="text" class="form-control" data-act="recQ" value="${esc(state.reception.q)}" placeholder="受付番号・車両ナンバー・取引先" autocomplete="off"></div>
    <div class="align-self-center fw-bold">${fmtJp(D(0))}</div>
  </div>
  <div class="table-wrap">
    <table class="table table-hover mb-0">
      <thead><tr><th>受付番号</th><th>区分</th><th>時間</th><th>取引先・拠点</th><th>申告内容</th><th>車両ナンバー</th><th>正味重量</th><th>状態</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="9" class="text-center text-secondary py-4">該当する予約がありません</td></tr>`}</tbody>
    </table>
  </div>`;
}

/* ---------- 計量モーダル ---------- */
function weighInit(id) {
  return {
    id, total_weight:'', car_weight:'',
    lines: linesOf(id).map(l => ({id:l.id, item_id:l.item_id, unit_id:l.unit_id, qty:l.qty, actual_qty:dec(l.qty)})),
    diff_reason:''
  };
}
var MODALS_WEIGH = m => {
  const p = pk(m.id);
  const net = Number(m.total_weight) - Number(m.car_weight);
  const netOk = m.total_weight !== '' && m.car_weight !== '' && net > 0;
  const dec_kg = declaredKg(p.id);
  const diff = netOk ? net - dec_kg : 0;
  const hasDiff = netOk && dec_kg > 0 && Math.abs(diff) / dec_kg > 0.1;

  const lineRows = m.lines.map((l,i) => {
    const d = Number(l.actual_qty) - Number(l.qty);
    return `<tr>
      <td><select class="form-select form-select-sm" data-mod="lines.${i}.item_id" data-rerender="1">${opts(o1(ITEMS), l.item_id, false)}</select></td>
      <td class="num">${dec(l.qty)}</td>
      <td class="num"><input type="text" inputmode="decimal" class="form-control form-control-sm text-end" style="width:96px" data-mod="lines.${i}.actual_qty" data-rerender="1" value="${esc(l.actual_qty)}"></td>
      <td><select class="form-select form-select-sm" style="width:90px" data-mod="lines.${i}.unit_id" data-rerender="1">${opts(o1(UNITS), l.unit_id, false)}</select></td>
      <td class="num ${Math.abs(d) > 0.001 ? 'text-danger fw-bold' : ''}">${d > 0 ? '+' : ''}${dec(d)}</td>
      <td>${m.lines.length > 1 ? `<button class="btn btn-outline-danger btn-sm btn-icon" data-act="weighRemoveLine" data-idx="${i}" aria-label="削除">${ic('trash',14)}</button>` : ''}</td>
    </tr>`;
  }).join('');

  return {
    title:`計量入力　${p.id}　${esc(company(p.company_id).name)}`,
    body:`<div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><label class="form-label">総重量（kg）<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="total_weight" data-rerender="1" value="${esc(m.total_weight)}" placeholder="例：6120"></div>
        <div class="col-6 col-md-3"><label class="form-label">空車重量（kg）<span class="req">必須</span></label>
          <input type="text" inputmode="numeric" class="form-control" data-mod="car_weight" data-rerender="1" value="${esc(m.car_weight)}" placeholder="例：2480"></div>
        <div class="col-12 col-md-6">${kpi('正味重量（自動算出）', netOk ? num(net) + ' <small>kg</small>' : '<small class="text-secondary">総重量・空車重量を入力</small>',
          netOk && dec_kg ? `申告 ${num(dec_kg)} kg ／ 差異 ${diff > 0 ? '+' : ''}${num(diff)} kg` : '')}</div>
      </div>
      <h6 style="font-size:14px;font-weight:700">実搬入内容</h6>
      <div class="table-wrap mb-2"><table class="table table-sm mb-0">
        <thead><tr><th style="width:34%">品目</th><th class="num">申告</th><th class="num">実数量</th><th>単位</th><th class="num">差異</th><th></th></tr></thead>
        <tbody>${lineRows}</tbody></table></div>
      <button class="btn btn-outline-primary btn-sm mb-3" data-act="weighAddLine">${ic('plus',15)}品目を追加</button>
      ${hasDiff ? `<div class="mb-3"><label class="form-label">差異理由<span class="req">必須</span></label>
        <select class="form-select" data-mod="diff_reason">${opts([
          {v:'実測差（申告は目安）',t:'実測差（申告は目安）'},{v:'品目の相違',t:'品目の相違'},
          {v:'積込時に追加発生分あり',t:'積込時に追加発生分あり'},{v:'異物混入',t:'異物混入'},{v:'その他',t:'その他'}], m.diff_reason)}</select></div>` : ''}

    foot:`<button class="btn btn-outline-secondary" data-act="closeModal">キャンセル</button>
          <button class="btn btn-primary" data-act="doWeigh" data-id="${p.id}">実績を確定する</button>`
  };
};

function filteredActuals() {
  const f = state.actuals;
  return PICKUPS.filter(p =>
    p.status === 'done' && inScope(p) &&
    p.date >= f.from && p.date <= f.to &&
    (!f.companyId || p.company_id === f.companyId) &&
    (!f.type || p.type === f.type) &&
    (!f.itemId || linesOf(p.id).some(l => l.item_id === f.itemId)) &&
    (!f.diffOnly || (p.diff_reason && p.diff_reason !== ''))
  ).sort((a,b) => a.date === b.date ? (a.id < b.id ? 1 : -1) : (a.date < b.date ? 1 : -1));
}

function getPath(o, p) { return p.split('.').reduce((t,k) => (t == null ? t : t[k]), o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let t = o;
  for (let i = 0; i < ks.length - 1; i++) { if (t[ks[i]] == null) t[ks[i]] = {}; t = t[ks[i]]; }
  t[ks[ks.length-1]] = v;
}
const MASTERS = {
  m_plants: {
    title:'拠点', data:() => PLANTS,
    cols:[
      {k:'name', label:'拠点名', type:'text', list:true, req:true},
      {k:'is_delivery', label:'持込受入', type:'bool', list:true},
      {k:'is_pickup', label:'引取対応', type:'bool', list:true},
      {k:'begin_time', label:'引取対応 開始', type:'time', list:true},
      {k:'end_time', label:'引取対応 終了', type:'time', list:true},
      {k:'postalcode', label:'郵便番号', type:'text'},
      {k:'pref', label:'都道府県', type:'text'},
      {k:'address', label:'住所', type:'text', list:true},
      {k:'phone', label:'電話番号', type:'text', list:true}
    ]
  },
  m_items: {
    title:'品目', data:() => ITEMS,
    cols:[
      {k:'name', label:'品目名', type:'text', list:true, req:true},
      {k:'type', label:'廃棄物区分', type:'select', list:true, opts:() => ITEM_TYPES, fmt:v => itemTypeName(v), req:true},
      {k:'is_value', label:'有価物', type:'bool', list:true}
    ]
  },
  m_units: {
    title:'単位', data:() => UNITS,
    cols:[{k:'name', label:'単位', type:'text', list:true, req:true}]
  }
};

function cellText(col, row) {
  const v = getPath(row, col.k);
  if (col.type === 'bool') return v ? `<span class="badge b-approved b-sq">${ic('check',13)}</span>` : '<span class="text-secondary">—</span>';
  if (col.fmt) return v == null || v === '' ? '<span class="text-secondary">—</span>' : col.fmt(v);
  if (col.type === 'select' && col.opts) {
    const o = col.opts().find(x => String(x.v) === String(v));
    return o ? esc(o.t) : (v ? esc(v) : '<span class="text-secondary">—</span>');
  }
  return v == null || v === '' ? '<span class="text-secondary">—</span>' : esc(v);
}
function viewMaster(route) {
  const m = MASTERS[route], rows = m.data(), cols = m.cols.filter(c => c.list);

    `<button class="btn btn-primary btn-sm" data-act="mAdd" data-m="${route}">${ic('plus',15)}新規登録</button>
